<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>祈个福H5 UI设计修改 · 任务列表</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        :root {
            --bg-warm: #F5E6D3;
            --primary: #8B5A2B;
            --primary-light: #A67B4B;
            --accent: #C04040;
            --trust: #7BA5A6;
            --text-dark: #4A3728;
            --text-light: #8B7355;
            --card-bg: #FDF8F3;
            --border: rgba(184, 134, 11, 0.3);
        }
        body { font-family: 'Noto Serif SC', serif; background: var(--bg-warm); min-height: 100vh; overflow-x: hidden; }
        body::before {
            content: "福";
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 400px;
            color: rgba(139,90,43,0.03);
            pointer-events: none;
            z-index: 0;
            font-family: 'Ma Shan Zheng', cursive;
        }

        .top-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 14px 24px; background: var(--bg-warm); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 10px rgba(139,90,43,0.08); }
        .top-title { font-family: 'Ma Shan Zheng', cursive; color: var(--primary); font-size: 20px; letter-spacing: 4px; }
        .top-back { font-size: 12px; color: var(--primary-light); cursor: pointer; text-decoration: none; }
        .top-back:hover { color: var(--primary); }

        .main-container { padding: 70px 20px 40px; max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }

        .header-section { text-align: center; margin-bottom: 25px; padding: 20px; }
        .header-section h1 { font-family: 'Ma Shan Zheng', cursive; font-size: 32px; color: var(--primary); letter-spacing: 8px; margin-bottom: 8px; }
        .header-section .subtitle { font-size: 13px; color: var(--text-light); letter-spacing: 3px; }

        .stats-row { display: flex; justify-content: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 18px; min-width: 80px; text-align: center; box-shadow: 0 2px 8px rgba(139,90,43,0.06); }
        .stat-card .num { font-family: 'Ma Shan Zheng', cursive; font-size: 28px; color: var(--primary); line-height: 1; }
        .stat-card .label { font-size: 11px; color: var(--text-light); margin-top: 4px; letter-spacing: 2px; }
        .stat-card.completed .num { color: var(--trust); }
        .stat-card.pending .num { color: var(--accent); }
        .stat-card.progress .num { color: var(--primary-light); }

        .progress-bar { height: 8px; background: rgba(139,90,43,0.1); border-radius: 4px; overflow: hidden; margin: 15px 5px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--trust), var(--primary)); transition: width 0.5s ease; border-radius: 4px; }
        .progress-text { text-align: center; font-size: 11px; color: var(--text-light); margin-top: 6px; letter-spacing: 2px; }

        .filter-bar { display: flex; gap: 8px; margin: 20px 0 15px; flex-wrap: wrap; }
        .filter-group { display: flex; align-items: center; gap: 6px; }
        .filter-label { font-size: 11px; color: var(--text-light); }
        .filter-btn { padding: 7px 14px; border-radius: 18px; font-size: 12px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-dark); cursor: pointer; transition: all .2s; letter-spacing: 1px; }
        .filter-btn:hover { background: rgba(139,90,43,0.08); }
        .filter-btn.active { background: var(--primary); color: var(--card-bg); border-color: var(--primary); }

        .search-box { flex: 1; min-width: 120px; position: relative; }
        .search-input { width: 100%; padding: 8px 14px 8px 36px; border-radius: 18px; border: 1px solid var(--border); background: var(--card-bg); font-size: 12px; color: var(--text-dark); font-family: inherit; outline: none; }
        .search-input:focus { border-color: var(--primary); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 14px; }

        .category-section { margin-bottom: 28px; }
        .category-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
        .category-title { display: flex; align-items: center; gap: 8px; font-family: 'Ma Shan Zheng', cursive; font-size: 18px; color: var(--primary); letter-spacing: 3px; }
        .category-icon { font-size: 20px; }
        .category-count { font-size: 11px; color: var(--text-light); background: var(--card-bg); padding: 3px 10px; border-radius: 10px; border: 1px solid var(--border); }
        .category-count .done { color: var(--trust); font-weight: 600; }
        .category-count .total { color: var(--text-dark); }

        .task-list { display: flex; flex-direction: column; gap: 8px; }
        .task-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; transition: all .2s; cursor: pointer; position: relative; overflow: hidden; }
        .task-item:hover { background: rgba(139,90,43,0.04); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(139,90,43,0.1); }
        .task-item.completed { opacity: 0.7; }
        .task-item.completed .task-name { text-decoration: line-through; color: var(--text-light); }

        .task-checkbox { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; margin-top: 2px; position: relative; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; }
        .task-checkbox:hover { border-color: var(--primary); }
        .task-checkbox.completed { background: var(--trust); border-color: var(--trust); }
        .task-checkbox.completed::after { content: '✓'; color: #fff; font-size: 12px; font-weight: bold; }

        .task-content { flex: 1; min-width: 0; }
        .task-name { font-size: 14px; color: var(--text-dark); font-weight: 500; margin-bottom: 4px; line-height: 1.4; }
        .task-path { font-size: 11px; color: var(--text-light); font-family: 'Courier New', monospace; background: rgba(139,90,43,0.05); padding: 2px 8px; border-radius: 6px; display: inline-block; margin-bottom: 4px; }
        .task-desc { font-size: 11px; color: var(--text-light); line-height: 1.5; }
        .task-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .priority-tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 10px; letter-spacing: 1px; }
        .priority-high { background: rgba(192,64,64,0.12); color: #C04040; border: 1px solid rgba(192,64,64,0.2); }
        .priority-medium { background: rgba(184,134,11,0.12); color: #B8860B; border: 1px solid rgba(184,134,11,0.2); }
        .priority-low { background: rgba(139,90,43,0.1); color: #8B5A2B; border: 1px solid rgba(139,90,43,0.15); }
        .status-tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 10px; letter-spacing: 1px; }
        .status-completed { background: rgba(123,165,166,0.15); color: var(--trust); border: 1px solid rgba(123,165,166,0.25); }
        .status-pending { background: rgba(192,64,64,0.1); color: #C04040; border: 1px solid rgba(192,64,64,0.2); }

        .task-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .action-btn { padding: 4px 10px; border-radius: 8px; font-size: 10px; border: 1px solid var(--border); background: transparent; color: var(--text-light); cursor: pointer; transition: all .2s; }
        .action-btn:hover { background: var(--primary); color: var(--card-bg); border-color: var(--primary); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); font-size: 13px; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

        .bottom-actions { display: flex; gap: 12px; justify-content: center; margin-top: 30px; padding: 20px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); }
        .big-btn { padding: 12px 28px; border-radius: 12px; font-size: 13px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-dark); cursor: pointer; transition: all .2s; font-family: inherit; letter-spacing: 2px; }
        .big-btn:hover { background: var(--primary); color: var(--card-bg); border-color: var(--primary); transform: translateY(-1px); }
        .big-btn.primary { background: var(--primary); color: var(--card-bg); border-color: var(--primary); }
        .big-btn.primary:hover { background: var(--primary-light); border-color: var(--primary-light); }

        @media (max-width: 480px) {
            .header-section h1 { font-size: 26px; letter-spacing: 6px; }
            .stat-card { padding: 8px 14px; min-width: 70px; }
            .stat-card .num { font-size: 22px; }
            .task-name { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-title">祈个福</div>
        <a href="#" onclick="try{window.parent.goPage(0);}catch(e){window.history.back();}return false;" class="top-back">← 返回展示台</a>
    </div>

    <div class="main-container">
        <div class="header-section">
            <h1>祈个福H5 UI设计修改</h1>
            <div class="subtitle">项目任务进度跟踪 · 共 <span id="total-tasks">0</span> 项任务</div>
            <div class="stats-row">
                <div class="stat-card completed">
                    <div class="num" id="stat-completed">0</div>
                    <div class="label">已完成</div>
                </div>
                <div class="stat-card pending">
                    <div class="num" id="stat-pending">0</div>
                    <div class="label">待处理</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="stat-total">0</div>
                    <div class="label">总任务</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progress-text">完成进度 0%</div>
        </div>

        <div class="filter-bar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="search-input" placeholder="搜索任务名称或路径...">
            </div>
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="completed">已完成</button>
                <button class="filter-btn" data-filter="pending">待处理</button>
            </div>
        </div>

        <div id="task-container"></div>

        <div class="bottom-actions">
            <button class="big-btn" onclick="markAllCompleted()">✓ 全部标记完成</button>
            <button class="big-btn" onclick="resetAll()">↺ 重置所有状态</button>
            <button class="big-btn primary" onclick="exportProgress()">💾 导出进度</button>
        </div>
    </div>

    <script>
        const tasks = [
            { id: 1, name: '祈福拜佛主页面', path: 'index.html', desc: '含佛像切换、上香、点灯、供奉、跪拜、求签、许愿、问佛功能', category: 'page', priority: 'high', status: 'pending' },
            { id: 2, name: '项目展示台页面', path: 'showcase.html', desc: 'H5页面展示预览与导航入口', category: 'page', priority: 'high', status: 'pending' },

            { id: 3, name: '超度追思页面', path: 'pages/remembrance.html', desc: '万佛朝宗/鲜花围绕/音容宛在三种场景样式', category: 'pages', priority: 'high', status: 'pending' },
            { id: 4, name: '灵宠放生页面', path: 'pages/animal-release.html', desc: '龙宫背景、灵宠池塘、放生动画、3x3卡片网格布局', category: 'pages', priority: 'high', status: 'pending' },
            { id: 5, name: '个人中心页面', path: 'pages/profile.html', desc: '用户资产展示、功德等级、功能入口导航', category: 'pages', priority: 'high', status: 'pending' },
            { id: 6, name: '设置页面', path: 'pages/settings.html', desc: '音效开关、消息推送设置、隐藏管理入口', category: 'pages', priority: 'medium', status: 'pending' },
            { id: 7, name: '天使守护页面', path: 'pages/angel.html', desc: '传播天使功能模块', category: 'pages', priority: 'medium', status: 'pending' },
            { id: 8, name: '分享卡片页面', path: 'pages/share-card.html', desc: '社交分享卡片生成与预览', category: 'pages', priority: 'medium', status: 'pending' },
            { id: 9, name: '福运翻牌页面', path: 'pages/flip-card.html', desc: '翻牌抽奖互动游戏', category: 'pages', priority: 'medium', status: 'pending' },
            { id: 10, name: '老虎机页面', path: 'pages/slot-machine.html', desc: '经典老虎机游戏效果', category: 'pages', priority: 'medium', status: 'pending' },
            { id: 11, name: '物品管理页面', path: 'pages/item-manager.html', desc: '道具/物品库管理功能', category: 'pages', priority: 'medium', status: 'pending' },
            { id: 12, name: '后台管理页面', path: 'pages/admin.html', desc: '管理员后台数据管理入口', category: 'pages', priority: 'low', status: 'pending' },
            { id: 13, name: '测试页面', path: 'pages/test.html', desc: '功能测试与调试入口', category: 'pages', priority: 'low', status: 'pending' },

            { id: 14, name: '全局样式文件', path: 'assets/css/style.css', desc: '包含背景系统、弹窗样式、按钮组件、动画效果等全局CSS', category: 'css', priority: 'high', status: 'pending' },

            { id: 15, name: '主逻辑脚本', path: 'assets/js/main.js', desc: '核心交互逻辑：上香、点灯、供奉、跪拜、求签、许愿、问佛等', category: 'js', priority: 'high', status: 'pending' },
            { id: 16, name: '应用状态管理', path: 'assets/js/app-state.js', desc: '用户数据持久化、佛光/欢喜值、任务状态管理', category: 'js', priority: 'high', status: 'pending' },
            { id: 17, name: '灵宠放生逻辑', path: 'assets/js/animal-release.js', desc: '灵宠养殖、放生交互、奖励计算逻辑', category: 'js', priority: 'medium', status: 'pending' },
            { id: 18, name: '追思页面逻辑', path: 'assets/js/remembrance.js', desc: '追思场景切换、音容宛在聊天交互', category: 'js', priority: 'medium', status: 'pending' },
            { id: 19, name: '图标管理脚本', path: 'assets/js/icon-manager.js', desc: '图标资源管理与动态加载', category: 'js', priority: 'medium', status: 'pending' },
            { id: 20, name: '应用图标配置', path: 'assets/js/app-icons.js', desc: '图标资源配置与映射表', category: 'js', priority: 'medium', status: 'pending' },

            { id: 21, name: '祈愿游戏主页面', path: 'pray-game/index.html', desc: '祈愿游戏模块主入口页面', category: 'game', priority: 'high', status: 'pending' },
            { id: 22, name: '祈愿游戏逻辑', path: 'pray-game/game.js', desc: '游戏核心逻辑、关卡配置、计分系统', category: 'game', priority: 'high', status: 'pending' },
            { id: 23, name: '祈愿游戏样式', path: 'pray-game/style.css', desc: '游戏界面专用样式与动画效果', category: 'game', priority: 'medium', status: 'pending' },
            { id: 24, name: 'UI设计稿 v6', path: 'pray-game/ui-design-complete-v6.html', desc: '游戏界面UI设计方案版本6', category: 'game', priority: 'low', status: 'pending' },
            { id: 25, name: 'UI设计稿 v52', path: 'pray-game/ui-design-complete-v52.html', desc: '游戏界面UI设计方案版本52', category: 'game', priority: 'low', status: 'pending' },
            { id: 26, name: 'UI设计稿 v64', path: 'pray-game/ui-design-v64.html', desc: '游戏界面UI设计方案版本64', category: 'game', priority: 'low', status: 'pending' },
            { id: 27, name: '游戏服务脚本', path: 'pray-game/server.ps1', desc: '游戏模块本地服务启动脚本', category: 'game', priority: 'low', status: 'pending' }
        ];

        const categories = {
            page: { name: '主页面', icon: '📄', color: 'var(--primary)' },
            pages: { name: '功能页面', icon: '📱', color: 'var(--primary-light)' },
            css: { name: '样式文件', icon: '🎨', color: '#B8860B' },
            js: { name: '脚本文件', icon: '⚙️', color: '#8B5A2B' },
            game: { name: '祈愿游戏模块', icon: '🎮', color: 'var(--accent)' }
        };

        const STORAGE_KEY = 'qigefu-task-progress';

        function loadProgress() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const savedTasks = JSON.parse(saved);
                    tasks.forEach(t => {
                        const st = savedTasks.find(s => s.id === t.id);
                        if (st) t.status = st.status;
                    });
                }
            } catch (e) { console.warn('加载进度失败', e); }
        }

        function saveProgress() {
            try {
                const toSave = tasks.map(t => ({ id: t.id, status: t.status }));
                localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
            } catch (e) { console.warn('保存进度失败', e); }
        }

        function renderTasks() {
            const container = document.getElementById('task-container');
            const filter = document.querySelector('.filter-btn.active').getAttribute('data-filter');
            const search = document.getElementById('search-input').value.toLowerCase().trim();

            container.innerHTML = '';

            Object.keys(categories).forEach(catKey => {
                const catTasks = tasks.filter(t => {
                    if (t.category !== catKey) return false;
                    if (filter !== 'all' && t.status !== filter) return false;
                    if (search && !t.name.toLowerCase().includes(search) && !t.path.toLowerCase().includes(search)) return false;
                    return true;
                });

                if (catTasks.length === 0) return;

                const categoryHTML = `
                    <div class="category-section" data-category="${catKey}">
                        <div class="category-header">
                            <div class="category-title">
                                <span class="category-icon">${categories[catKey].icon}</span>
                                <span>${categories[catKey].name}</span>
                            </div>
                            <div class="category-count">
                                <span class="done">${catTasks.filter(t => t.status === 'completed').length}</span>
                                /
                                <span class="total">${catTasks.length}</span>
                            </div>
                        </div>
                        <div class="task-list">
                            ${catTasks.map(t => `
                                <div class="task-item ${t.status}" data-id="${t.id}">
                                    <div class="task-checkbox ${t.status === 'completed' ? 'completed' : ''}"></div>
                                    <div class="task-content">
                                        <div class="task-name">${t.name}</div>
                                        <div class="task-path">${t.path}</div>
                                        ${t.desc ? `<div class="task-desc">${t.desc}</div>` : ''}
                                        <div class="task-meta">
                                            <span class="priority-tag priority-${t.priority}">${t.priority === 'high' ? '优先级：高' : t.priority === 'medium' ? '优先级：中' : '优先级：低'}</span>
                                            <span class="status-tag status-${t.status}">${t.status === 'completed' ? '已完成' : '待处理'}</span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', categoryHTML);
            });

            if (container.innerHTML === '') {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">🌿</div>没有找到匹配的任务</div>`;
            }

            updateStats();
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.status === 'completed').length;
            const pending = tasks.filter(t => t.status === 'pending').length;
            const progress = Math.round((completed / total) * 100);

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-completed').textContent = completed;
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('total-tasks').textContent = total;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-text').textContent = `完成进度 ${progress}% (${completed}/${total})`;
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.status = task.status === 'completed' ? 'pending' : 'completed';
                saveProgress();
                renderTasks();
            }
        }

        function markAllCompleted() {
            if (!confirm('确定要将所有任务标记为完成吗？')) return;
            tasks.forEach(t => t.status = 'completed');
            saveProgress();
            renderTasks();
        }

        function resetAll() {
            if (!confirm('确定要重置所有任务状态吗？')) return;
            tasks.forEach(t => t.status = 'pending');
            saveProgress();
            renderTasks();
        }

        function exportProgress() {
            const completed = tasks.filter(t => t.status === 'completed');
            const pending = tasks.filter(t => t.status === 'pending');
            const progress = Math.round((completed.length / tasks.length) * 100);
            let report = `==============================\n`;
            report += `祈个福H5 UI设计修改 进度报告\n`;
            report += `生成时间: ${new Date().toLocaleString('zh-CN')}\n`;
            report += `==============================\n\n`;
            report += `【总体进度】 ${progress}% (${completed.length}/${tasks.length})\n\n`;
            report += `【已完成任务】 (${completed.length}项)\n`;
            completed.forEach((t, i) => {
                report += `  ${i + 1}. ${t.name} [${t.path}]\n`;
            });
            report += `\n【待处理任务】 (${pending.length}项)\n`;
            pending.forEach((t, i) => {
                report += `  ${i + 1}. ${t.name} [${t.path}] - 优先级:${t.priority === 'high' ? '高' : t.priority === 'medium' ? '中' : '低'}\n`;
            });

            const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `祈个福任务进度_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('task-container').addEventListener('click', (e) => {
            const taskItem = e.target.closest('.task-item');
            if (taskItem) {
                const id = parseInt(taskItem.getAttribute('data-id'));
                toggleTask(id);
            }
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderTasks();
            });
        });

        document.getElementById('search-input').addEventListener('input', renderTasks);

        loadProgress();
        renderTasks();
    </script>
</body>
</html>
