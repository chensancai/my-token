<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>星 际 弹 珠</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    background: radial-gradient(ellipse at center, #3a2614 0%, #1a1008 100%);
    color: #fff6d8;
  }

  /* ===== 顶部聚光灯环境光晕 ===== */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 50% 12%, rgba(255, 210, 120, 0.35) 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(255, 180, 80, 0.25) 0%, transparent 55%);
    pointer-events: none; z-index: 0;
  }

  /* ===== 最外层容器 ===== */
  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 10px 16px;
  }

  /* ===== 顶部标题 ===== */
  .header {
    width: 100%;
    text-align: center;
    padding: 6px 0 10px;
    position: relative;
  }
  .title {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 10px;
    color: #ffe08a;
    text-shadow:
      0 0 6px #ffbe55,
      0 0 18px #ff9a3c,
      0 0 32px rgba(255, 160, 60, 0.7),
      2px 3px 0 #5a2e0a;
    padding-left: 10px;
  }
  .subtitle {
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 4px;
    color: #ffecc1;
    opacity: 0.85;
  }
  .cost-tag {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    background: rgba(90, 45, 10, 0.55);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 200, 120, 0.5);
    color: #ffd98a;
    letter-spacing: 1px;
  }

  /* ===== 小木偶吉祥物 ===== */
  .puppet {
    position: absolute;
    top: 4px; left: 6px;
    width: 56px; height: 56px;
    z-index: 20;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .puppet .body {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3c2, #d9a05b 65%, #7a4820 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 -4px 6px rgba(0,0,0,0.25);
    position: relative;
    border: 2px solid #5a2e0a;
  }
  .puppet .eye, .puppet .cover {
    position: absolute;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #3a1c05;
    top: 20px;
  }
  .puppet .eye.l { left: 14px; }
  .puppet .eye.r { right: 14px; }
  .puppet .mouth {
    position: absolute;
    bottom: 12px; left: 50%; transform: translateX(-50%);
    width: 14px; height: 7px;
    border-radius: 0 0 14px 14px / 0 0 7px 7px;
    background: #5a1a0a;
    border: 1px solid #3a0d05;
  }
  .puppet.peek .body { animation: peekShake 0.6s ease-in-out infinite alternate; }
  .puppet.peek .eye { background: transparent; }
  .puppet.peek .cover {
    width: 22px; height: 14px;
    background: linear-gradient(to bottom, #e8b878, #8a4a1a);
    border: 1px solid #3a1c05;
    top: 18px; border-radius: 4px;
  }
  .puppet.peek .cover.l { left: 6px;  transform: rotate(-10deg); }
  .puppet.peek .cover.r { right: 6px; transform: rotate(10deg); }
  @keyframes peekShake {
    from { transform: translateY(0) rotate(-2deg); }
    to   { transform: translateY(-2px) rotate(2deg); }
  }

  /* ===== 顶部中奖横幅 ===== */
  .result-banner {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translate(-50%, -120%) scale(0.8);
    background: linear-gradient(135deg, #ffecb0 0%, #ffb23c 50%, #ff6a1c 100%);
    color: #4a1a00;
    padding: 10px 22px;
    border-radius: 28px;
    border: 3px solid #5a2e0a;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    box-shadow:
      0 0 0 3px rgba(255,220,120,0.5),
      0 0 22px rgba(255, 170, 60, 0.85),
      0 6px 12px rgba(0,0,0,0.45),
      inset 0 2px 6px rgba(255,255,255,0.5);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    z-index: 35;
    transition: transform 0.45s cubic-bezier(0.17,0.88,0.32,1.35), opacity 0.35s;
  }
  .result-banner.show {
    transform: translate(-50%, 0) scale(1);
    opacity: 1;
    animation: bannerBounce 1.1s ease-in-out infinite;
  }
  @keyframes bannerBounce {
    0%, 100% { transform: translate(-50%, 0) scale(1); }
    50%      { transform: translate(-50%, -4px) scale(1.05); }
  }

/* ===== 顶部 LED 显示屏 ===== */
  .led-display {
    position: relative;
    margin: 6px 16px 0;
    padding: 16px 12px;
    background: #0a0a0a;
    border: 3px solid #3a0a0a;
    border-radius: 12px;
    box-shadow:
      inset 0 2px 8px rgba(255, 60, 60, 0.2),
      inset 0 -2px 8px rgba(0, 0, 0, 0.6),
      0 0 12px rgba(255, 40, 40, 0.25);
    text-align: center;
    overflow: hidden;
    min-height: 60px;
  }
  .led-display::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 30, 30, 0.06) 0 1px,
      transparent 1px 3px
    );
    pointer-events: none;
  }
  .led-text {
    font-family: 'Courier New', monospace;
    font-size: 22px;
    font-weight: 900;
    color: #ff3a3a;
    text-shadow: 0 0 10px #ff2a2a, 0 0 20px #ff2a2a;
    letter-spacing: 4px;
    white-space: nowrap;
    display: inline-block;
    position: relative;
    z-index: 1;
  }
  .led-text.flash {
    animation: ledFlash 0.6s ease-in-out 3;
  }
  @keyframes ledFlash {
    0%, 100% { color: #ff3a3a; text-shadow: 0 0 8px #ff2a2a, 0 0 16px #ff2a2a; }
    50%      { color: #fff2a0; text-shadow: 0 0 12px #ffcc3a, 0 0 24px #ff9030; }
  }

/* ===== 惊险一刻闪烁提示 ===== */
  .dramatic-hint {
    position: absolute;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%);
    font-size: 38px;
    pointer-events: none;
    z-index: 40;
    animation: dramaticBlink 0.28s ease-in-out infinite alternate;
    text-shadow: 0 0 12px #fff, 0 0 24px #ffbe55;
    display: none;
  }
  .dramatic-hint.show { display: block; }
  @keyframes dramaticBlink {
    from { opacity: 0.3; transform: translate(-50%, -50%) scale(0.9) rotate(-6deg); }
    to   { opacity: 1;   transform: translate(-50%, -50%) scale(1.25) rotate(6deg); }
  }

/* ===== 中部钉板主体 ===== */
  .stage {
    position: relative;
    width: 100%;
    flex: 1;
    max-width: 440px;
    min-height: 0;
    margin-top: 4px;
    border-radius: 22px;
    background:
      repeating-linear-gradient(92deg, rgba(90,50,20,0.04) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(8deg,  rgba(120,70,30,0.04) 0 2px, transparent 2px 11px),
      linear-gradient(135deg, #e9c892 0%, #d6a96a 45%, #b9884e 100%);
    box-shadow:
      inset 0 0 0 5px #6b3a14,
      inset 0 0 0 8px #3a1c05,
      inset 0 12px 28px rgba(255, 220, 150, 0.35),
      inset 0 -10px 24px rgba(40, 20, 5, 0.45),
      0 14px 28px rgba(0,0,0,0.55);
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* 顶部弧形喇叭口 */
  .hopper {
    position: relative;
    height: 50px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .hopper::before {
    content: "";
    position: absolute;
    top: -30px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 160px;
    background: radial-gradient(ellipse at 50% 100%, rgba(255, 220, 120, 0.15) 0%, transparent 65%);
    border-bottom-left-radius: 120px 80px;
    border-bottom-right-radius: 120px 80px;
    box-shadow: none;
    pointer-events: none;
  }
  .hopper-mouth {
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 90px; height: 22px;
    background: radial-gradient(ellipse at 50% 0%, #fff6c8, #7a4820 80%);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4) inset, 0 0 14px rgba(255,210,120,0.7);
  }
  .hopper-mouth::after {
    content: "▼";
    position: absolute;
    left: 50%; top: 4px;
    transform: translateX(-50%);
    color: #ffcf6a;
    font-size: 12px;
    text-shadow: 0 0 6px #ff9a3c;
    animation: downArrow 1.2s ease-in-out infinite;
  }
  @keyframes downArrow {
    0%, 100% { transform: translate(-50%, 0); opacity: 0.7; }
    50%      { transform: translate(-50%, 4px); opacity: 1; }
  }

  /* 钉板区域 */
  .peg-board {
    position: relative;
    flex: 1;
    margin: 6px 16px 0;
    border-top: 2px dashed rgba(90, 50, 20, 0.35);
  }

  .peg {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow:
      inset -3px -3px 5px rgba(0,0,0,0.45),
      inset 3px 3px 5px rgba(255,255,255,0.6),
      0 2px 4px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.35);
    pointer-events: none;
  }
  .peg::after {
    content: "";
    position: absolute;
    top: 2px; left: 3px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    filter: blur(0.5px);
  }

  /* 彩虹渐变颜色 — 6 种 */
  .peg.c1 { background: radial-gradient(circle at 30% 30%, #ffd5d5, #ff4d4d 55%, #9a1515 100%); }
  .peg.c2 { background: radial-gradient(circle at 30% 30%, #ffe9bf, #ff9a3c 55%, #a55310 100%); }
  .peg.c3 { background: radial-gradient(circle at 30% 30%, #fff8c8, #ffd93c 55%, #9a7e10 100%); }
  .peg.c4 { background: radial-gradient(circle at 30% 30%, #d8ffcc, #49c14e 55%, #176a1f 100%); }
  .peg.c5 { background: radial-gradient(circle at 30% 30%, #c8e3ff, #3c8dff 55%, #103a8a 100%); }
  .peg.c6 { background: radial-gradient(circle at 30% 30%, #e3caff, #a75aff 55%, #4a1a8a 100%); }

  /* 左右墙壁 */
  .wall {
    position: absolute; top: 0; bottom: 0;
    width: 10px;
    background: linear-gradient(to bottom, #6b3a14, #3a1c05);
    box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
    border-radius: 6px;
  }
  .wall.l { left: -16px; }
  .wall.r { right: -16px; }

  /* 45度斜挡板 */
  .baffle {
    position: absolute;
    top: 15%;
    right: 2%;
    width: 35%;
    height: 14px;
    background: linear-gradient(to right, #5a3010, #3a1c05);
    border-radius: 7px;
    transform: rotate(-45deg);
    transform-origin: left center;
    box-shadow:
        inset 0 -2px 4px rgba(0,0,0,0.5),
        inset 0 2px 4px rgba(255,220,150,0.4),
        0 4px 8px rgba(0,0,0,0.5);
    border: 1px solid #8a5020;
    pointer-events: none;
    z-index: 15;
  }

  /* ===== 奖品槽（7 格曹格 + 1 格弹射位） ===== */
  .prize-row {
    position: relative;
    height: 110px;
    padding: 0 8px 10px;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    gap: 2px;
  }
  .prize {
    flex: 1;
    height: 90px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .prize .label {
    position: absolute;
    top: -4px; left: 50%; transform: translateX(-50%);
    font-size: 10px;
    color: #4a2a0a;
    font-weight: 700;
    background: rgba(255, 235, 180, 0.9);
    padding: 2px 4px;
    border-radius: 6px;
    border: 1px solid rgba(90, 50, 20, 0.35);
    white-space: nowrap;
    letter-spacing: 0.5px;
    z-index: 2;
  }
  .prize .slot {
    width: 100%;
    height: 70px;
    border-radius: 0 0 10px 10px;
    border-top: none;
    border-left: 2px solid #5a2e0a;
    border-right: 2px solid #5a2e0a;
    border-bottom: 3px solid #5a2e0a;
    box-shadow:
      inset 0 6px 14px rgba(0,0,0,0.35),
      inset 0 -4px 10px rgba(255,255,255,0.2),
      0 3px 6px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }
  /* 槽颜色渐变 */
  .prize.p0 .slot { background: linear-gradient(to bottom, #a9d8ff, #4b98d4); }
  .prize.p1 .slot { background: linear-gradient(to bottom, #ffd4a8, #e08a4a); }
  .prize.p2 .slot { background: linear-gradient(to bottom, #c8e9ff, #6ab8e0); }
  .prize.p3 .slot { background: linear-gradient(to bottom, #b8f0c0, #49b868); }
  .prize.p4 .slot { background: linear-gradient(to bottom, #ffd4e8, #e278a6); }
  .prize.p5 .slot { background: linear-gradient(to bottom, #e7d7ff, #b894e0); }
  .prize.p6 .slot { background: linear-gradient(to bottom, #ffb890, #d86428); }

  /* 弹射区（第8格）*/
  .launch-area {
    flex: 1;
    height: 90px;
  }
  .launch-area .slot {
    width: 100%;
    height: 70px;
    border-radius: 0 0 10px 10px;
    border-top: none;
    border-left: 2px solid #5a2e0a;
    border-right: 2px solid #5a2e0a;
    border-bottom: 3px solid #5a2e0a;
    box-shadow: inset 0 6px 14px rgba(0,0,0,0.25), inset 0 -4px 10px rgba(255,255,255,0.2), 0 3px 6px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }

  /* 中奖点亮效果 */
  .prize.win .slot {
    animation: winPulse 0.8s ease-in-out 3;
    box-shadow:
      inset 0 6px 14px rgba(120,60,0,0.4),
      inset 0 -4px 10px rgba(255,240,180,0.6),
      0 0 28px rgba(255, 220, 120, 1),
      0 0 56px rgba(255, 180, 80, 0.7);
  }
  .prize.win .slot::after {
    content: "";
    position: absolute; inset: -6px;
    border-radius: inherit;
    background: radial-gradient(circle, rgba(255,230,150,0.5), transparent 70%);
    animation: spotLight 0.8s ease-in-out 3;
    pointer-events: none;
  }
  @keyframes winPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }
  @keyframes spotLight {
    0%, 100% { opacity: 0; }
    50%      { opacity: 1; }
  }

  /* ===== 白色弹珠 ===== */
  .ball {
    position: absolute;
    width: 26px; height: 26px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 28%, #ffffff 0%, #e0e0e0 50%, #a0a0a0 100%);
    box-shadow:
      inset -4px -4px 6px rgba(100,100,100,0.3),
      inset 3px 3px 6px rgba(255,255,255,0.9),
      0 0 14px rgba(255,255,255,0.75),
      0 4px 10px rgba(0,0,0,0.55);
    pointer-events: none;
    z-index: 30;
    display: none;
    will-change: transform, left, top;
    animation: ballGlow 1.2s ease-in-out infinite alternate;
  }
  @keyframes ballGlow {
    from { box-shadow: inset -4px -4px 6px rgba(100,100,100,0.3), inset 3px 3px 6px rgba(255,255,255,0.9), 0 0 10px rgba(255,255,255,0.7),  0 4px 8px rgba(0,0,0,0.4); }
    to   { box-shadow: inset -4px -4px 6px rgba(100,100,100,0.3), inset 3px 3px 6px rgba(255,255,255,0.9), 0 0 22px rgba(255,255,255,1),    0 4px 12px rgba(0,0,0,0.5); }
  }
  .ball::after {
    content: "";
    position: absolute;
    top: 5px; left: 6px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    filter: blur(0.5px);
  }

  /* 星尘粒子 */
  .stardust {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 25;
  }

  /* ===== 发射按钮区（放在钉板下方） ===== */
  .launcher {
    width: 100%;
    max-width: 440px;
    margin: 14px auto 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 15;
  }

  /* 蓄力条 */
  .power-wrap {
    width: 44px;
    height: 110px;
    background: linear-gradient(to bottom, #3a1c05, #6b3a14);
    border-radius: 24px;
    padding: 6px;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.6),
      0 4px 10px rgba(0,0,0,0.45);
    position: relative;
    border: 3px solid #3a1c05;
  }
  .power-bar {
    position: absolute;
    left: 5px; right: 5px; bottom: 5px;
    height: 0%;
    border-radius: 0 0 10px 10px;
    background: linear-gradient(to top, #49c14e 0%, #ffd93c 50%, #ff4d4d 100%);
    box-shadow: inset 0 0 8px rgba(255,255,255,0.35);
    transition: height 0.08s linear, background 0.2s linear;
  }
  .power-wrap::before, .power-wrap::after {
    content: "";
    position: absolute;
    right: -12px;
    width: 6px; height: 2px;
    background: #ffe2a2;
    opacity: 0.6;
  }
  .power-wrap::before { top: 20%; }
  .power-wrap::after  { top: 60%; }

  /* 蓄力箭头提示 */
  .hint-text {
    position: absolute;
    left: 120%;
    transform: translateY(-50%);
    top: 50%;
    font-size: 11px;
    color: #fff3c2;
    background: rgba(90, 40, 10, 0.85);
    padding: 4px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,200,120,0.6);
    white-space: nowrap;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .hint-text.show { opacity: 1; animation: hintBlink 0.8s ease-in-out infinite; }
  @keyframes hintBlink {
    0%, 100% { transform: translateY(-50%); }
    50%      { transform: translateY(calc(-50% - 3px)); }
  }

  /* 圆形发射按钮 */
  .btn-launch {
    position: relative;
    width: 130px; height: 130px;
    border-radius: 50%;
    border: 5px solid #3a1c05;
    background: radial-gradient(circle at 35% 30%, #ffb770, #c46a1e 55%, #6b3414 100%);
    color: #fff6d8;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow:
      inset 0 4px 8px rgba(255, 220, 150, 0.5),
      inset 0 -6px 14px rgba(0,0,0,0.45),
      0 10px 18px rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    touch-action: manipulation;
  }
  .btn-launch:active,
  .btn-launch.pressing {
    transform: translateY(4px) scale(0.96);
    box-shadow:
      inset 0 6px 12px rgba(0,0,0,0.55),
      0 2px 4px rgba(0,0,0,0.4);
  }
  .btn-launch.charging { animation: btnPulse 0.6s ease-in-out infinite; }
  .btn-launch.high     { animation: btnPulseFast 0.3s ease-in-out infinite; }
  @keyframes btnPulse     { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes btnPulseFast { 0%, 100% { transform: scale(1.04); box-shadow: 0 0 26px rgba(255,80,80,0.9), inset 0 6px 12px rgba(0,0,0,0.55);}
                           50%      { transform: scale(1.14); box-shadow: 0 0 44px rgba(255,180,60,1),  inset 0 6px 12px rgba(0,0,0,0.55);} }

  /* 旋转光环 */
  .halo {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    pointer-events: none;
    overflow: hidden;
  }
  .halo .particle {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff4c2, rgba(255, 200, 100, 0));
    opacity: 0.8;
    top: 50%; left: 50%;
    transform-origin: 0 0;
    animation: haloSpin 4s linear infinite;
  }
  @keyframes haloSpin {
    from { transform: rotate(0deg) translate(60px) rotate(0deg); }
    to   { transform: rotate(360deg) translate(60px) rotate(-360deg); }
  }
  .btn-launch.charging .halo .particle { background: radial-gradient(circle, #c8ffcc, rgba(73,193,78,0)); }
  .btn-launch.mid      .halo .particle { background: radial-gradient(circle, #fff4c2, rgba(255, 200, 100, 0)); }

  /* ===== 首次引导 ===== */

  .guide .card .ok {

  /* ===== modal 弹窗 ===== */

  .modal {
    width: 82%;
    max-width: 340px;

</style>

<body>

<div class="app">

<script>
/* ========= 配置 ========= */
// 10 列钉子，18 行，交错排列
const PEG_COLS   = 10;
const PEG_ROWS   = 18;
const PEG_RADIUS = 6;         // 钉子半径 6px
const PEG_X_SPACING = 38;     // 水平间距
const PEG_Y_SPACING = 28;     // 垂直间距
const PEG_TOP_MARGIN = 8;     // 顶部预留空间（避开喇叭口）

// 物理参数（减慢速度 & 更强阻力）
const GRAVITY      = 0.12;    // 重力（非常慢）
const AIR_DRAG     = 0.992;   // 空气阻力（更强阻力）
const PEG_BOUNCE   = 0.55;    // 钉子碰撞反弹系数（明显减速）
const WALL_BOUNCE  = 0.60;    // 墙壁反弹系数

// 摇摆动画持续时间（1.5 秒）
const SWAY_DURATION = 1500;

// 中奖/不中奖交错排列
const PRIZES = [
    { text: "1欢喜",   reward: 1,    weight: 25, icon: "🎁" }, // 中奖
    { text: "加油",    reward: 0,    weight: 12, icon: "💪" }, // 不中奖
    { text: "2欢喜",   reward: 2,    weight: 20, icon: "🎁" }, // 中奖
    { text: "再来",    reward: 0,    weight: 12, icon: "🎁" }, // 不中奖
    { text: "3欢喜",   reward: 3,    weight: 15, icon: "🎁" }, // 中奖
    { text: "5欢喜",   reward: 5,    weight: 10, icon: "🏆" }, // 中奖
    { text: "10欢喜",  reward: 10,   weight: 6,  icon: "🏆" }  // 超级大奖
];

/* ========= DOM 引用 ========= */
const stage       = document.getElementById('stage');
const pegBoard    = document.getElementById('pegBoard');
const prizeRow    = document.getElementById('prizeRow');
const ledText     = document.getElementById('ledText');
const dramaticHint = document.getElementById('dramaticHint');
const ball        = document.createElement('div');
ball.className = 'ball';
pegBoard.appendChild(ball);

const btnLaunch   = document.getElementById('btnLaunch');
const btnLabel    = document.getElementById('btnLabel');
const powerBar    = document.getElementById('powerBar');
const powerWrap   = document.getElementById('powerWrap');
const hintText    = document.getElementById('hintText');
const halo        = document.getElementById('halo');
const cooldownRing = document.getElementById('cooldownRing');
const cooldownText = document.getElementById('cooldownText');
const puppet      = document.getElementById('puppet');
const resultBanner = document.getElementById('resultBanner');

const modal        = document.getElementById('modal');
const modalIcon    = document.getElementById('modalIcon');
const modalTitle   = document.getElementById('modalTitle');
const modalDesc    = document.getElementById('modalDesc');
const modalClose   = document.getElementById('modalClose');
const modalAgain   = document.getElementById('modalAgain');

const guide        = document.getElementById('guide');
const guideOk      = document.getElementById('guideOk');

/* ========= 构建钉子 + 奖品槽 ========= */
let pegs = [];
let prizes = [];

function buildBoard() {
  pegs.forEach(p => p.el && p.el.remove());
  pegs = [];
  prizes.forEach(p => p.el && p.el.remove());
  prizes = [];

  // 保留launchArea，移除其他曹格
  const launchArea = document.getElementById('launchArea');
  prizeRow.innerHTML = '';
  if (launchArea) {
    prizeRow.appendChild(launchArea);
  }

  const rect = pegBoard.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;

  // 交错排列：偶数行 PEG_COLS 个钉子，奇数行 PEG_COLS-1 个钉子
  const colorCycle = ['c1','c2','c3','c4','c5','c6'];

  for (let r = 0; r < PEG_ROWS; r++) {
    const isEven = (r % 2 === 0);
    const count  = isEven ? PEG_COLS : (PEG_COLS - 1);
    const totalWidth = PEG_X_SPACING * (PEG_COLS - 1);
    const xStart     = (W - totalWidth) / 2;
    const xOffset    = isEven ? 0 : PEG_X_SPACING / 2;
    const y          = PEG_TOP_MARGIN + PEG_Y_SPACING * (r + 1);

    if (y > H - 20) break; // 超出区域就停止

    for (let c = 0; c < count; c++) {
      const x = xStart + xOffset + PEG_X_SPACING * c;
      const el = document.createElement('div');
      el.className = 'peg ' + colorCycle[(r + c) % colorCycle.length];
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      pegBoard.appendChild(el);
      pegs.push({ x, y, r: PEG_RADIUS, color: colorCycle[(r + c) % colorCycle.length], el });
    }
  }

  // 生成7个曹格（按 PRIZES 新顺序）
  PRIZES.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'prize p' + i;
    el.innerHTML = `
      <div class="label">${p.text}</div>
      <div class="slot"></div>
    `;
    // 插入到launchArea之前
    prizeRow.insertBefore(el, launchArea);
    prizes.push({ el, text: p.text, reward: p.reward, weight: p.weight, icon: p.icon, index: i });
  });
}

/* ========= 发射按钮光环粒子 ========= */
function buildHalo() {
  for (let i = 0; i < 10; i++) {
    const dot = document.createElement('div');
    dot.className = 'particle';
    dot.style.animationDelay = (i * 0.4) + 's';
    dot.style.transform = `rotate(${i * 36}deg) translate(60px)`;
    halo.appendChild(dot);
  }
}

/* ========= 状态 ========= */
let charging = false;
let chargeStartTime = 0;
let chargeValue = 0;
let rafId = null;

let flying = false;
let cooling = false;

/* ========= 蓄力逻辑 ========= */
function startCharge() {
  if (flying || cooling) return;
  charging = true;
  chargeStartTime = performance.now();
  btnLaunch.classList.add('pressing','charging');
  hintText.textContent = '继续按住蓄力…';
  hintText.classList.add('show');
  tickCharge();
}

function tickCharge() {
  if (!charging) return;
  const elapsed = (performance.now() - chargeStartTime) / 2000;
  chargeValue = elapsed - Math.floor(elapsed);
  powerBar.style.height = (chargeValue * 100).toFixed(1) + '%';

  btnLaunch.classList.remove('mid','high');
  if (chargeValue > 0.66)      btnLaunch.classList.add('high');
  else if (chargeValue > 0.33) btnLaunch.classList.add('mid');

  if (chargeValue > 0.2 && chargeValue < 0.4) {
    hintText.textContent = '力度适中！';
  } else if (chargeValue > 0.7) {
    hintText.textContent = '松手发射！';
  } else {
    hintText.textContent = '继续按住蓄力…';
  }

  rafId = requestAnimationFrame(tickCharge);
}

function releaseCharge() {
  if (!charging) return;
  charging = false;
  if (rafId) cancelAnimationFrame(rafId);
  btnLaunch.classList.remove('pressing','charging','mid','high');
  hintText.classList.remove('show');

  powerBar.style.height = '0%';

  const power = chargeValue;
  launchBall(power);
}

/* ========= 弹珠物理 ========= */
let ballState = null;
let ledPhaseTimer = null;

function setLed(text, flash) {
  ledText.textContent = text;
  if (flash) {
    ledText.classList.remove('flash');
    void ledText.offsetWidth;
    ledText.classList.add('flash');
  } else {
    ledText.classList.remove('flash');
  }
}

function showDramatic(show) {
  if (!dramaticHint) return;
  if (show) dramaticHint.classList.add('show');
  else dramaticHint.classList.remove('show');
}

function launchBall(power) {
  puppet.classList.add('peek');

  const stageRect = stage.getBoundingClientRect();
  const boardRect = pegBoard.getBoundingClientRect();
  const prizeRowRect = prizeRow.getBoundingClientRect();
  const W = boardRect.width;
  const H = boardRect.height;

  // 从第8格（launchArea）的中心位置发射
  const launchAreaEl = document.getElementById('launchArea');
  if (launchAreaEl) {
    const laRect = launchAreaEl.getBoundingClientRect();
    var startX = laRect.left + laRect.width/2 - boardRect.left;
    var startY = laRect.top - boardRect.top - 20;  // 在槽入口上方
  } else {
    var startX = W / 2;
    var startY = H - 20;
  }

  // 弹射方向：从第8格向上发射，偏向右上方（45度挡板方向）
  // 保持较强的初始发射速度，让弹珠进入钉板区域后再迅速衰减
  const horizontalBias = 0.3 + power * 0.5;
  const baseSpeed = 18 + power * 22;
  const vx = horizontalBias * baseSpeed * 0.4;
  const vy = -baseSpeed;

  ballState = {
    x: startX,
    y: startY,
    vx, vy,
    r: 13,
    alive: true,
    stuckPrize: null
  };

  flying = true;
  ball.style.display = 'block';

  // LED：下落中
  setLed('🎯 弹珠下落中...', false);
  showDramatic(false);

  burstLaunch(startX, startY);
  stage.classList.remove('board-shake');
  void stage.offsetWidth;
  stage.classList.add('board-shake');

  tickBall();
}

function tickBall() {
  if (!ballState || !ballState.alive) return;
  const boardRect = pegBoard.getBoundingClientRect();
  const W = boardRect.width;
  const H = boardRect.height;

  // 应用重力 & 空气阻力
  ballState.vy += GRAVITY;
  ballState.vx *= AIR_DRAG;
  ballState.vy *= AIR_DRAG;
  ballState.x  += ballState.vx;
  ballState.y  += ballState.vy;

  // 墙壁反弹
  if (ballState.x < ballState.r) {
    ballState.x = ballState.r;
    ballState.vx = -ballState.vx * WALL_BOUNCE;
  }
  if (ballState.x > W - ballState.r) {
    ballState.x = W - ballState.r;
    ballState.vx = -ballState.vx * WALL_BOUNCE;
  }

  // 钉子碰撞
  for (const peg of pegs) {
    const dx = ballState.x - peg.x;
    const dy = ballState.y - peg.y;
    const dist = Math.hypot(dx, dy);
    const minDist = ballState.r + peg.r;
    if (dist < minDist && dist > 0.01) {
      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = minDist - dist;
      ballState.x += nx * overlap;
      ballState.y += ny * overlap;
      const vn = ballState.vx * nx + ballState.vy * ny;
      if (vn < 0) {
        ballState.vx = (ballState.vx - 2 * vn * nx) * PEG_BOUNCE;
        ballState.vy = (ballState.vy - 2 * vn * ny) * PEG_BOUNCE;
      }
      // 轻微随机扰动（让运动更自然，但小一点避免过强）
      ballState.vx += (Math.random() - 0.5) * 1.2;
      ballState.vy += (Math.random() - 0.5) * 0.9;

      flashPeg(peg);
      spawnStardust(peg.x, peg.y, peg.color, true);
      stage.classList.remove('board-shake');
      void stage.offsetWidth;
      stage.classList.add('board-shake');
    }
  }

  // 挡板碰撞检测
  const baffle = document.getElementById('baffle');
  if (baffle) {
    const baffleRect = baffle.getBoundingClientRect();
    const boardRect = pegBoard.getBoundingClientRect();
    const bx1 = baffleRect.left - boardRect.left;
    const by1 = baffleRect.top - boardRect.top;
    const bx2 = baffleRect.right - boardRect.left;
    const by2 = baffleRect.bottom - boardRect.top;

    if (ballState.x + ballState.r > bx1 && ballState.x - ballState.r < bx2 &&
        ballState.y + ballState.r > by1 && ballState.y - ballState.r < by2) {
      ballState.vx -= 5 + Math.random() * 2;
      ballState.vy += 2 + Math.random() * 1.5;
      ballState.x = bx1 - ballState.r;
      for (let i = 0; i < 8; i++) {
        spawnStardust(ballState.x, ballState.y, 'c2', true);
      }
    }
  }

  // 进入奖品槽区域的判定
  const prizeAreaY = H - 110;          // 大约接近奖品区的 y
  const dramaticY   = H - 150;         // 快接近槽格时的"心跳加速"区域

  if (ballState.y > dramaticY && ballState.y < prizeAreaY + 20) {
    if (ledText && ledText.textContent.indexOf('心跳') < 0) {
      setLed('💫 心跳加速！', true);
      showDramatic(true);
    }
  }

  if (ballState.y > prizeAreaY && ballState.vy > -0.5) {
    const n = 8;  // 8个格子
    const slotW = W / n;
    let idx = Math.floor(ballState.x / slotW);
    if (idx < 0) idx = 0;
    if (idx >= n) idx = n - 1;

    if (idx === 7) {
      // 掉到第8格（弹射区），忽略，继续下落或重置
      ballState.alive = false;
      flying = false;
      showDramatic(false);
      setTimeout(() => {
        ball.style.display = 'none';
        startCooldown();
        setLed('😢 再来一次', true);
      }, 500);
      return;
    }

    ballState.stuckPrize = idx;
    ballState.alive = false;
    showDramatic(true);
    settleBall(idx);
    return;
  }

  if (ballState.y < 10) {
    ballState.y = 10;
    ballState.vy = Math.abs(ballState.vy) * 0.6;
  }

  ball.style.left = (ballState.x - 13) + 'px';
  ball.style.top  = (ballState.y - 13) + 'px';

  requestAnimationFrame(tickBall);
}

function settleBall(idx) {
  const prize = prizes[idx];
  const rect = pegBoard.getBoundingClientRect();
  const slotW = rect.width / 8;
  const targetX = slotW * idx + slotW / 2;
  const targetY = rect.height - 50;

  const startX = ballState.x;
  const startY = ballState.y;

  const totalDuration = SWAY_DURATION; // 1500ms 摇摆 + 下落合并
  const startTime = performance.now();

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(1, elapsed / totalDuration);

    // 整体下落插值（平滑缓动）
    const easeOut = 1 - Math.pow(1 - t, 2);
    const baseX = startX + (targetX - startX) * easeOut;
    const baseY = startY + (targetY - startY) * easeOut;

    // 摇摆幅度（开始大，末段变小）
    // 先向一个方向偏，再向另一个方向偏，最后停在目标上
    const swayDecay = Math.pow(1 - t, 1.5);
    const swayAmp = 18 * swayDecay;       // 横向摇摆
    const swayAmpY = 6 * swayDecay;       // 上下轻微摆动
    const freq1 = 7.5;                    // 摇摆频率
    const freq2 = 4.2;                    // 次级摇摆
    const phaseOffset = idx * 0.3 + 1.0;  // 每个槽稍有不同相位

    const swayX = Math.sin(t * Math.PI * freq1 + phaseOffset) * swayAmp
                + Math.sin(t * Math.PI * freq2) * (swayAmp * 0.45);
    const swayY = Math.cos(t * Math.PI * freq1 * 0.7) * swayAmpY;

    ball.style.left = (baseX + swayX - 13) + 'px';
    ball.style.top  = (baseY + swayY - 13) + 'px';

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      // 精确落位
      ball.style.left = (targetX - 13) + 'px';
      ball.style.top  = (targetY - 13) + 'px';
      showDramatic(false);
      triggerWin(idx);
    }
  }
  requestAnimationFrame(animate);
}

/* ========= 中奖（4秒后弹窗，LED 立刻显示结果）========= */
function triggerWin(idx) {
  const prize = prizes[idx];
  prize.el.classList.add('win');

  setTimeout(() => puppet.classList.remove('peek'), 800);

  showFloatScore(prize);

  // 顶部横幅立刻显示
  showResultBanner(prize);

  // LED 显示屏立刻更新并闪烁，显示"中奖"或"再来一次"
  if (prize.reward > 0) {
    setLed('🎉 中奖：' + prize.text + '！', true);
  } else {
    setLed('😢 再来一次', true);
  }

  const rect = prize.el.getBoundingClientRect();
  const boardRect = pegBoard.getBoundingClientRect();
  const cx = rect.left + rect.width / 2 - boardRect.left;
  const cy = rect.top - boardRect.top + 10;
  for (let i = 0; i < 22; i++) spawnStardust(cx, cy, 'c' + ((idx % 6) + 1), true);

  flying = false;

  // 4秒后弹窗
  setTimeout(() => {
    showResult(prize);
  }, 4000);

  startCooldown();
}

function resetLed() {
  ledText.textContent = '🎯 星际弹珠';
  ledText.classList.remove('flash');
}

/* 顶部中奖横幅 */
function showResultBanner(prize) {
  if (!resultBanner) return;
  let text = '🎯 ';
  if (prize.reward >= 5)       text += '🏆 大奖！' + prize.text;
  else if (prize.reward > 0)  text += '🎉 中奖：' + prize.text;
  else if (prize.text.includes('再来')) text += '🎁 再来一次！';
  else if (prize.text.includes('加油')) text += '💪 加油！';
  else                           text += '🙏 谢谢参与';
  resultBanner.textContent = text;
  resultBanner.classList.add('show');
  clearTimeout(showResultBanner._t);
  showResultBanner._t = setTimeout(() => resultBanner.classList.remove('show'), 3500);
}

function flashPeg(peg) {
  if (!peg.el) return;
  peg.el.animate([
    { transform: 'translate(-50%,-50%) scale(1)', filter: 'brightness(1)' },
    { transform: 'translate(-50%,-50%) scale(1.35)', filter: 'brightness(1.8) drop-shadow(0 0 8px #fff)' },
    { transform: 'translate(-50%,-50%) scale(1)', filter: 'brightness(1)' }
  ], { duration: 220, easing: 'ease-out' });
}

function burstLaunch(x, y) {
  const colors = ['c1','c2','c3','c4','c5','c6'];
  for (let i = 0; i < 20; i++) {
    spawnStardust(x, y, colors[i % 6], true);
  }
  if (ball) {
    ball.animate([
      { transform: 'scale(1)' , opacity: 1 },
      { transform: 'scale(1.8)', opacity: 0.8 },
      { transform: 'scale(1)' , opacity: 1 }
    ], { duration: 280, easing: 'cubic-bezier(0.2,0.8,0.3,1)' });
  }
}

function showFloatScore(prize) {
  const pRect = prize.el.getBoundingClientRect();
  const bRect = pegBoard.getBoundingClientRect();
  const x = pRect.left + pRect.width / 2 - bRect.left;
  const y = pRect.top - bRect.top;

  const el = document.createElement('div');
  el.className = 'float-score';
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  if (prize.reward > 0)       el.textContent = '+' + prize.reward + ' 欢喜';
  else if (prize.text.includes('再来')) el.textContent = '再来一次！';
  else if (prize.text.includes('加油')) el.textContent = '加油！';
  else                        el.textContent = '谢谢参与';
  pegBoard.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function startCooldown() {
  cooling = true;
  btnLaunch.classList.add('cooling');
  cooldownRing.classList.add('on');
  cooldownText.classList.add('on');
  let left = 3;
  cooldownText.textContent = left;
  const timer = setInterval(() => {
    left -= 1;
    if (left <= 0) {
      clearInterval(timer);
      cooldownRing.classList.remove('on');
      cooldownText.classList.remove('on');
      btnLaunch.classList.remove('cooling');
      cooling = false;
    } else {
      cooldownText.textContent = left;
    }
  }, 1000);
}

/* ========= 星尘粒子 ========= */
function spawnStardust(x, y, color, strong) {
  const dot = document.createElement('div');
  dot.className = 'stardust';
  dot.style.left = x + 'px';
  dot.style.top  = y + 'px';
  const colors = {
    c1: '#ff7070', c2: '#ffb050', c3: '#ffdd55',
    c4: '#7bdc70', c5: '#6babff', c6: '#b479ff'
  };
  const bg = colors[color] || '#ffcf6a';
  const size = strong ? (8 + Math.random() * 6) : (6 + Math.random() * 3);
  dot.style.width  = size + 'px';
  dot.style.height = size + 'px';
  dot.style.background = `radial-gradient(circle, ${bg}, transparent 70%)`;
  dot.style.boxShadow = `0 0 ${strong ? 14 : 8}px ${bg}`;
  pegBoard.appendChild(dot);

  const angle = Math.random() * Math.PI * 2;
  const dist  = (strong ? 22 : 18) + Math.random() * (strong ? 42 : 30);
  const dx = Math.cos(angle) * dist;
  const dy = Math.sin(angle) * dist - (strong ? 10 : 6);
  const dur = (strong ? 520 : 450) + Math.random() * 300;

  dot.animate([
    { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.15)`, opacity: 0 }
  ], { duration: dur, easing: 'cubic-bezier(0.2,0.8,0.3,1)' });

  setTimeout(() => dot.remove(), dur);
}

/* ========= 结果弹窗 ========= */
function showResult(prize) {
  modalIcon.textContent = prize.icon || '🎁';
  if (prize.reward >= 5) {
    modalTitle.textContent = '大 奖';
    modalDesc.innerHTML = `恭喜获得 <b style="color:#b8441a">${prize.text}</b><br/>真是太幸运啦！`;
  } else if (prize.reward > 0) {
    modalTitle.textContent = '中 奖';
    modalDesc.innerHTML = `获得 <b style="color:#b8441a">${prize.text}</b>`;
  } else if (prize.text.includes('再来')) {
    modalTitle.textContent = '再 来';
    modalDesc.textContent = '再来一次吧！';
  } else if (prize.text.includes('加油')) {
    modalTitle.textContent = '加 油';
    modalDesc.textContent = '下次一定！';
  } else {
    modalTitle.textContent = '很遗憾';
    modalDesc.textContent = '谢谢参与，再接再厉～';
  }
  modal.classList.add('on');
}

function closeModal() {
  modal.classList.remove('on');
  prizes.forEach(p => p.el.classList.remove('win'));
  if (ball) ball.style.display = 'none';
  if (resultBanner) resultBanner.classList.remove('show');
  resetLed();
}

/* ========= 事件绑定 ========= */
function bindEvents() {
  btnLaunch.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    startCharge();
  });
  const endEvents = ['pointerup','pointercancel','pointerleave'];
  endEvents.forEach(ev => {
    btnLaunch.addEventListener(ev, (e) => {
      if (charging) { e.preventDefault(); releaseCharge(); }
    });
  });

  modalClose.addEventListener('click', closeModal);
  modalAgain.addEventListener('click', () => {
    closeModal();
  });

  guideOk.addEventListener('click', () => {
    guide.style.display = 'none';
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      buildBoard();
    }, 200);
  });
}

/* ========= 初始化 ========= */
function init() {
  buildBoard();
  buildHalo();
  bindEvents();
}

window.addEventListener('load', () => {
  setTimeout(init, 80);
});
</script>
