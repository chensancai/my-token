<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可视化编辑 · 祈个福管理后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1810 50%, #1a0a0a 100%);
            min-height: 100vh;
            color: #4A3728;
        }
        .page-container { padding: 10px; max-width: 400px; margin: 0 auto; }
        .phone-wrap {
            background: #111;
            border-radius: 40px;
            padding: 8px;
            box-shadow: 0 0 0 2px #D4AF37, 0 0 30px rgba(212,175,55,0.15), 0 15px 40px rgba(0,0,0,0.5);
        }
        .phone-notch {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 22px;
            background: #000;
            border-radius: 12px;
            z-index: 50;
        }
        .phone-screen {
            width: 100%;
            min-height: 780px;
            border-radius: 32px;
            overflow: hidden;
            background: #FFFBEE;
            position: relative;
        }
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            padding: 10px 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            z-index: 10;
            color: rgba(0,0,0,0.7);
        }
        .back-btn {
            position: absolute;
            top: 8px;
            left: 10px;
            width: 30px;
            height: 30px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 100;
            color: #fff;
            border: none;
        }
        .back-btn:active { transform: scale(0.93); }
        .scroll-area { padding: 60px 16px 30px; }

        /* 页面标题 */
        .page-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
            color: #8B5A2B;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 6px;
        }
        .page-subtitle {
            font-size: 11px;
            color: #8B7355;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }

        /* 组件卡片 */
        .component-card {
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1.5px solid #D4A574;
            box-shadow: 0 2px 8px rgba(139,90,43,0.08);
        }
        .component-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(139,90,43,0.15);
        }
        .component-icon {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: linear-gradient(135deg, #D4A574, #8B5A2B);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
        }
        .component-title {
            font-size: 13px;
            font-weight: 700;
            color: #4A3728;
            letter-spacing: 1px;
        }
        .component-meta {
            font-size: 10px;
            color: #8B7355;
            margin-top: 2px;
        }

        /* 预览区域 */
        .preview-area {
            padding: 12px;
            background: #FFF8EC;
            border-radius: 10px;
            border: 1px dashed rgba(139,90,43,0.15);
        }

        /* 按钮组 */
        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .btn-edit {
            flex: 1;
            padding: 8px;
            background: #8B5A2B;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: 'Ma Shan Zheng', cursive;
        }
        .btn-toggle {
            flex: 1;
            padding: 8px;
            background: #FFF8EC;
            color: #8B5A2B;
            border: 1.5px solid #D4A574;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: 'Ma Shan Zheng', cursive;
        }

        /* 组件预览元素 */
        .preview-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .preview-btn {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 1px;
        }
        .btn-primary { background: #8B5A2B; color: #fff; }
        .btn-secondary { background: #FFF8EC; color: #8B5A2B; border: 1.5px solid #D4A574; }

        .preview-inputs { display: flex; flex-direction: column; gap: 10px; }
        .preview-input {
            padding: 10px 12px;
            font-size: 12px;
            border: 1.5px solid #D4A574;
            border-radius: 8px;
            background: #fff;
            color: #4A3728;
            outline: none;
            font-family: inherit;
        }

        .preview-badge-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .preview-badge {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 10px;
            letter-spacing: 1px;
        }
        .badge-gold { background: rgba(212,165,116,0.25); color: #8B5A2B; }
        .badge-red { background: rgba(180, 80, 80, 0.2); color: #8B3A3A; }
        .badge-green { background: rgba(100, 150, 100, 0.2); color: #4A6B4A; }

        .preview-card-item {
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #D4A574;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .preview-card-icon {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: linear-gradient(135deg, #D4A574, #8B5A2B);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .preview-card-title { font-size: 12px; font-weight: 700; color: #4A3728; margin-bottom: 3px; }
        .preview-card-desc { font-size: 10px; color: #8B7355; }

        /* 底部操作栏 */
        .bottom-action-bar {
            position: sticky;
            bottom: 0;
            background: linear-gradient(180deg, transparent, #FFFBEE);
            padding: 16px 0 0;
            margin-top: 20px;
        }
        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .action-grid-btn {
            padding: 10px 4px;
            background: #fff;
            color: #8B5A2B;
            border: 1.5px solid #D4A574;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-family: 'Ma Shan Zheng', cursive;
        }
        .action-grid-btn .icon { font-size: 16px; }
        .action-grid-btn.primary {
            background: #8B5A2B;
            color: #fff;
        }

        /* 开关组件 */
        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }
        .switch-label-wrap { flex: 1; }
        .switch-label { font-size: 12px; color: #4A3728; font-weight: 600; }
        .switch-desc { font-size: 10px; color: #8B7355; margin-top: 2px; }
        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #D4A574;
            border-radius: 11px;
            transition: 0.3s;
        }
        .toggle-slider::before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider { background: #8B5A2B; }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

        /* Toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="phone-wrap">
            <div class="phone-notch"></div>
            <div class="phone-screen">
                <div class="status-bar"><span>9:41</span><span>●●● 5G</span></div>
                <button class="back-btn" onclick="showToast('返回首页')">‹</button>
                
                <div class="scroll-area">
                    <div class="page-title">可视化编辑</div>
                    <div class="page-subtitle">所见即所得 · 组件实时预览</div>

                    <!-- 组件1: 按钮 -->
                    <div class="component-card">
                        <div class="component-header">
                            <div class="component-icon">🔘</div>
                            <div>
                                <div class="component-title">按钮组件</div>
                                <div class="component-meta">主按钮 / 次按钮</div>
                            </div>
                        </div>
                        <div class="preview-area">
                            <div class="preview-buttons">
                                <button class="preview-btn btn-primary" onclick="showToast('主按钮')">祈福</button>
                                <button class="preview-btn btn-secondary" onclick="showToast('次按钮')">点灯</button>
                            </div>
                        </div>
                        <div class="btn-row">
                            <button class="btn-edit" onclick="showToast('编辑按钮样式')">编辑样式</button>
                            <button class="btn-toggle" onclick="showToast('已保存组件')">保存</button>
                        </div>
                    </div>

                    <!-- 组件2: 输入框 -->
                    <div class="component-card">
                        <div class="component-header">
                            <div class="component-icon">📝</div>
                            <div>
                                <div class="component-title">输入组件</div>
                                <div class="component-meta">文本框 / 文本区域</div>
                            </div>
                        </div>
                        <div class="preview-area">
                            <div class="preview-inputs">
                                <input type="text" class="preview-input" placeholder="请输入祈福愿望">
                                <textarea class="preview-input" placeholder="详细描述..." rows="2" style="min-height: 50px;"></textarea>
                            </div>
                        </div>
                        <div class="btn-row">
                            <button class="btn-edit" onclick="showToast('编辑输入框样式')">编辑样式</button>
                            <button class="btn-toggle" onclick="showToast('已保存组件')">保存</button>
                        </div>
                    </div>

                    <!-- 组件3: 标签徽章 -->
                    <div class="component-card">
                        <div class="component-header">
                            <div class="component-icon">🏷️</div>
                            <div>
                                <div class="component-title">标签组件</div>
                                <div class="component-meta">状态标签 / 分类标签</div>
                            </div>
                        </div>
                        <div class="preview-area">
                            <div class="preview-badge-row">
                                <span class="preview-badge badge-gold">已发布</span>
                                <span class="preview-badge badge-red">待审核</span>
                                <span class="preview-badge badge-green">审核通过</span>
                            </div>
                        </div>
                        <div class="btn-row">
                            <button class="btn-edit" onclick="showToast('编辑标签样式')">编辑样式</button>
                            <button class="btn-toggle" onclick="showToast('已保存组件')">保存</button>
                        </div>
                    </div>

                    <!-- 组件4: 卡片列表 -->
                    <div class="component-card">
                        <div class="component-header">
                            <div class="component-icon">📋</div>
                            <div>
                                <div class="component-title">卡片组件</div>
                                <div class="component-meta">列表项 / 内容卡片</div>
                            </div>
                        </div>
                        <div class="preview-area">
                            <div class="preview-card-item">
                                <div class="preview-card-icon">🙏</div>
                                <div style="flex: 1;">
                                    <div class="preview-card-title">每日祈福</div>
                                    <div class="preview-card-desc">点亮心灯 · 福报加持</div>
                                </div>
                            </div>
                        </div>
                        <div class="btn-row">
                            <button class="btn-edit" onclick="showToast('编辑卡片样式')">编辑样式</button>
                            <button class="btn-toggle" onclick="showToast('已保存组件')">保存</button>
                        </div>
                    </div>

                    <!-- 组件5: 开关 -->
                    <div class="component-card">
                        <div class="component-header">
                            <div class="component-icon">🎛️</div>
                            <div>
                                <div class="component-title">开关组件</div>
                                <div class="component-meta">启用 / 禁用 选项</div>
                            </div>
                        </div>
                        <div class="preview-area">
                            <div class="switch-row">
                                <div class="switch-label-wrap">
                                    <div class="switch-label">显示佛光动效</div>
                                    <div class="switch-desc">开启后页面显示金色光环</div>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" checked onchange="showToast(this.checked ? '开启' : '关闭')">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                            <div class="switch-row">
                                <div class="switch-label-wrap">
                                    <div class="switch-label">启用粒子动画</div>
                                    <div class="switch-desc">控制页面动画效果</div>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" onchange="showToast(this.checked ? '开启' : '关闭')">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>
                        <div class="btn-row">
                            <button class="btn-edit" onclick="showToast('编辑开关样式')">编辑样式</button>
                            <button class="btn-toggle" onclick="showToast('已保存组件')">保存</button>
                        </div>
                    </div>

                    <!-- 底部操作栏 -->
                    <div class="bottom-action-bar">
                        <div class="action-grid">
                            <button class="action-grid-btn primary" onclick="showToast('✨ 发布模板')">
                                <span class="icon">✨</span>
                                <span>发布模板</span>
                            </button>
                            <button class="action-grid-btn" onclick="showToast('📱 预览')">
                                <span class="icon">📱</span>
                                <span>实时预览</span>
                            </button>
                            <button class="action-grid-btn" onclick="showToast('💾 保存草稿')">
                                <span class="icon">💾</span>
                                <span>保存</span>
                            </button>
                            <button class="action-grid-btn" onclick="showToast('📋 历史记录')">
                                <span class="icon">📋</span>
                                <span>历史</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var toastTimer;
        function showToast(msg) {
            var toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.className = 'toast';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 1500);
        }
    </script>
</body>
</html>
