<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>祈个福 · 佛像管理</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        margin: 0;
        background: linear-gradient(180deg, #1a0a2e 0%, #0d0015 100%);
        min-height: 100vh;
        color: #FFD700;
        padding-bottom: 80px;
    }

    /* 头部 */
    .header {
        background: linear-gradient(180deg, rgba(61,42,15,0.6) 0%, rgba(42,26,8,0.3) 100%);
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(212,175,55,0.35);
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(8px);
    }

    .header h1 { font-size: 17px; color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.35); font-weight: 600; }

    .header-actions { display: flex; gap: 10px; }

    .header-btn {
        background: linear-gradient(135deg, #FFD700, #FFA500);
        color: #1a0a2e;
        border: none;
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
    }

    .header-btn.reset { background: transparent; color: #FFD700; border: 1px solid rgba(212,175,55,0.6); }

    /* 主内容 */
    .container { padding: 10px 14px; }

    /* 分类卡片：去除方框 */
    .category-card {
        margin-bottom: 28px;
    }

    /* 分类标题：简约文字 + 金色下划线 */
    .category-header {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 600;
        color: #FFD700;
        padding: 10px 0 8px 0;
        margin-bottom: 4px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.35);
        position: relative;
    }

    .category-header::before {
        content: "";
        display: inline-block;
        width: 3px;
        height: 16px;
        background: linear-gradient(180deg, #FFD700, #FFA500);
        border-radius: 2px;
        flex-shrink: 0;
    }

    /* 子标题说明 */
    .sub-section {
        padding: 6px 4px 10px 13px;
        font-size: 12px;
        color: rgba(255, 215, 0, 0.55);
    }

    /* 内容区域：去 padding 和边框 */
    .category-content { padding: 0; border: none; }

    /* item-row：简约水平列表 */
    .item-row {
        display: flex;
        align-items: center;
        padding: 12px 4px;
        gap: 12px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.12);
    }

    .item-row:last-child { border-bottom: none; }

    /* item-preview */
    .item-preview {
        width: 46px;
        height: 46px;
        background: rgba(255, 215, 0, 0.06);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        flex-shrink: 0;
        overflow: hidden;
        position: relative;
    }

    .item-preview img, .item-preview video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .item-preview .icon-placeholder {
        font-size: 22px;
        color: #FFD700;
    }

    .preview-group {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
        flex-wrap: wrap;
        max-width: 170px;
    }

    .preview-small {
        width: 38px;
        height: 38px;
        background: rgba(255, 215, 0, 0.06);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        overflow: hidden;
        position: relative;
    }

    .preview-small img, .preview-small video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .preview-label {
        position: absolute;
        bottom: -14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        color: rgba(255, 215, 0, 0.7);
        white-space: nowrap;
    }

    /* 信息区域 */
    .item-info { flex: 1; min-width: 0; }

    .item-label {
        font-size: 13px;
        color: rgba(255, 215, 0, 0.9);
        margin-bottom: 6px;
        font-weight: 500;
    }

    .item-inputs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }

    /* 文本输入 */
    .text-input {
        flex: 1;
        min-width: 80px;
        padding: 6px 10px;
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 6px;
        background: transparent;
        color: #FFD700;
        font-size: 12px;
    }

    .text-input:focus { outline: none; border-color: #FFD700; }

    .color-input {
        width: 34px;
        height: 30px;
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 6px;
        cursor: pointer;
        background: transparent;
        padding: 2px;
    }

    .range-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 120px;
    }

    .range-input {
        flex: 1;
        accent-color: #FFD700;
    }

    .range-value {
        font-size: 12px;
        color: rgba(255, 215, 0, 0.75);
        white-space: nowrap;
        min-width: 40px;
        text-align: right;
    }

    /* 上传按钮：扁平圆角 */
    .upload-btn {
        padding: 6px 12px;
        background: transparent;
        color: #FFD700;
        border: 1px solid rgba(212, 175, 55, 0.5);
        border-radius: 20px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s;
    }

    .upload-btn:hover, .upload-btn:active {
        background: rgba(212, 175, 55, 0.15);
        border-color: #FFD700;
    }

    .upload-btn.video { color: #66B2FF; border-color: rgba(102, 178, 255, 0.5); }
    .upload-btn.video:hover, .upload-btn.video:active { background: rgba(102, 178, 255, 0.12); border-color: #66B2FF; }

    .upload-btn.music { color: #D488FF; border-color: rgba(212, 136, 255, 0.5); }
    .upload-btn.music:hover, .upload-btn.music:active { background: rgba(212, 136, 255, 0.12); border-color: #D488FF; }

    .upload-btn.fx { color: #FFB366; border-color: rgba(255, 179, 102, 0.5); }
    .upload-btn.fx:hover, .upload-btn.fx:active { background: rgba(255, 179, 102, 0.12); border-color: #FFB366; }

    .upload-btn.model3d { color: #66E0D4; border-color: rgba(102, 224, 212, 0.5); }
    .upload-btn.model3d:hover, .upload-btn.model3d:active { background: rgba(102, 224, 212, 0.12); border-color: #66E0D4; }

    /* 开关按钮：扁平 */
    .toggle-btn {
        padding: 6px 14px;
        border: 1px solid rgba(212, 175, 55, 0.5);
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        color: #FFD700;
        background: transparent;
        white-space: nowrap;
        transition: all 0.2s;
    }

    .toggle-btn.on {
        background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,165,0,0.15));
        border-color: #FFD700;
        color: #FFD700;
    }

    .toggle-btn.off {
        background: transparent;
        border-color: rgba(255, 215, 0, 0.25);
        color: rgba(255, 215, 0, 0.45);
    }

    /* 隐藏的文件输入 */
    .file-input { display: none; }

    /* 提示信息 */
    .toast {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.85);
        color: #FFD700;
        padding: 16px 24px;
        border-radius: 12px;
        font-size: 14px;
        z-index: 2000;
        display: none;
        text-align: center;
        border: 1px solid rgba(212,175,55,0.4);
    }

    .toast.show { display: block; animation: fadeIn 0.3s; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* 返回按钮 */
    .back-home {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #FFD700, #FFA500);
        color: #1a0a2e;
        padding: 10px 24px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        text-decoration: none;
        box-shadow: 0 4px 14px rgba(255,165,0,0.35);
        z-index: 100;
    }

    /* 多图层按钮区 */
    .layer-buttons {
        display: flex;
        flex-direction: column;
        gap: 5px;
        flex: 1;
    }

    .layer-row {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .layer-title {
        font-size: 11px;
        color: rgba(255, 215, 0, 0.6);
        min-width: 44px;
    }

    /* ============ 上传类型选择弹窗（简化） ============ */
    .upload-modal-mask {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1500;
    }

    .upload-modal-mask.show {
        display: flex;
        animation: maskFade 0.25s ease;
    }

    @keyframes maskFade {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .upload-modal {
        background: #1a0a2e;
        border: 1px solid rgba(212, 175, 55, 0.5);
        border-radius: 14px;
        padding: 20px 22px;
        width: 320px;
        max-width: 92vw;
        animation: modalPop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }

    @keyframes modalPop {
        from { opacity: 0; transform: scale(0.85); }
        to { opacity: 1; transform: scale(1); }
    }

    .upload-modal-title {
        font-size: 16px;
        font-weight: 600;
        color: #FFD700;
        text-align: center;
        margin-bottom: 4px;
    }

    .upload-modal-sub {
        font-size: 12px;
        color: rgba(255, 215, 0, 0.6);
        text-align: center;
        margin-bottom: 16px;
    }

    .upload-modal-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .upload-modal-opt {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 12px 8px;
        background: rgba(212, 175, 55, 0.05);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 10px;
        color: #FFD700;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
    }

    .upload-modal-opt:hover,
    .upload-modal-opt:active {
        background: rgba(212, 175, 55, 0.15);
        border-color: #FFD700;
    }

    .upload-modal-opt .emo {
        font-size: 22px;
        line-height: 1;
    }

    .upload-modal-close {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 8px;
        background: transparent;
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 10px;
        color: rgba(255, 215, 0, 0.7);
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .upload-modal-close:hover {
        background: rgba(212, 175, 55, 0.1);
        color: #FFD700;
    }

    /* 预览框中 3D / 2.5D 图标标签 */
    .item-preview .file-tag {
        position: absolute;
        bottom: 2px;
        left: 2px;
        right: 2px;
        font-size: 9px;
        color: #1a0a2e;
        background: rgba(255, 215, 0, 0.8);
        border-radius: 4px;
        padding: 1px 2px;
        text-align: center;
        line-height: 1.3;
    }

    .item-preview.has-tag {
        position: relative;
    }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏛️ 佛像管理</h1>
        <div class="header-actions">
            <button class="header-btn reset" onclick="resetToDefault()">恢复默认</button>
            <button class="header-btn" onclick="saveChanges()">💾 保存</button>
        </div>
    </div>

    <div class="container">
        <!-- 1. 佛像主图管理（画中画三层结构） -->
        <div class="category-card">
            <div class="category-header">🏛️ 佛像主图管理（画中画三层结构）</div>
            <div class="sub-section">第一层：视频佛像 &nbsp;|&nbsp; 第二层：光环 &nbsp;|&nbsp; 第三层：背景</div>
            <div class="category-content" id="buddha-main-list">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>

        <!-- 2. 佛像光环配置 -->
        <div class="category-card">
            <div class="category-header">✨ 佛像光环配置</div>
            <div class="sub-section">每尊佛像的光晕大小、颜色与开关</div>
            <div class="category-content" id="buddha-halo-list">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>

        <!-- 3. 背景图管理 -->
        <div class="category-card">
            <div class="category-header">🖼️ 背景图管理</div>
            <div class="category-content" id="bg-list">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>

        <!-- 4. 灵宠图片更换 -->
        <div class="category-card">
            <div class="category-header">🐟 灵宠图片更换</div>
            <div class="category-content" id="pet-list">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>

        <!-- 6. 供桌与跪拜垫 -->
        <div class="category-card">
            <div class="category-header">🪑 供桌与跪拜垫</div>
            <div class="category-content" id="altar-list">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>

        <!-- 7. 青石板（追思页地面） -->
        <div class="category-card">
            <div class="category-header">🪨 青石板（追思页地面）</div>
            <div class="category-content" id="slab-list">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>

        <!-- 5. 祈福/追思 贡品上传 -->
        <div class="category-card">
            <div class="category-header">🌸 祈福/追思 贡品上传</div>
            <div class="sub-section">祈福页贡品</div>
            <div class="category-content" id="offering-pray-list"></div>
            <div class="sub-section">追思页贡品</div>
            <div class="category-content" id="offering-rem-list"></div>
        </div>

        <!-- 8. 特效、音乐与功能模块开关 -->
        <div class="category-card">
            <div class="category-header">🎵 特效、音乐与功能模块开关</div>
            <div class="category-content" id="fx-list">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>
    </div>

    <a href="#" onclick="try{window.parent.goPage(7);}catch(e){window.history.back();}return false;" class="back-home">← 返回个人中心</a>

    <!-- 隐藏的文件输入 -->
    <input type="file" class="file-input" id="imageInput" accept="image/*">
    <input type="file" class="file-input" id="videoInput" accept="video/*">
    <input type="file" class="file-input" id="audioInput" accept="audio/*">
    <input type="file" class="file-input" id="model3dInput" accept=".glb,.gltf,.obj,.fbx,model/*">

    <!-- 上传类型选择弹窗 -->
    <div class="upload-modal-mask" id="uploadModalMask">
        <div class="upload-modal">
            <div class="upload-modal-title" id="uploadModalTitle">选择上传类型</div>
            <div class="upload-modal-sub" id="uploadModalSub">请选择要上传的资源类型</div>
            <div class="upload-modal-options">
                <div class="upload-modal-opt" onclick="pickUploadType('image')">
                    <span class="emo">🖼️</span>
                    <span>上传图片</span>
                </div>
                <div class="upload-modal-opt" onclick="pickUploadType('model25d')">
                    <span class="emo">🎬</span>
                    <span>2.5D 文件</span>
                </div>
                <div class="upload-modal-opt" onclick="pickUploadType('model3d')">
                    <span class="emo">🧊</span>
                    <span>3D 文件</span>
                </div>
                <div class="upload-modal-opt" onclick="pickUploadType('pipvideo')">
                    <span class="emo">📹</span>
                    <span>视频画中画</span>
                </div>
            </div>
            <button class="upload-modal-close" onclick="closeUploadModal()">取消</button>
        </div>
    </div>

    <!-- 提示 -->
    <div class="toast" id="toast"></div>

    <script src="app-state.js"></script>

        { key: 'fx_praybell',  name: '祈福铃声', emoji: '🛎️' },
        { key: 'fx_heartchant', name: '观音心咒播放按钮', emoji: '🙏' },
        { key: 'fx_falling',   name: '供品飘落动画', emoji: '🎋' }
    ];

    /* ============ 2. 渲染函数 ============ */

    // 1. 佛像主图三层结构
    function renderBuddhaMain() {
        const container = document.getElementById('buddha-main-list');
        container.innerHTML = BUDDHA_LIST.map(b => `
            <div class="item-row" data-key="${b.key}">
                <div class="preview-group">
                    <div class="item-preview" id="preview-${b.key}_layer1">🎬</div>
                    <div class="item-preview" id="preview-${b.key}_layer2">🌕</div>
                    <div class="item-preview" id="preview-${b.key}_layer3">🏛️</div>
                </div>
                <div class="item-info">
                    <div class="item-label">${b.name}</div>
                    <div class="layer-buttons">
                        <div class="layer-row">
                            <span class="layer-title">第一层</span>
                            <button class="upload-btn video" onclick="showUploadModal('${b.key}_layer1', '视频佛像')">📹 视频佛像</button>
                        </div>
                        <div class="layer-row">
                            <span class="layer-title">第二层</span>
                            <button class="upload-btn" onclick="showUploadModal('${b.key}_layer2', '光环')">📷 光环</button>
                        </div>
                        <div class="layer-row">
                            <span class="layer-title">第三层</span>
                            <button class="upload-btn" onclick="showUploadModal('${b.key}_layer3', '背景')">📷 背景</button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 2. 佛像光环配置
    function renderBuddhaHalo() {
        const container = document.getElementById('buddha-halo-list');
        container.innerHTML = BUDDHA_LIST.map(b => `
            <div class="item-row" data-key="${b.key}_halo">
                <div class="item-preview" id="preview-${b.key}_halo">🌕</div>
                <div class="item-info">
                    <div class="item-label">${b.name} · 光环</div>
                    <div class="item-inputs">
                        <div class="range-wrap">
                            <input type="range" class="range-input" id="${b.key}_halo_size"
                                min="100" max="200" value="120" step="5"
                                oninput="document.getElementById('${b.key}_halo_size_val').textContent=this.value+'%'">
                            <span class="range-value" id="${b.key}_halo_size_val">120%</span>
                        </div>
                        <input type="color" class="color-input" id="${b.key}_halo_color" value="#FFD700" title="光晕颜色">
                        <button class="toggle-btn on" id="${b.key}_halo_toggle"
                            onclick="toggleSwitch('${b.key}_halo_toggle')">启用</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 3. 背景图管理
    function renderBg() {
        const container = document.getElementById('bg-list');
        container.innerHTML = BG_LIST.map(bg => `
            <div class="item-row" data-key="${bg.key}">
                <div class="item-preview" id="preview-${bg.key}">${bg.emoji}</div>
                <div class="item-info">
                    <div class="item-label">${bg.name}</div>
                    <div class="item-inputs">
                        <button class="upload-btn" onclick="showUploadModal('${bg.key}', '${bg.name}')">📷 图片上传</button>
                        <button class="upload-btn video" onclick="resetFieldPreview('${bg.key}', '${bg.emoji}')">🔄 恢复默认</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 4. 灵宠
    function renderPet() {
        const container = document.getElementById('pet-list');
        container.innerHTML = PET_LIST.map(p => `
            <div class="item-row" data-key="${p.key}">
                <div class="item-preview" id="preview-${p.key}">${p.emoji}</div>
                <div class="item-info">
                    <div class="item-label">${p.name}</div>
                    <div class="item-inputs">
                        <button class="upload-btn" onclick="showUploadModal('${p.key}', '${p.name}')">📷 图片</button>
                        <button class="upload-btn model3d" onclick="showUploadModal('${p.key}', '${p.name}')">🧊 3D模型</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 6. 供桌与跪拜垫
    function renderAltar() {
        const container = document.getElementById('altar-list');
        container.innerHTML = ALTAR_LIST.map(a => `
            <div class="item-row" data-key="${a.key}">
                <div class="item-preview" id="preview-${a.key}">${a.emoji}</div>
                <div class="item-info">
                    <div class="item-label">${a.name}</div>
                    <div class="item-inputs">
                        <button class="upload-btn" onclick="showUploadModal('${a.key}', '${a.name}')">📷 图片上传</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 7. 青石板
    function renderSlab() {
        const container = document.getElementById('slab-list');
        container.innerHTML = SLAB_LIST.map(s => `
            <div class="item-row" data-key="${s.key}">
                <div class="item-preview" id="preview-${s.key}">${s.emoji}</div>
                <div class="item-info">
                    <div class="item-label">${s.name}</div>
                    <div class="item-inputs">
                        <button class="upload-btn" onclick="showUploadModal('${s.key}', '${s.name}')">📷 图片上传</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 5. 贡品
    function renderOffering() {
        const prayEl = document.getElementById('offering-pray-list');
        const remEl = document.getElementById('offering-rem-list');
        prayEl.innerHTML = OFFERING_PRAY.map(o => offeringRowHtml(o)).join('');
        remEl.innerHTML = OFFERING_REM.map(o => offeringRowHtml(o)).join('');
    }

    function offeringRowHtml(o) {
        return `
            <div class="item-row" data-key="${o.key}">
                <div class="item-preview" id="preview-${o.key}">${o.emoji}</div>
                <div class="item-info">
                    <div class="item-label">${o.name}</div>
                    <div class="item-inputs">
                        <button class="upload-btn" onclick="showUploadModal('${o.key}', '${o.name}')">📷 图片</button>
                        <button class="upload-btn video" onclick="showUploadModal('${o.key}', '${o.name}')">🎬 视频</button>
                    </div>
                </div>
            </div>
        `;
    }

    // 8. 特效与音乐
    function renderFx() {
        const container = document.getElementById('fx-list');
        container.innerHTML = FX_LIST.map(fx => `
            <div class="item-row" data-key="${fx.key}">
                <div class="item-preview" id="preview-${fx.key}">${fx.emoji}</div>
                <div class="item-info">
                    <div class="item-label">${fx.name}</div>
                    <div class="item-inputs">
                        <button class="toggle-btn on" id="${fx.key}_toggle"
                            onclick="toggleSwitch('${fx.key}_toggle')">启用</button>
                        <button class="upload-btn music" onclick="showUploadModal('${fx.key}_music', '${fx.name}音乐', 'audio')">🎵 音乐</button>
                        <button class="upload-btn fx" onclick="showUploadModal('${fx.key}_fx', '${fx.name}特效图', 'image')">✨ 特效图</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    /* ============ 3. 上传弹窗与文件处理 ============ */

    // 当前编辑字段
    let currentEditField = null;

    /**
     * 显示上传类型选择弹窗
     * @param {string} fieldKey 字段 key
     * @param {string} labelText 显示名（标题下方）
     * @param {string} [onlyType] 可选：image | video | audio | model3d | model25d | pipvideo，若设置则直接触发对应 file input，不弹弹窗
     */
    function showUploadModal(fieldKey, labelText, onlyType) {
        currentEditField = { key: fieldKey, label: labelText };

        // 若指定单一类型，直接跳过弹窗
        if (onlyType) {
            openFileInputByType(onlyType);
            return;
        }

        const titleEl = document.getElementById('uploadModalTitle');
        const subEl = document.getElementById('uploadModalSub');
        titleEl.textContent = '选择上传类型';
        subEl.textContent = '为「' + (labelText || fieldKey) + '」选择资源类型';

        document.getElementById('uploadModalMask').classList.add('show');
    }

    function closeUploadModal() {
        document.getElementById('uploadModalMask').classList.remove('show');
    }

    // 点击遮罩空白处关闭
    document.addEventListener('click', function (e) {
        if (e.target && e.target.id === 'uploadModalMask') {
            closeUploadModal();
        }
    });

    /**
     * 用户在弹窗上点击的类型按钮
     * @param {string} type image | model25d | model3d | pipvideo
     */
    function pickUploadType(type) {
        if (!currentEditField) return;
        closeUploadModal();
        openFileInputByType(type);
    }

    /**
     * 按逻辑类型打开对应 file input
     *   image    -> imageInput
     *   video    -> videoInput
     *   audio    -> audioInput
     *   model3d  -> model3dInput  (tag: 3D)
     *   model25d -> model3dInput  (tag: 2.5D)
     *   pipvideo -> videoInput    (tag: PIP)
     */
    function openFileInputByType(type) {
        if (!currentEditField) return;

        let input, mediaType, tag;
        switch (type) {
            case 'image':
                input = document.getElementById('imageInput');
                mediaType = 'image';
                tag = '';
                break;
            case 'video':
                input = document.getElementById('videoInput');
                mediaType = 'video';
                tag = '';
                break;
            case 'audio':
                input = document.getElementById('audioInput');
                mediaType = 'audio';
                tag = '';
                break;
            case 'model3d':
                input = document.getElementById('model3dInput');
                mediaType = 'model3d';
                tag = '3D';
                break;
            case 'model25d':
                input = document.getElementById('model3dInput');
                mediaType = 'model25d';
                tag = '2.5D';
                break;
            case 'pipvideo':
                input = document.getElementById('videoInput');
                mediaType = 'pipvideo';
                tag = '画中画';
                break;
            default:
                input = document.getElementById('imageInput');
                mediaType = 'image';
                tag = '';
        }

        const fieldKey = currentEditField.key;

        input.onchange = function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (event) {
                const dataUrl = event.target.result;
                applyFilePreview(fieldKey, mediaType, dataUrl, tag);
                saveMediaData(fieldKey, mediaType, dataUrl, tag);
                showToast('已上传：' + file.name);
            };
            reader.readAsDataURL(file);
        };
        input.value = '';
        input.click();
    }

    /**
     * 根据类型应用预览
     */
    function applyFilePreview(fieldKey, type, dataUrl, tag) {
        const preview = document.getElementById('preview-' + fieldKey);
        if (!preview) return;

        preview.classList.remove('has-tag');
        let inner = '';

        if (type === 'video' || type === 'pipvideo') {
            inner = '<video src="' + dataUrl + '" muted loop></video>';
        } else if (type === 'model3d' || type === 'model25d') {
            // 3D / 2.5D 使用图标占位 + 标签
            const emo = type === 'model25d' ? '🎬' : '🧊';
            inner = '<span class="icon-placeholder">' + emo + '</span>';
        } else if (type === 'audio') {
            inner = '<span class="icon-placeholder">🎵</span>';
        } else {
            inner = '<img src="' + dataUrl + '" alt="预览">';
        }

        preview.innerHTML = inner;

        // 若是视频则尝试自动播放
        if (type === 'video' || type === 'pipvideo') {
            const v = preview.querySelector('video');
            if (v) { try { v.play(); } catch (e) {} }
        }

        // 显示 3D / 2.5D / PIP / AUDIO 标签
        if (type === 'model3d' || type === 'model25d' || type === 'pipvideo' || type === 'audio') {
            const span = document.createElement('span');
            span.className = 'file-tag';
            span.textContent = tag || (type === 'audio' ? '音频' : '文件');
            preview.classList.add('has-tag');
            preview.appendChild(span);
        }
    }

    /* ============ 4. 缓存 / 保存 / 恢复默认 ============ */

    const _mediaCache = {};
    function saveMediaData(fieldKey, type, dataUrl, tag) {
        _mediaCache[fieldKey] = { type: type, data: dataUrl, tag: tag || '' };
    }

    function resetFieldPreview(fieldKey, defaultEmoji) {
        const preview = document.getElementById('preview-' + fieldKey);
        if (preview) {
            preview.classList.remove('has-tag');
            preview.textContent = defaultEmoji || '';
        }
        delete _mediaCache[fieldKey];
    }

    // 切换开关按钮状态
    function toggleSwitch(btnId) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        if (btn.classList.contains('on')) {
            btn.classList.remove('on');
            btn.classList.add('off');
            btn.textContent = '禁用';
        } else {
            btn.classList.remove('off');
            btn.classList.add('on');
            btn.textContent = '启用';
        }
    }

    // 收集所有输入值
    function collectAllValues() {
        const data = {};

        // 光环配置
        BUDDHA_LIST.forEach(b => {
            const sizeInput = document.getElementById(b.key + '_halo_size');
            const colorInput = document.getElementById(b.key + '_halo_color');
            const toggleBtn = document.getElementById(b.key + '_halo_toggle');
            data[b.key + '_halo'] = {
                size: sizeInput ? sizeInput.value : '120',
                color: colorInput ? colorInput.value : '#FFD700',
                enabled: toggleBtn ? toggleBtn.classList.contains('on') : true
            };
        });

        // 特效开关
        FX_LIST.forEach(fx => {
            const toggleBtn = document.getElementById(fx.key + '_toggle');
            if (!data[fx.key]) data[fx.key] = {};
            data[fx.key].enabled = toggleBtn ? toggleBtn.classList.contains('on') : true;
        });

        // 媒体资源（图片/视频/音频/3D/2.5D/PIP）
        Object.keys(_mediaCache).forEach(function (k) {
            data[k] = Object.assign({}, data[k] || {}, {
                mediaType: _mediaCache[k].type,
                mediaData: _mediaCache[k].data,
                mediaTag: _mediaCache[k].tag || ''
            });
        });

        return data;
    }

    function saveChanges() {
        try {
            const data = collectAllValues();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            showToast('保存成功！✅');
        } catch (e) {
            console.error(e);
            showToast('保存失败：' + (e.message || e));
        }
    }

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const data = JSON.parse(raw) || {};

            // 恢复光环配置
            BUDDHA_LIST.forEach(b => {
                const cfg = data[b.key + '_halo'];
                if (!cfg) return;
                const sizeInput = document.getElementById(b.key + '_halo_size');
                const colorInput = document.getElementById(b.key + '_halo_color');
                const toggleBtn = document.getElementById(b.key + '_halo_toggle');
                if (sizeInput) {
                    sizeInput.value = cfg.size;
                    const valEl = document.getElementById(b.key + '_halo_size_val');
                    if (valEl) valEl.textContent = cfg.size + '%';
                }
                if (colorInput) colorInput.value = cfg.color || '#FFD700';
                if (toggleBtn) {
                    if (cfg.enabled === false) {
                        toggleBtn.classList.remove('on');
                        toggleBtn.classList.add('off');
                        toggleBtn.textContent = '禁用';
                    } else {
                        toggleBtn.classList.remove('off');
                        toggleBtn.classList.add('on');
                        toggleBtn.textContent = '启用';
                    }
                }
            });

            // 恢复特效开关
            FX_LIST.forEach(fx => {
                const cfg = data[fx.key];
                if (!cfg) return;
                const toggleBtn = document.getElementById(fx.key + '_toggle');
                if (toggleBtn) {
                    if (cfg.enabled === false) {
                        toggleBtn.classList.remove('on');
                        toggleBtn.classList.add('off');
                        toggleBtn.textContent = '禁用';
                    }
                }
            });

            // 恢复媒体预览并填充缓存
            Object.keys(data).forEach(function (k) {
                const v = data[k];
                if (v && v.mediaType && v.mediaData) {
                    _mediaCache[k] = { type: v.mediaType, data: v.mediaData, tag: v.mediaTag || '' };
                    applyFilePreview(k, v.mediaType, v.mediaData, v.mediaTag || '');
                }
            });
        } catch (e) {
            console.error('加载数据失败', e);
        }
    }

    function resetToDefault() {
        if (!confirm('确定恢复所有默认设置吗？')) return;
        localStorage.removeItem(STORAGE_KEY);
        Object.keys(_mediaCache).forEach(function (k) { delete _mediaCache[k]; });
        location.reload();
    }

    /* ============ 5. 通用工具 ============ */
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 2000);
    }

    /* ============ 6. 初始化 ============ */
    (function init() {
        renderBuddhaMain();
        renderBuddhaHalo();
        renderBg();
        renderPet();
        renderAltar();
        renderSlab();
        renderOffering();
        renderFx();
        loadData();
    })();
    </script>
</body>
</html>
