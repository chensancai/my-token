<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>祈个福 · 个人中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        :root {
            --bg-warm: #F5E6D3;
            --primary: #8B5A2B;
            --primary-light: #A67B4B;
            --accent: #C04040;
            --trust: #7BA5A6;
            --text-dark: #4A3728;
            --text-light: #8B7355;
            --card-bg: #FDF8F3;
            --border: rgba(184, 134, 11, 0.3);
        }
        body { font-family: 'Noto Serif SC', serif; background: var(--bg-warm); min-height: 100vh; }
        /* 返回按钮 */
        .back-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            border: 1.5px solid rgba(184, 134, 11, 0.3);
            color: #8B5A2B;
        }
        
        /* 用户信息区 */
        .user-header {
            background: linear-gradient(180deg, #C4955A 0%, #D4A574 40%, #E8C99A 70%, var(--bg-warm) 100%);
            padding: 50px 20px 30px;
            position: relative;
        }
        .user-header::before {
            content: "✦ ✦ ✦";
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 150px;
            color: rgba(255,255,255,0.08);
            letter-spacing: 40px;
            pointer-events: none;
        }
        .user-info {
            display: flex;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFFBF0 0%, #FDF8F3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 3px solid rgba(184, 134, 11, 0.5);
            box-shadow: 0 4px 16px rgba(139, 90, 43, 0.25);
        }
        .user-detail {
            margin-left: 16px;
            flex: 1;
        }
        .user-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }
        .user-level {
            display: inline-block;
            background: linear-gradient(135deg, #A67B4B 0%, #B8860B 100%);
            color: #fff;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .user-id {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .edit-profile-btn {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            border: 1.5px solid var(--border);
        }
        
        /* 佛光/欢喜数据 */
        .stats-row {
            display: flex;
            justify-content: space-around;
            margin-top: 24px;
            position: relative;
            z-index: 1;
        }
        .stat-item {
            text-align: center;
            cursor: pointer;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2px;
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-light);
            letter-spacing: 1px;
        }
        .stat-divider {
            width: 1px;
            height: 40px;
            background: var(--border);
        }
        
        /* 内容区域 */
        .content-area {
            padding: 20px 16px 100px;
            max-width: 430px;
            margin: 0 auto;
        }
        
        /* 快捷功能 */
        .quick-actions {
            display: flex;
            justify-content: space-around;
            background: #fff;
            border-radius: 16px;
            padding: 20px 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(139,90,43,0.08);
        }
        .quick-item {
            text-align: center;
            cursor: pointer;
        }
        .quick-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bg-warm) 0%, #E8D5C4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin: 0 auto 8px;
        }
        .quick-label {
            font-size: 11px;
            color: var(--text-dark);
        }
        
        /* 菜单卡片 */
        .menu-card {
            background: #fff;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(139,90,43,0.08);
        }
        .menu-title {
            padding: 16px 20px 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border);
        }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            cursor: pointer;
            transition: background .2s;
        }
        .menu-item:active {
            background: var(--bg-warm);
        }
        .menu-item + .menu-item {
            border-top: 1px solid rgba(184, 134, 11, 0.1);
        }
        .menu-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 12px;
        }
        .menu-icon.orange { background: #FFF3E0; }
        .menu-icon.red { background: #FFEBEE; }
        .menu-icon.blue { background: #E3F2FD; }
        .menu-icon.green { background: #E8F5E9; }
        .menu-icon.purple { background: #F3E5F5; }
        .menu-icon.gold { background: #FFF8E1; }
        .menu-text {
            flex: 1;
            font-size: 14px;
            color: var(--text-dark);
        }
        .menu-arrow {
            font-size: 14px;
            color: #ccc;
        }
        .menu-badge {
            background: var(--accent);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-right: 8px;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 8px 20px;
        }
        .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
            opacity: 0.5;
        }
        .nav-item.active .nav-icon {
            opacity: 1;
        }
        .nav-label {
            font-size: 10px;
            color: var(--text-light);
        }
        .nav-item.active .nav-label {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <!-- 用户信息区 -->
    <div class="user-header">
        <div class="back-btn" onclick="goBack()">⬅</div>
        <div class="user-info">
            <div class="avatar">🙏</div>
            <div class="user-detail">
                <div class="user-name">一心向善</div>
                <div class="user-level">Lv.15 善信</div>
                <div class="user-id">ID: 88866688</div>
            </div>
            <a href="#" onclick="try{window.parent.goPage(10);}catch(e){location.href='settings.html';}return false;" class="edit-profile-btn">⚙️</a>
        </div>
        
        <div class="stats-row">
            <div class="stat-item" onclick="try{window.parent.goPage(9);}catch(e){location.href='wallet.html';}">
                <div class="stat-value">2,888</div>
                <div class="stat-label">佛光</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <div class="stat-value">1,520</div>
                <div class="stat-label">欢喜</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <div class="stat-value">365</div>
                <div class="stat-label">功德</div>
            </div>
        </div>
    </div>
    
    <!-- 内容区域 -->
    <div class="content-area">
        <!-- 快捷功能 -->
        <div class="quick-actions">
            <div class="quick-item" onclick="location.href='wallet.html'">
                <div class="quick-icon">💰</div>
                <div class="quick-label">钱包</div>
            </div>
            <div class="quick-item">
                <div class="quick-icon">📿</div>
                <div class="quick-label">佛珠</div>
            </div>
            <div class="quick-item">
                <div class="quick-icon">🏆</div>
                <div class="quick-label">成就</div>
            </div>
            <div class="quick-item">
                <div class="quick-icon">📜</div>
                <div class="quick-label">记录</div>
            </div>
        </div>
        
        <!-- 我的订单 -->
        <div class="menu-card">
            <div class="menu-title">我的祈愿</div>
            <div class="menu-item">
                <div class="menu-icon orange">🙏</div>
                <div class="menu-text">我的许愿</div>
                <div class="menu-arrow">›</div>
            </div>
            <div class="menu-item">
                <div class="menu-icon red">🕯️</div>
                <div class="menu-text">我的点灯</div>
                <div class="menu-badge">3</div>
                <div class="menu-arrow">›</div>
            </div>
            <div class="menu-item">
                <div class="menu-icon blue">📿</div>
                <div class="menu-text">我的供奉</div>
                <div class="menu-arrow">›</div>
            </div>
            <div class="menu-item">
                <div class="menu-icon green">🐟</div>
                <div class="menu-text">我的放生</div>
                <div class="menu-arrow">›</div>
            </div>
        </div>
        
        <!-- 服务与设置 -->
        <div class="menu-card">
            <div class="menu-title">服务与设置</div>
            <div class="menu-item">
                <div class="menu-icon purple">💳</div>
                <div class="menu-text">钱包与充值</div>
                <div class="menu-arrow">›</div>
            </div>
            <div class="menu-item">
                <div class="menu-icon gold">👑</div>
                <div class="menu-text">会员中心</div>
                <div class="menu-arrow">›</div>
            </div>
            <div class="menu-item" onclick="try{window.parent.goPage(10);}catch(e){location.href='settings.html';}">
                <div class="menu-icon blue">⚙️</div>
                <div class="menu-text">设置</div>
                <div class="menu-arrow">›</div>
            </div>
            <div class="menu-item">
                <div class="menu-icon green">📞</div>
                <div class="menu-text">联系客服</div>
                <div class="menu-arrow">›</div>
            </div>
        </div>
    </div>
    
    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="try{window.parent.goPage(1);}catch(e){location.href='index.html';}">
            <div class="nav-icon">🏛️</div>
            <div class="nav-label">佛堂</div>
        </div>
        <div class="nav-item" onclick="try{window.parent.goPage(2);}catch(e){location.href='remembrance.html';}">
            <div class="nav-icon">🕯️</div>
            <div class="nav-label">追思</div>
        </div>
        <div class="nav-item" onclick="try{window.parent.goPage(3);}catch(e){location.href='animal-release.html';}">
            <div class="nav-icon">🐟</div>
            <div class="nav-label">放生</div>
        </div>
        <div class="nav-item active">
            <div class="nav-icon">👤</div>
            <div class="nav-label">我的</div>
        </div>
    </div>
    <script>
        function goBack() {
            try {
                window.parent.goPage(0); // 在展示框架中返回首页
            } catch(e) {
                window.location.href = 'index.html'; // 独立打开时返回祈福页
            }
        }
    </script>
</body>
</html>
