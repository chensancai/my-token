<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>祈个福 · 用户注册</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        :root {
            --bg-warm: #F5E6D3;
            --primary: #8B5A2B;
            --primary-light: #A67B4B;
            --accent: #C04040;
            --text-dark: #4A3728;
            --text-light: #8B7355;
            --card-bg: #FDF8F3;
            --border: rgba(184, 134, 11, 0.3);
        }
        body { font-family: 'Noto Serif SC', serif; background: var(--card-bg); min-height: 100vh; }
        
        /* 顶部导航 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .back-btn {
            width: 36px;
            height: 36px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border: 1.5px solid var(--border);
            box-shadow: 0 2px 10px rgba(184,134,11,0.18);
            color: var(--primary);
        }
        .header-title {
            flex: 1;
            text-align: center;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
            color: var(--primary);
            letter-spacing: 4px;
            margin-right: 36px;
        }
        
        /* 内容区域 */
        .content {
            padding: 80px 24px 30px;
            max-width: 430px;
            margin: 0 auto;
        }
        
        /* 标题 */
        .section-title {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        
        /* 输入框 */
        .input-group {
            margin-bottom: 20px;
        }
        .input-label {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 8px;
            display: block;
        }
        .input-field {
            width: 100%;
            height: 52px;
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 0 20px;
            font-size: 15px;
            color: var(--text-dark);
            outline: none;
            font-family: inherit;
            transition: border-color .2s, box-shadow .2s;
        }
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 90, 43, 0.1);
        }
        .input-field::placeholder {
            color: #c4b5a5;
        }
        .input-row {
            display: flex;
            gap: 12px;
        }
        .input-row .input-field {
            flex: 1;
        }
        .btn-code {
            width: 110px;
            height: 52px;
            background: linear-gradient(135deg, #A67B4B 0%, #B8860B 50%, #6B4423 100%);
            border: 1.5px solid rgba(184, 134, 11, 0.5);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        
        /* 密码强度 */
        .password-strength {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .strength-item {
            flex: 1;
            height: 4px;
            background: #e0d8ce;
            border-radius: 2px;
            transition: background .3s;
        }
        .strength-item.active.weak { background: #e74c3c; }
        .strength-item.active.medium { background: #f39c12; }
        .strength-item.active.strong { background: #27ae60; }
        .strength-text {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
        }
        
        /* 协议 */
        .agreement-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 24px 0;
            font-size: 12px;
            color: var(--text-light);
        }
        .checkbox {
            width: 20px;
            height: 20px;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .2s;
            color: transparent;
        }
        .checkbox.checked {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .agreement-link {
            color: var(--primary);
            text-decoration: none;
        }
        
        /* 注册按钮 */
        .btn-register {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #A67B4B 0%, #B8860B 50%, #6B4423 100%);
            border: 1.5px solid rgba(184, 134, 11, 0.5);
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 4px;
            box-shadow: 0 3px 12px rgba(139,90,43,0.25);
        }
        .btn-register:active {
            transform: scale(0.97);
        }
        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* 已有账号 */
        .has-account {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-light);
        }
        .has-account a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        
        /* 滑动验证 */
        .slider-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .slider-modal.active { display: flex; }
        .slider-modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(74,55,40,0.6);
        }
        .slider-modal-card {
            position: relative;
            width: 300px;
            background: linear-gradient(180deg, #FFFBEE 0%, #FFF8EC 100%);
            border-radius: 16px;
            padding: 24px 20px 20px;
            border: 2px solid #D4A574;
            box-shadow: 0 20px 60px rgba(139,90,43,0.5);
        }
        .slider-modal-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
            color: #8B5A2B;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }
        .slider-modal-desc {
            font-size: 12px;
            color: #8B7355;
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        .slider-bar-wrap {
            position: relative;
            width: 100%;
        }
        .slider-bar-bg {
            width: 100%;
            height: 44px;
            background: #f0ebe3;
            border-radius: 22px;
            border: 1px solid #d4c4b0;
            position: relative;
            overflow: hidden;
        }
        .slider-bar-inner {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 44px;
            background: linear-gradient(135deg, #D4A574, #A67B4B);
            transition: width 0.1s;
            border-radius: 22px;
        }
        .slider-bar {
            position: absolute;
            top: 0;
            left: 2px;
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #A67B4B 0%, #B8860B 50%, #6B4423 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(139,90,43,0.4);
            z-index: 2;
        }
        .slider-bar-icon { color: #fff; font-size: 18px; font-weight: 700; }
        .slider-close-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            background: transparent;
            border: none;
            font-size: 20px;
            color: #8B5A2B;
            cursor: pointer;
            opacity: 0.6;
            font-weight: 700;
            line-height: 1;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header">
        <a href="login.html" class="back-btn">←</a>
        <div class="header-title">注册账号</div>
    </div>
    
    <!-- 内容区域 -->
    <div class="content">
        <!-- 基本信息 -->
        <div class="section-title">基本信息</div>
        <div class="input-group">
            <label class="input-label">手机号码</label>
            <input type="tel" class="input-field" id="phone" placeholder="请输入手机号" maxlength="11">
        </div>
        <div class="input-group">
            <div class="input-row">
                <input type="text" class="input-field" id="code" placeholder="验证码" maxlength="6">
                <button class="btn-code" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
            </div>
        </div>
        
        <!-- 设置密码 -->
        <div class="section-title" style="margin-top:30px;">设置密码</div>
        <div class="input-group">
            <label class="input-label">登录密码</label>
            <input type="password" class="input-field" id="password" placeholder="请设置登录密码（6-20位）" maxlength="20" oninput="checkPassword()">
            <div class="password-strength">
                <div class="strength-item" id="strength1"></div>
                <div class="strength-item" id="strength2"></div>
                <div class="strength-item" id="strength3"></div>
            </div>
            <div class="strength-text" id="strengthText">密码强度：未设置</div>
        </div>
        <div class="input-group">
            <label class="input-label">确认密码</label>
            <input type="password" class="input-field" id="confirmPassword" placeholder="请再次输入密码" maxlength="20">
        </div>
        
        <!-- 昵称 -->
        <div class="section-title" style="margin-top:30px;">个人信息</div>
        <div class="input-group">
            <label class="input-label">昵称（选填）</label>
            <input type="text" class="input-field" id="nickname" placeholder="请输入昵称" maxlength="20">
        </div>
        
        <!-- 协议 -->
        <div class="agreement-row">
            <div class="checkbox" id="agreeCheck" onclick="toggleAgree()">✓</div>
            <span>我已阅读并同意</span>
            <a href="#" class="agreement-link">《用户服务协议》</a>
            <span>和</span>
            <a href="#" class="agreement-link">《隐私政策》</a>
        </div>
        
        <!-- 注册按钮 -->
        <button class="btn-register" id="registerBtn" onclick="register()">注 册</button>
        
        <!-- 已有账号 -->
        <div class="has-account">
            已有账号？<a href="login.html">立即登录</a>
        </div>
    </div>
    
    <!-- 滑动验证弹窗 -->
    <div class="slider-modal" id="sliderModal">
        <div class="slider-modal-overlay" onclick="closeSlider()"></div>
        <div class="slider-modal-card">
            <button class="slider-close-btn" onclick="closeSlider()">×</button>
            <div class="slider-modal-title">安全验证</div>
            <div class="slider-modal-desc">请滑动完成验证</div>
            <div class="slider-bar-wrap">
                <div class="slider-bar-bg">
                    <div class="slider-bar-inner" id="sliderInner"></div>
                    <div class="slider-bar" id="sliderBar">
                        <span class="slider-bar-icon">→</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        var countdown = 60;
        var agreeChecked = false;
        var sliderVerified = false;
        var sliderIsDragging = false;
        var sliderStartX = 0;
        var sliderMaxMove = 0;
        var sliderTargetPos = 0;
        
        function sendCode() {
            var phone = document.getElementById('phone').value;
            if (!phone || phone.length !== 11) {
                showToast('请输入正确的手机号');
                return;
            }
            
            var btn = document.getElementById('sendCodeBtn');
            if (countdown < 60) return;
            
            // 先显示滑动验证
            showSlider();
        }
        
        // 滑动验证通过后的实际发送验证码
        function doSendCode() {
            var btn = document.getElementById('sendCodeBtn');
            if (countdown < 60) return;
            btn.textContent = countdown + 's';
            var timer = setInterval(function() {
                countdown--;
                btn.textContent = countdown + 's';
                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.textContent = '获取验证码';
                    countdown = 60;
                }
            }, 1000);
            showToast('验证码已发送');
        }
        
        function showSlider() {
            sliderVerified = false;
            resetSliderVerify();
            document.getElementById('sliderModal').classList.add('active');
        }
        
        function closeSlider() {
            document.getElementById('sliderModal').classList.remove('active');
            sliderIsDragging = false;
        }
        
        function resetSliderVerify() {
            var bar = document.getElementById('sliderBar');
            var sliderInner = document.getElementById('sliderInner');
            var barWrap = document.querySelector('.slider-bar-wrap');
            if (!bar || !sliderInner || !barWrap) return;
            
            var barWrapWidth = barWrap.offsetWidth;
            var barWidth = bar.offsetWidth || 44;
            sliderMaxMove = Math.max(0, barWrapWidth - barWidth - 4);
            
            var minPos = Math.floor(sliderMaxMove * 0.20);
            var maxPos = Math.floor(sliderMaxMove * 0.85);
            sliderTargetPos = Math.floor(Math.random() * (maxPos - minPos)) + minPos;
            
            bar.style.left = '2px';
            sliderInner.style.width = '44px';
            var icon = bar.querySelector('.slider-bar-icon');
            if (icon) icon.textContent = '→';
        }
        
        function startDrag(e) {
            if (sliderVerified) return;
            e.preventDefault();
            sliderIsDragging = true;
            sliderStartX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            var icon = bar.querySelector('.slider-bar-icon');
            if (icon) icon.textContent = '●●●';
        }
        
        var bar = document.getElementById('sliderBar');
        var sliderInner = document.getElementById('sliderInner');
        var barWidth = 44;
        
        bar.addEventListener('mousedown', startDrag);
        bar.addEventListener('touchstart', startDrag, { passive: false });
        
        document.addEventListener('mousemove', function(e) {
            if (!sliderIsDragging) return;
            var currentX = e.clientX;
            var diff = currentX - sliderStartX;
            var barLeft = parseInt(bar.style.left) || 2;
            var newLeft = Math.max(2, Math.min(barLeft + diff, sliderMaxMove + 2));
            bar.style.left = newLeft + 'px';
            sliderInner.style.width = (newLeft - 2 + barWidth) + 'px';
        });
        
        document.addEventListener('touchmove', function(e) {
            if (!sliderIsDragging) return;
            if (e.touches && e.touches.length > 0) {
                e.preventDefault();
                var currentX = e.touches[0].clientX;
                var diff = currentX - sliderStartX;
                var barLeft = parseInt(bar.style.left) || 2;
                var newLeft = Math.max(2, Math.min(barLeft + diff, sliderMaxMove + 2));
                bar.style.left = newLeft + 'px';
                sliderInner.style.width = (newLeft - 2 + barWidth) + 'px';
            }
        }, { passive: false });
        
        document.addEventListener('mouseup', checkSliderResult);
        document.addEventListener('touchend', checkSliderResult);
        
        function checkSliderResult() {
            if (!sliderIsDragging) return;
            sliderIsDragging = false;
            
            if (sliderVerified) return;
            
            var currentLeft = parseInt(bar.style.left) || 2;
            var tolerance = 15;
            var diff = Math.abs(currentLeft - 2 - sliderTargetPos);
            
            if (diff <= tolerance) {
                sliderVerified = true;
                bar.style.background = '#A67B4B';
                var icon = bar.querySelector('.slider-bar-icon');
                if (icon) icon.textContent = '✓';
                sliderInner.style.width = (sliderMaxMove + barWidth + 2) + 'px';
                
                showToast('验证通过');
                
                setTimeout(function() {
                    closeSlider();
                    doSendCode();
                }, 800);
            } else {
                resetSliderVerify();
            }
        }
        
        function showToast(msg) {
            var existing = document.querySelector('.login-toast');
            if (existing) existing.remove();
            
            var toast = document.createElement('div');
            toast.className = 'login-toast';
            toast.textContent = msg;
            toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(139,90,43,0.9);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;letter-spacing:2px;z-index:10000;font-family:"Ma Shan Zheng",cursive;opacity:0;transition:opacity 0.3s;';
            document.body.appendChild(toast);
            requestAnimationFrame(function() { toast.style.opacity = '1'; });
            setTimeout(function() {
                toast.style.opacity = '0';
                setTimeout(function() { toast.remove(); }, 300);
            }, 1500);
        }
        
        function toggleAgree() {
            agreeChecked = !agreeChecked;
            var check = document.getElementById('agreeCheck');
            check.classList.toggle('checked', agreeChecked);
            document.getElementById('registerBtn').disabled = !agreeChecked;
        }
        
        function checkPassword() {
            var pwd = document.getElementById('password').value;
            var s1 = document.getElementById('strength1');
            var s2 = document.getElementById('strength2');
            var s3 = document.getElementById('strength3');
            var text = document.getElementById('strengthText');
            
            s1.className = 'strength-item';
            s2.className = 'strength-item';
            s3.className = 'strength-item';
            
            if (pwd.length === 0) {
                text.textContent = '密码强度：未设置';
            } else if (pwd.length < 6) {
                text.textContent = '密码强度：太短';
            } else {
                var strength = 0;
                if (/[a-z]/.test(pwd) || /[A-Z]/.test(pwd)) strength++;
                if (/[0-9]/.test(pwd)) strength++;
                if (/[^a-zA-Z0-9]/.test(pwd)) strength++;
                
                if (strength === 1) {
                    s1.className = 'strength-item active weak';
                    text.textContent = '密码强度：弱';
                } else if (strength === 2) {
                    s1.className = 'strength-item active medium';
                    s2.className = 'strength-item active medium';
                    text.textContent = '密码强度：中';
                } else if (strength === 3) {
                    s1.className = 'strength-item active strong';
                    s2.className = 'strength-item active strong';
                    s3.className = 'strength-item active strong';
                    text.textContent = '密码强度：强';
                }
            }
        }
        
        function register() {
            if (!agreeChecked) {
                showToast('请先阅读并同意用户协议');
                return;
            }
            var phone = document.getElementById('phone').value;
            var code = document.getElementById('code').value;
            var pwd = document.getElementById('password').value;
            var confirmPwd = document.getElementById('confirmPassword').value;
            
            if (!phone || phone.length !== 11) {
                showToast('请输入正确的手机号');
                return;
            }
            if (!code) {
                showToast('请输入验证码');
                return;
            }
            if (pwd.length < 6) {
                showToast('密码长度不能少于6位');
                return;
            }
            if (pwd !== confirmPwd) {
                showToast('两次输入的密码不一致');
                return;
            }
            
            showToast('注册成功！');
            setTimeout(function() {
                window.location.href = 'profile.html';
            }, 1000);
        }
    </script>
</body>
</html>
