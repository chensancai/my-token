<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章编辑 | 祈个福</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1810 50%, #1a0a0a 100%);
            min-height: 100vh;
            color: #4A3728;
        }
        .page-container { padding: 10px; max-width: 400px; margin: 0 auto; }
        .phone-wrap {
            background: #111;
            border-radius: 40px;
            padding: 8px;
            box-shadow: 0 0 0 2px #D4AF37, 0 0 30px rgba(212,175,55,0.15), 0 15px 40px rgba(0,0,0,0.5);
        }
        .phone-notch {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 22px;
            background: #000;
            border-radius: 12px;
            z-index: 50;
        }
        .phone-screen {
            width: 100%;
            min-height: 900px;
            border-radius: 32px;
            overflow: hidden;
            background: #FFFBEE;
            position: relative;
        }
        .status-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 44px;
            padding: 10px 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            z-index: 10;
            color: rgba(0,0,0,0.7);
        }
        .back-btn {
            position: absolute;
            top: 8px; left: 10px;
            width: 30px; height: 30px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 100;
            color: #fff;
            border: none;
        }
        .back-btn:active { transform: scale(0.93); }
        .scroll-area { padding: 60px 20px 20px; }

        .publish-header {
            padding: 55px 20px 20px;
            background: linear-gradient(135deg,#8B5A2B 0%,#D4A574 50%,#8B5A2B 100%);
            color: #fff;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin: -60px -20px 20px;
        }
        .publish-title {
            font-family:'Ma Shan Zheng',cursive;
            font-size:22px;
            letter-spacing:5px;
            margin-bottom:4px;
            position: relative;
            z-index: 2;
        }
        .publish-sub {
            font-size:11px;
            opacity:0.9;
            letter-spacing:2px;
            position: relative;
            z-index: 2;
        }

        .form-group { margin-bottom: 16px; }
        .form-label {
            font-size: 12px;
            color: #8B5A2B;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
            font-family: 'Ma Shan Zheng', cursive;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            font-size: 13px;
            border: 1.5px solid #D4A574;
            border-radius: 10px;
            background: #FFF8EC;
            color: #4A3728;
            outline: none;
            font-family: inherit;
        }
        .form-input:focus { border-color: #8B5A2B; box-shadow: 0 0 0 3px rgba(139,90,43,0.1); }
        .form-textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }
        .form-textarea.big { min-height: 320px; line-height: 1.8; }

        .type-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .type-item {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1.5px solid rgba(184,134,11,0.3);
            background: #fff;
            font-size: 12px;
            color: #8B7355;
            cursor: pointer;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 1px;
        }
        .type-item.active {
            background: linear-gradient(135deg,#FFF8EC 0%,#FFF 100%);
            border-color: #D4A574;
            color: #8B5A2B;
        }

        .cover-upload {
            border: 2px dashed rgba(184,134,11,0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg,#FFF8EC 0%,#FFF 100%);
            color: #8B7355;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
        }
        .cover-upload .emoji { font-size: 30px; display: block; margin-bottom: 6px; }

        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .tool-btn {
            padding: 4px 8px;
            background: #FFF8EC;
            border: 1px solid rgba(184,134,11,0.25);
            border-radius: 6px;
            font-size: 11px;
            color: #8B5A2B;
            cursor: pointer;
            letter-spacing: 1px;
            font-weight: 700;
            font-family: 'Ma Shan Zheng', cursive;
        }
        .tool-btn.italic { font-style: italic; font-family: inherit; }

        .publish-bottom {
            padding: 12px 20px 16px;
            background: rgba(255,248,240,0.98);
            border-top: 1px solid rgba(184,134,11,0.2);
            display: flex;
            gap: 12px;
            margin: 20px -20px -20px;
        }
        .btn-action {
            flex: 1;
            padding: 14px 0;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: 'Ma Shan Zheng', cursive;
            border: none;
        }
        .btn-cancel { background: #fff; color: #8B7355; border: 1.5px solid rgba(184,134,11,0.3); }
        .btn-save { background: #FFF8EC; color: #8B5A2B; border: 1.5px solid #D4A574; }
        .btn-publish {
            background: linear-gradient(135deg,#A67B4B 0%,#B8860B 50%,#6B4423 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(184,134,11,0.3);
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(139,90,43,0.92);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            letter-spacing: 2px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            font-family:'Ma Shan Zheng',cursive;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="phone-wrap">
            <div class="phone-screen">
                <div class="phone-notch"></div>
                <div class="status-bar"><span>9:41</span><span>●●● 5G</span></div>
                <div>
                    <button class="back-btn" onclick="history.back()" aria-label="返回">‹</button>
                    <div class="scroll-area">
                        <div class="publish-header">
                            <div class="publish-title">编辑文章</div>
                            <div class="publish-sub">协议 · 帮助 · 关于我们</div>
                        </div>

                        <!-- 文章类型 -->
                        <div class="form-group">
                            <div class="form-label">文章类型</div>
                            <div class="type-group">
                                <div class="type-item active" onclick="selectType(this)">协议板块</div>
                                <div class="type-item" onclick="selectType(this)">帮助与反馈</div>
                                <div class="type-item" onclick="selectType(this)">关于我们</div>
                            </div>
                        </div>

                        <!-- 文章标题 -->
                        <div class="form-group">
                            <div class="form-label">文章标题</div>
                            <input type="text" class="form-input" placeholder="如：隐私保护政策">
                        </div>

                        <!-- 文章摘要 -->
                        <div class="form-group">
                            <div class="form-label">文章摘要（选填）</div>
                            <textarea class="form-input form-textarea" placeholder="一句话介绍本文内容，将显示在卡片与搜索结果中"></textarea>
                        </div>

                        <!-- 封面图 -->
                        <div class="form-group">
                            <div class="form-label">封面图（选填）</div>
                            <div class="cover-upload" onclick="showToast('✦ 点击上传图片')">
                                <span class="emoji">🖼</span>
                                点击上传封面图
                                <div style="font-size:11px;opacity:0.7;margin-top:4px">建议尺寸 800×600 · jpg/png</div>
                            </div>
                        </div>

                        <!-- 正文编辑 -->
                        <div class="form-group">
                            <div class="form-label">正文内容</div>
                            <div class="editor-toolbar">
                                <button class="tool-btn" onclick="showToast('✦ 加粗')"><b>B</b></button>
                                <button class="tool-btn italic" onclick="showToast('✦ 斜体')"><i>I</i></button>
                                <button class="tool-btn" onclick="showToast('✦ 标题样式')">标题</button>
                                <button class="tool-btn" onclick="showToast('✦ 段落')">¶ 段落</button>
                                <button class="tool-btn" onclick="showToast('✦ 链接')">🔗 链接</button>
                            </div>
                            <textarea class="form-input form-textarea big" placeholder="在此编写文章正文。支持加粗/斜体/标题/段落/链接等格式化。

示例：

# 第一章 总则

为规范用户使用佑愿好物商城服务，根据相关法律法规制定本协议。

## 1.1 定义

佑愿好物商城指由我方运营的网站、小程序及 App。"></textarea>
                        </div>

                        <!-- 生效日期与版本 -->
                        <div style="display:flex;gap:10px;margin-bottom:30px">
                            <div class="form-group" style="flex:1;margin-bottom:0">
                                <div class="form-label">生效日期</div>
                                <input type="text" class="form-input" placeholder="2026-06-01">
                            </div>
                            <div class="form-group" style="flex:1;margin-bottom:0">
                                <div class="form-label">版本号</div>
                                <input type="text" class="form-input" placeholder="v 1.2">
                            </div>
                        </div>

                        <div class="publish-bottom">
                            <button class="btn-action btn-cancel" onclick="history.back()">返回列表</button>
                            <button class="btn-action btn-save" onclick="showToast('✦ 已保存草稿')">保存草稿</button>
                            <button class="btn-action btn-publish" onclick="showToast('✦ 文章已发布')">发布</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        }
        function selectType(el) {
            document.querySelectorAll('.type-item').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
