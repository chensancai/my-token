<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>祈个福 · 幸运大转盘</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        margin: 0;
        background:
            radial-gradient(ellipse at 30% 20%, rgba(255, 100, 150, 0.15) 0%, transparent 50%),
            radial-gradient(ellipse at 70% 80%, rgba(100, 150, 255, 0.15) 0%, transparent 50%),
            linear-gradient(135deg, #2a0845 0%, #4a148c 30%, #1a237e 70%, #0d0d2b 100%);
        overflow-x: hidden;
        min-height: 100vh;
        position: relative;
    }

    /* 背景星光 */
    .starry-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
    }
    .star {
        position: absolute;
        width: 3px; height: 3px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 6px #fff, 0 0 12px rgba(255,255,255,0.6);
        animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
    }

    /* 主内容区 */
    .container {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 5px 15px 20px;
    }

    /* 标题区（整体向上移，避免遮挡转盘内的图标） */
    .header {
        text-align: center;
        margin-bottom: 10px;
        padding-top: 0;
        margin-top: -5px;
        position: relative;
        z-index: 40;
    }
    .title {
        font-size: 26px;
        background: linear-gradient(135deg, #FFD700 0%, #FFA500 30%, #FF6347 60%, #FFD700 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
        letter-spacing: 6px;
        font-weight: bold;
        text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        margin-bottom: 4px;
        animation: titleGlow 2s ease-in-out infinite alternate;
    }
    @keyframes titleGlow {
        0% { filter: drop-shadow(0 0 10px #FFD700); }
        100% { filter: drop-shadow(0 0 25px #FF6347); }
    }
    .subtitle {
        font-size: 12px;
        color: rgba(255, 215, 0, 0.85);
        letter-spacing: 4px;
    }

    /* 转盘外围容器（和下方内容同步下移） */
    .wheel-outer {
        position: relative;
        width: 340px;
        height: 340px;
        max-width: 92vw;
        max-height: 92vw;
        aspect-ratio: 1 / 1;
        margin-top: 25px;
        margin-bottom: 25px;
    }

    /* 外环装饰（跑马灯光点） */
    .light-ring {
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        background: conic-gradient(from 0deg,
            #FFD700, #FF6347, #FFD700, #FF6347,
            #FFD700, #FF6347, #FFD700, #FF6347,
            #FFD700, #FF6347, #FFD700, #FF6347,
            #FFD700, #FF6347, #FFD700, #FF6347, #FFD700);
        filter: blur(2px);
        opacity: 0.6;
        animation: lightRingRotate 8s linear infinite;
    }
    @keyframes lightRingRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* 跑马灯光点（独立小圆点） */
    .marquee-dots {
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        pointer-events: none;
    }
    .marquee-dot {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #FFD700;
        box-shadow: 0 0 10px #FFD700, 0 0 20px #FFA500;
        top: 50%;
        left: 50%;
        transform-origin: 0 0;
        animation: dotBlink 1s ease-in-out infinite;
    }
    @keyframes dotBlink {
        0%, 100% { opacity: 1; box-shadow: 0 0 12px #FFD700, 0 0 24px #FFA500; }
        50% { opacity: 0.4; box-shadow: 0 0 4px #FFD700; }
    }

    /* 转盘主体 */
    .wheel {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: #fff;
        box-shadow:
            0 0 40px rgba(255, 215, 0, 0.4),
            0 10px 50px rgba(0, 0, 0, 0.5),
            inset 0 0 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition: transform 6s cubic-bezier(0.17, 0.67, 0.21, 1);
    }

    /* 8个扇区 - 用 conic-gradient */
    .wheel-segments {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
            from -22.5deg,
            #FF1744 0deg 45deg,
            #FFD700 45deg 90deg,
            #2979FF 90deg 135deg,
            #9C27B0 135deg 180deg,
            #FF1744 180deg 225deg,
            #FFD700 225deg 270deg,
            #2979FF 270deg 315deg,
            #9C27B0 315deg 360deg
        );
    }

    /* 扇区分割线 */
    .wheel-segments::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
            conic-gradient(from -22.5deg,
                transparent 0deg 44deg,
                rgba(255,255,255,0.6) 44deg 46deg,
                transparent 46deg 89deg,
                rgba(255,255,255,0.6) 89deg 91deg,
                transparent 91deg 134deg,
                rgba(255,255,255,0.6) 134deg 136deg,
                transparent 136deg 179deg,
                rgba(255,255,255,0.6) 179deg 181deg,
                transparent 181deg 224deg,
                rgba(255,255,255,0.6) 224deg 226deg,
                transparent 226deg 269deg,
                rgba(255,255,255,0.6) 269deg 271deg,
                transparent 271deg 314deg,
                rgba(255,255,255,0.6) 314deg 316deg,
                transparent 316deg 359deg,
                rgba(255,255,255,0.6) 359deg 361deg
            );
    }

    /* 扇区文字 */
    .wheel-labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }
    .wheel-label {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 96px;
        height: 160px;
        margin-left: -48px;
        margin-top: -160px;
        transform-origin: 50% 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 8px;
        color: #fff;
        font-weight: bold;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5), 0 0 8px rgba(0,0,0,0.3);
        letter-spacing: 1px;
    }
    .wheel-label .label-icon {
        font-size: 34px;
        margin-bottom: 2px;
    }
    .wheel-label .label-text {
        font-size: 15px;
        text-align: center;
        line-height: 1.2;
    }
    .wheel-label .label-text small {
        font-size: 12px;
        opacity: 0.95;
    }

    /* 中心 GO 按钮 */
    .center-button {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 90px;
        height: 90px;
        margin-left: -45px;
        margin-top: -45px;
        border-radius: 50%;
        background:
            radial-gradient(circle at 30% 30%, #FFE066 0%, #FFD700 30%, #FFA500 70%, #FF6347 100%);
        border: 4px solid #fff;
        box-shadow:
            0 0 20px rgba(255, 215, 0, 0.8),
            0 6px 20px rgba(0, 0, 0, 0.4),
            inset 0 -4px 10px rgba(0, 0, 0, 0.2),
            inset 0 4px 10px rgba(255, 255, 255, 0.5);
        cursor: pointer;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: bold;
        color: #fff;
        text-shadow:
            0 2px 4px rgba(0,0,0,0.5),
            0 0 10px rgba(255,255,255,0.8);
        letter-spacing: 2px;
        transition: transform 0.2s, opacity 0.2s;
        animation: laserPulse 2s ease-in-out infinite;
    }
    @keyframes laserPulse {
        0%, 100% {
            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.8),
                0 6px 20px rgba(0, 0, 0, 0.4),
                inset 0 -4px 10px rgba(0, 0, 0, 0.2),
                inset 0 4px 10px rgba(255, 255, 255, 0.5);
        }
        50% {
            box-shadow:
                0 0 35px rgba(255, 100, 100, 1),
                0 0 50px rgba(255, 215, 0, 0.6),
                0 6px 20px rgba(0, 0, 0, 0.4),
                inset 0 -4px 10px rgba(0, 0, 0, 0.2),
                inset 0 4px 10px rgba(255, 255, 255, 0.7);
        }
    }
    .center-button:active:not(:disabled) {
        transform: scale(0.92);
    }
    .center-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        animation: none;
        filter: grayscale(0.5);
    }

    /* 指针（固定在转盘顶部，指向下方）——整体向上移，不碰转盘内的图标 */
    .pointer {
        position: absolute;
        top: -35px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 86px;
        z-index: 30;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        pointer-events: none;
    }
    .pointer-shape {
        width: 100%;
        height: 100%;
        position: relative;
    }
    .pointer-shape::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #FFE066 0%, #FFD700 40%, #FF6347 100%);
        border: 3px solid #fff;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
    }
    .pointer-shape::after {
        content: '';
        position: absolute;
        top: 26px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-top: 44px solid #FFD700;
        filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    }

    /* 中奖扇区高亮 */
    .wheel.highlight-win {
        animation: wheelWinPulse 0.6s ease-in-out 3;
    }
    @keyframes wheelWinPulse {
        0%, 100% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.4), 0 10px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.1); }
        50% { box-shadow: 0 0 80px rgba(255, 215, 0, 1), 0 0 100px rgba(255, 100, 100, 0.6), 0 10px 50px rgba(0, 0, 0, 0.5); }
    }

    /* 按钮区 */
    .action-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
    }
    .status-text {
        color: rgba(255, 215, 0, 0.85);
        font-size: 14px;
        letter-spacing: 3px;
    }
    .info-chips {
        display: flex;
        gap: 12px;
        margin-top: 8px;
    }
    .info-chip {
        background: rgba(255, 215, 0, 0.12);
        border: 1px solid rgba(255, 215, 0, 0.35);
        border-radius: 18px;
        padding: 6px 14px;
        font-size: 12px;
        color: rgba(255, 215, 0, 0.9);
        letter-spacing: 1px;
    }
    .info-chip span {
        color: #FFD700;
        font-weight: bold;
    }

    /* 返回首页 */
    .back-home {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 215, 0, 0.12);
        border: 1px solid rgba(255, 215, 0, 0.3);
        color: rgba(255, 215, 0, 0.9);
        padding: 8px 20px;
        border-radius: 18px;
        font-size: 12px;
        cursor: pointer;
        z-index: 100;
        text-decoration: none;
        letter-spacing: 2px;
    }

    /* ========== 毛玻璃弹窗 ========== */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.4s;
    }
    .modal-overlay.show {
        display: flex;
        opacity: 1;
    }
    .modal {
        width: 88%;
        max-width: 340px;
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 24px;
        padding: 35px 25px 28px;
        text-align: center;
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.6);
        transform: scale(0.6) translateY(40px);
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
    }
    .modal-overlay.show .modal {
        transform: scale(1) translateY(0);
    }

    .modal::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(from 0deg, transparent, rgba(255,215,0,0.15), transparent, rgba(255,100,150,0.1), transparent);
        animation: modalShine 6s linear infinite;
        pointer-events: none;
    }
    @keyframes modalShine {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .modal-emoji {
        font-size: 64px;
        margin-bottom: 10px;
        position: relative;
        z-index: 1;
        animation: emojiBounce 1.5s ease-in-out infinite;
    }
    @keyframes emojiBounce {
        0%, 100% { transform: translateY(0) rotate(-5deg); }
        50% { transform: translateY(-8px) rotate(5deg); }
    }
    .modal-title {
        font-size: 24px;
        font-weight: bold;
        background: linear-gradient(135deg, #FFD700, #FFA500, #FF6347);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
        letter-spacing: 4px;
        position: relative;
        z-index: 1;
    }
    .modal-title.lose {
        background: linear-gradient(135deg, #B0BEC5, #90A4AE);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .modal-desc {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 8px;
        letter-spacing: 1px;
        position: relative;
        z-index: 1;
    }
    .modal-prize {
        font-size: 28px;
        color: #FFD700;
        font-weight: bold;
        margin: 15px 0;
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        position: relative;
        z-index: 1;
    }
    .modal-btn-row {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 20px;
        position: relative;
        z-index: 1;
    }
    .modal-close-btn, .modal-share-btn {
        padding: 12px 24px;
        border-radius: 24px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        letter-spacing: 2px;
        border: none;
        transition: transform 0.2s;
    }
    .modal-close-btn {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(10px);
    }
    .modal-share-btn {
        background: linear-gradient(135deg, #FFD700, #FF6347);
        color: #fff;
        box-shadow: 0 6px 20px rgba(255, 100, 100, 0.5);
    }
    .modal-close-btn:active, .modal-share-btn:active {
        transform: scale(0.94);
    }

    /* 中奖时的金光特效 */
    .win-glow {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,215,0,0.8) 0%, transparent 60%);
        z-index: 900;
        pointer-events: none;
        animation: winGlowAnim 2s ease-out forwards;
    }
    @keyframes winGlowAnim {
        0% { width: 20px; height: 20px; opacity: 1; }
        100% { width: 1500px; height: 1500px; opacity: 0; }
    }

    /* 五彩纸屑 */
    .confetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 950;
        overflow: hidden;
    }
    .confetti-piece {
        position: absolute;
        width: 10px;
        height: 14px;
        top: -20px;
        animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
    }

    /* Toast 提示 */
    .toast {
        position: fixed;
        top: 32%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(139, 90, 43, 0.85);
        color: #FFD700;
        padding: 12px 28px;
        border-radius: 28px;
        font-size: 14px;
        letter-spacing: 2px;
        z-index: 1200;
        border: 1px solid rgba(255, 215, 0, 0.4);
        animation: toastIn 1.8s ease-out forwards;
        pointer-events: none;
    }
    @keyframes toastIn {
        0% { opacity: 0; transform: translate(-50%, -30%) scale(0.85); }
        15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -70%) scale(0.95); }
    }

    /* 小屏适配 */
    @media (max-width: 360px) {
        .wheel-outer { width: 300px; height: 300px; }
        .title { font-size: 26px; letter-spacing: 6px; }
        .wheel-label { width: 84px; height: 140px; margin-left: -42px; margin-top: -140px; padding-top: 6px; }
        .wheel-label .label-icon { font-size: 28px; }
        .wheel-label .label-text { font-size: 13px; }
        .wheel-label .label-text small { font-size: 11px; }
        .center-button { width: 78px; height: 78px; margin-left: -39px; margin-top: -39px; font-size: 24px; }
    }
    </style>
</head>
<body>
    <div class="starry-bg" id="starryBg"></div>

    <div class="container">
        <div class="header">
            <h1 class="title">幸运大转盘</h1>
            <p class="subtitle">✨ 转动好运 · 欢喜连连 ✨</p>
        </div>

        <div class="wheel-outer" id="wheelOuter">
            <div class="light-ring"></div>
            <div class="marquee-dots" id="marqueeDots"></div>

            <!-- 固定指针 -->
            <div class="pointer">
                <div class="pointer-shape"></div>
            </div>

            <!-- 转盘（会旋转） -->
            <div class="wheel" id="wheel">
                <div class="wheel-segments"></div>
                <div class="wheel-labels" id="wheelLabels">
                    <!-- 由 JS 生成 8 个扇区 -->
                </div>
            </div>

            <!-- 中心按钮 -->
            <button class="center-button" id="spinBtn">GO</button>
        </div>

        <div class="action-area">
            <div class="status-text" id="statusText">🎯 点击中心按钮开转（每次消耗50欢喜）</div>
            <div class="info-chips">
                <div class="info-chip">剩余次数 <span id="remaining">1</span></div>
                <div class="info-chip">累计 <span id="totalScore">0</span> 欢喜</div>
            </div>
        </div>
    </div>

    <a href="#" onclick="try{window.parent.goPage(0);}catch(e){window.history.back();}return false;" class="back-home">← 返回首页</a>

    <!-- 结果弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-emoji" id="modalEmoji">🎉</div>
            <div class="modal-title" id="modalTitle">恭喜中奖</div>
            <div class="modal-desc" id="modalDesc">好运连连 · 欢喜无限</div>
            <div class="modal-prize" id="modalPrize">神秘大奖</div>
            <div class="modal-btn-row">
                <button class="modal-close-btn" id="modalCloseBtn">继续</button>
                <button class="modal-share-btn" id="modalShareBtn">📤 分享奖励</button>
            </div>
        </div>
    </div>

    <script>
    // ========== 奖品配置（8 个扇区，与游戏机管理页一致：price=50, reward=500, prob=5%） ==========
    const PRIZES = [
        { icon: '🎁', text: '谢谢参与', isWin: false,  desc: '下次再来 · 好运在后头' },  // 0
        { icon: '💰', text: '50 欢喜',  isWin: true,   desc: '小财入手 · 聚沙成塔', amount: 50 },   // 1
        { icon: '🎫', text: '100 欢喜',  isWin: true,  desc: '神秘欢喜 · 惊喜连连', amount: 100 },  // 2
        { icon: '🌟', text: '谢谢参与', isWin: false, desc: '再接再厉 · 福运绵长' },  // 3
        { icon: '🏆', text: '500 欢喜', isWin: true,   desc: '大惊喜降临 · 福气满满', amount: 500 }, // 4
        { icon: '✨', text: '谢谢参与', isWin: false, desc: '心诚则灵 · 下次必中' },  // 5
        { icon: '🎊', text: '谢谢参与', isWin: false, desc: '下次再来 · 福气常存' },  // 6
        { icon: '💎', text: '200 欢喜', isWin: true,   desc: '福气临门 · 财源滚滚', amount: 200 }   // 7
    ];

    // ========== 概率配置（约 5% 中奖率，与游戏机管理页一致） ==========
    // 权重值（越大越容易中）；实际中奖概率 ≈ 5%
    const PRIZE_WEIGHTS = [95, 1, 1, 95, 0.5, 95, 95, 0.5]; // 对应 PRIZES[0]..[7]

    const SEGMENTS_COUNT = 8;
    const SEGMENT_ANGLE = 360 / SEGMENTS_COUNT; // 45°
    // 指针在顶部（0°），每个扇区中心为 -22.5° + i*45°
    // 为让指针指向第 i 个扇区中心，转盘最终旋转角 = 22.5° - i*45° + k*360°

    let remaining = 3;
    let totalScore = 0;
    let isSpinning = false;
    let currentRotation = 0;

    const wheelEl = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const statusText = document.getElementById('statusText');
    const remainingEl = document.getElementById('remaining');
    const totalScoreEl = document.getElementById('totalScore');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalEmoji = document.getElementById('modalEmoji');
    const modalTitle = document.getElementById('modalTitle');
    const modalTitleEl = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalPrize = document.getElementById('modalPrize');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalShareBtn = document.getElementById('modalShareBtn');

    // ========== 生成 8 个扇区文字 ==========
    (function buildWheelLabels() {
        const labelsEl = document.getElementById('wheelLabels');
        for (let i = 0; i < SEGMENTS_COUNT; i++) {
            const prize = PRIZES[i];
            const label = document.createElement('div');
            label.className = 'wheel-label';
            // 让文字沿径向分布：第 0 个扇区中心指向正上方偏左
            // conic-gradient from -22.5deg，所以第 i 个扇区中心角度 = i*45°（以12点方向顺时针）
            // 我们让 label 的 transform-origin 为 50% 100%（底部中心），然后旋转到对应扇区中心
            // 默认 label 朝上（指向正上方），需要旋转到扇区中心位置
            const angle = i * SEGMENT_ANGLE;
            label.style.transform = `rotate(${angle}deg)`;

            // 调整文字颜色，根据扇区背景
            const colors = [
                '#fff', // 红
                '#8B0000', // 金
                '#fff', // 蓝
                '#fff', // 紫
                '#fff', // 红
                '#8B0000', // 金
                '#fff', // 蓝
                '#fff'  // 紫
            ];
            label.style.color = colors[i];

            const smallText = prize.isWin ? `<small>${prize.amount}欢喜</small>` : '<small>再接再厉</small>';
            label.innerHTML = `
                <div class="label-icon">${prize.icon}</div>
                <div class="label-text">${prize.text}<br>${smallText}</div>
            `;
            labelsEl.appendChild(label);
        }
    })();

    // ========== 生成星光背景 ==========
    (function buildStarryBg() {
        const container = document.getElementById('starryBg');
        for (let i = 0; i < 30; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = (Math.random() * 3) + 's';
            s.style.animationDuration = (2 + Math.random() * 3) + 's';
            const size = 2 + Math.random() * 3;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            container.appendChild(s);
        }
    })();

    // ========== 生成跑马灯光点 ==========
    (function buildMarqueeDots() {
        const container = document.getElementById('marqueeDots');
        const dotCount = 24;
        for (let i = 0; i < dotCount; i++) {
            const dot = document.createElement('div');
            dot.className = 'marquee-dot';
            const angle = (i / dotCount) * 360;
            // 用三角函数定位到圆周上，半径约 = 容器半径
            const radius = 165; // 340/2 - 8(light-ring) - 些许边距
            const rad = (angle - 90) * Math.PI / 180;
            const x = Math.cos(rad) * radius;
            const y = Math.sin(rad) * radius;
            dot.style.transform = `translate(${x}px, ${y}px)`;
            dot.style.animationDelay = (i * 0.08) + 's';
            container.appendChild(dot);
        }
    })();

    // ========== 核心：旋转转盘 ==========
    spinBtn.addEventListener('click', function() {
        if (isSpinning) return;
        if (remaining <= 0) {
            showToast('今日次数已用完，明天再来吧～');
            return;
        }

        isSpinning = true;
        spinBtn.disabled = true;
        statusText.textContent = '🎰 转动中...请稍候';

        // 按权重选择一个目标扇区
        let totalW = 0;
        for (let w = 0; w < PRIZE_WEIGHTS.length; w++) totalW += PRIZE_WEIGHTS[w];
        let randPick = Math.random() * totalW;
        let targetIndex = 0;
        for (let k = 0; k < PRIZE_WEIGHTS.length; k++) {
            if (randPick < PRIZE_WEIGHTS[k]) { targetIndex = k; break; }
            randPick -= PRIZE_WEIGHTS[k];
        }

        // 计算最终旋转角：让指针（指向正上方，= 0° 位置）指向 targetIndex 的扇区中心
        // 第 i 个扇区中心角度 = i * 45°（conic-gradient from -22.5，中心 = -22.5 + 22.5 + i*45 = i*45）
        // 但 CSS conic-gradient 从 -22.5deg 开始，所以第 0 个扇区中心 = 0°，第 1 个 = 45° 等等
        // 指针在正上方（0°位置），所以需要让第 targetIndex 扇区中心旋转到 0°
        // 即：最终旋转 = - targetIndex * 45°，再加上若干圈
        const extraTurns = 6 + Math.floor(Math.random() * 3); // 6-8圈
        const targetCenterAngle = targetIndex * SEGMENT_ANGLE;
        // 为了让旋转看起来"先快后慢"，终点要在当前基础上再加很多圈
        // 让最终落在 -targetCenterAngle + 360 的倍数
        const currentMod = ((currentRotation % 360) + 360) % 360;
        const desiredFinalMod = (360 - targetCenterAngle) % 360;
        let delta = desiredFinalMod - currentMod;
        if (delta < 0) delta += 360;
        const totalRotate = extraTurns * 360 + delta;
        currentRotation += totalRotate;

        // 先快后慢的 cubic-bezier
        wheelEl.style.transition = 'transform 5.5s cubic-bezier(0.17, 0.67, 0.21, 1)';
        wheelEl.style.transform = `rotate(${currentRotation}deg)`;

        // 停止时高亮指针所指扇区，4 秒后弹窗
        setTimeout(() => {
            wheelEl.classList.add('highlight-win');

            setTimeout(() => {
                wheelEl.classList.remove('highlight-win');
                const prize = PRIZES[targetIndex];

                // 扣次数
                remaining--;
                remainingEl.textContent = remaining;

                if (prize.isWin) {
                    totalScore += prize.amount;
                    totalScoreEl.textContent = totalScore;
                    triggerWinEffect();
                    showWinModal(prize);
                } else {
                    showLoseModal(prize);
                }

                // 恢复按钮
                isSpinning = false;
                if (remaining > 0) {
                    spinBtn.disabled = false;
                    statusText.textContent = '🎯 再转一次试试手气';
                } else {
                    statusText.textContent = '🎯 今日已用完，明日再战';
                    spinBtn.disabled = true;
                    spinBtn.textContent = '✓';
                }
            }, 4000);
        }, 5500);
    });

    // ========== 弹窗 ==========
    function showWinModal(prize) {
        modalEmoji.textContent = prize.icon;
        modalTitleEl.textContent = '🎉 恭喜中奖';
        modalTitleEl.classList.remove('lose');
        modalDesc.textContent = prize.desc;
        modalPrize.textContent = prize.text;
        modalOverlay.classList.add('show');
    }

    function showLoseModal(prize) {
        modalEmoji.textContent = '🙏';
        modalTitleEl.textContent = '谢谢参与';
        modalTitleEl.classList.add('lose');
        modalDesc.textContent = prize.desc;
        modalPrize.textContent = '再接再厉';
        modalOverlay.classList.add('show');
    }

    modalCloseBtn.addEventListener('click', () => {
        modalOverlay.classList.remove('show');
    });
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
            modalOverlay.classList.remove('show');
        }
    });

    modalShareBtn.addEventListener('click', () => {
        const text = `我在【祈个福】华丽大转盘抽到了好奖，快来一起祈福吧~`;
        const url = window.location.origin + window.location.pathname;
        if (navigator.share) {
            navigator.share({ title: '祈个福', text: text, url: url }).catch(() => {});
        } else {
            const full = text + ' ' + url;
            navigator.clipboard.writeText(full).then(() => {
                showToast('✨ 分享内容已复制');
            }).catch(() => {
                alert('请复制分享：\n\n' + full);
            });
        }
        modalOverlay.classList.remove('show');
    });

    // ========== 中奖特效 ==========
    function triggerWinEffect() {
        // 金光爆发
        const glow = document.createElement('div');
        glow.className = 'win-glow';
        document.body.appendChild(glow);
        setTimeout(() => glow.remove(), 2200);

        // 五彩纸屑
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        document.body.appendChild(confetti);
        const confettiColors = ['#FFD700', '#FF6347', '#2979FF', '#9C27B0', '#FFA500', '#4CAF50', '#E91E63'];
        for (let i = 0; i < 40; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
            piece.style.animationDuration = (2.5 + Math.random() * 2) + 's';
            piece.style.animationDelay = (Math.random() * 0.5) + 's';
            const size = 6 + Math.random() * 8;
            piece.style.width = size + 'px';
            piece.style.height = (size * 1.4) + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '2px' : '50%';
            confetti.appendChild(piece);
        }
        setTimeout(() => confetti.remove(), 5000);
    }

    function showToast(msg) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }
    </script>
</body>
</html>
