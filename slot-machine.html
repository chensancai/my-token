<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>祈个福 · 福运老虎机</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        margin: 0;
        background: radial-gradient(ellipse at center, #1a0a2e 0%, #0d0015 100%);
        overflow-x: hidden;
        min-height: 100vh;
    }

    .light-rays {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 300vmax; height: 300vmax;
        background: conic-gradient(from 0deg, transparent, rgba(255,215,0,0.06), transparent, rgba(255,215,0,0.03), transparent);
        z-index: 0; pointer-events: none;
    }

    .sparkle-container {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1; pointer-events: none;
    }
    .sparkle {
        position: absolute; width: 3px; height: 3px;
        background: radial-gradient(circle, #FFD700, #FFA500);
        border-radius: 50%;
    }

    .container {
        position: relative; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        min-height: 100vh; padding: 20px;
    }

    .header { text-align: center; margin-bottom: 15px; position: relative; z-index: 2; }
    .source-tag {
        display: inline-block;
        background: linear-gradient(135deg, #FFD700, #FFA500);
        color: #1a0a2e;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 12px;
        box-shadow: 0 3px 15px rgba(255,165,0,0.4);
    }
    .title {
        font-size: 26px;
        color: #FFD700;
        text-shadow: 0 0 20px rgba(255,215,0,0.8), 0 0 40px rgba(255,215,0,0.4);
        margin: 0; letter-spacing: 3px; font-weight: bold;
    }

    .slot-machine {
        width: 320px;
        background: linear-gradient(180deg, #3d2a0f 0%, #2a1a08 50%, #3d2a0f 100%);
        border: 4px solid #D4AF37;
        border-radius: 20px;
        padding: 20px;
        position: relative; z-index: 2;
        box-shadow: 0 0 60px rgba(255,215,0,0.3), 0 20px 60px rgba(0,0,0,0.5), inset 0 0 30px rgba(255,215,0,0.1);
    }
    .slot-machine::before {
        content: '';
        position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
        border: 1px solid rgba(255,215,0,0.4);
        border-radius: 14px; pointer-events: none;
    }

    .reels-container {
        background: linear-gradient(180deg, #1a0a00 0%, #0d0500 100%);
        border: 3px solid #D4AF37;
        border-radius: 12px;
        padding: 15px; margin-bottom: 15px;
        position: relative;
    }

    .win-line {
        position: absolute; top: 50%; left: 0; right: 0;
        height: 80px; transform: translateY(-50%);
        border: 2px solid #FFD700;
        border-radius: 8px;
        background: rgba(255,215,0,0.1);
        box-shadow: 0 0 20px rgba(255,215,0,0.5);
        pointer-events: none; z-index: 5;
        opacity: 0;
    }
    .win-line.show { opacity: 1; animation: winLineFlash 0.6s ease-in-out infinite; }
    @keyframes winLineFlash {
        0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.5); }
        50% { box-shadow: 0 0 40px rgba(255,215,0,0.9); }
    }

    .reels {
        display: flex; gap: 8px; justify-content: center;
        height: 80px; position: relative; z-index: 2;
    }

    .reel {
        width: 80px; height: 80px;
        overflow: hidden;
        border: 2px solid #8B7355;
        border-radius: 8px;
        position: relative;
        background: #0d0500;
    }

    .reel-track {
        position: absolute;
        left: 0; top: 0; width: 100%;
        will-change: transform;
    }

    .symbol {
        width: 100%; height: 80px;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-size: 40px;
        color: #FFD700;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        text-align: center; line-height: 1;
    }
    .symbol.amount {
        background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,165,0,0.12));
        border: 2px solid rgba(255,215,0,0.5);
        border-radius: 6px;
        box-sizing: border-box;
    }
    .symbol.amount .amount-num {
        font-size: 24px; font-weight: bold;
        color: #FFD700;
        text-shadow: 0 0 8px rgba(255,215,0,0.8);
        display: block; margin-bottom: 2px;
        line-height: 1.1;
    }
    .symbol.amount .amount-unit {
        font-size: 14px; color: #FF6347; opacity: 0.95;
        font-weight: bold;
        line-height: 1.1;
    }

    .reel.winning {
        border-color: #FFD700 !important;
        box-shadow: 0 0 20px #FFD700, 0 0 40px rgba(255,215,0,0.5);
        animation: winPulse 0.5s ease-in-out infinite;
    }
    @keyframes winPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 20px #FFD700, 0 0 40px rgba(255,215,0,0.5); }
        50% { transform: scale(1.08); box-shadow: 0 0 30px #FFD700, 0 0 60px rgba(255,215,0,0.7); }
    }

    /* 灯光效果 */
    .lights-wrapper { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; }
    .light-string { display: flex; gap: 8px; }
    .light {
        width: 12px; height: 12px;
        border-radius: 50%;
        background: #333; transition: all 0.2s;
    }
    .slot-machine.lights-on .light {
        background: #FFD700 !important;
        box-shadow: 0 0 15px #FFD700, 0 0 30px #FFA500 !important;
        animation: blink 0.5s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    .control-area { display: flex; justify-content: center; }
    .spin-btn {
        background: linear-gradient(135deg, #FFD700, #FFA500);
        color: #1a0a2e; border: none;
        padding: 15px 50px; border-radius: 30px;
        font-size: 18px; font-weight: bold; cursor: pointer;
        box-shadow: 0 5px 25px rgba(255,165,0,0.5);
        transition: transform 0.2s, box-shadow 0.2s; letter-spacing: 3px;
    }
    .spin-btn:active { transform: scale(0.95); }
    .spin-btn:disabled {
        background: linear-gradient(135deg, #8B7355, #6B5344);
        cursor: not-allowed; box-shadow: none;
        color: #3a2818;
    }

    .remaining {
        color: rgba(255,215,0,0.8);
        font-size: 13px; margin-top: 15px;
        text-align: center; position: relative; z-index: 2;
    }
    .remaining strong { color: #FFD700; font-size: 18px; margin: 0 4px; }

    .modal-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.85);
        z-index: 1000;
        display: flex; align-items: center; justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }
    .modal-overlay.show {
        opacity: 1;
        pointer-events: all;
    }
    .modal {
        background: linear-gradient(160deg, #FFF8DC 0%, #F5DEB3 50%, #FFE4B5 100%);
        border: 4px solid #D4AF37;
        border-radius: 22px;
        padding: 30px 25px; text-align: center;
        max-width: 320px; width: 90%;
        transform: scale(0.7);
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
        box-shadow: 0 0 80px rgba(255,215,0,0.7);
        position: relative; overflow: visible;
    }
    .modal-overlay.show .modal { transform: scale(1); opacity: 1; }

    .modal-close {
        position: absolute; top: 10px; right: 12px;
        background: rgba(139,69,19,0.1);
        border: none; width: 32px; height: 32px;
        border-radius: 50%; font-size: 22px;
        color: #8B4513; cursor: pointer; line-height: 1;
        z-index: 10;
        transition: background 0.2s;
    }
    .modal-close:hover { background: rgba(139,69,19,0.2); }
    .modal-close:active { transform: scale(0.9); }

    .modal-emoji {
        font-size: 70px; margin-bottom: 10px;
        animation: bounce 1s ease-in-out infinite;
    }
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    .modal-title {
        font-size: 22px; color: #8B4513; font-weight: bold;
        margin-bottom: 10px; letter-spacing: 3px;
    }
    .modal-desc {
        font-size: 14px; color: #A0522D; margin-bottom: 15px;
        letter-spacing: 1px;
    }
    .modal-value {
        font-size: 22px; color: #FF6347; font-weight: bold;
        margin-bottom: 20px;
    }
    .modal-value .val-num {
        color: #FFD700; font-size: 44px;
        text-shadow: 0 0 15px rgba(255,215,0,0.7);
        margin: 0 4px;
    }
    .modal-share-btn {
        background: linear-gradient(135deg, #FFD700, #FFA500);
        color: #1a0a2e; border: none;
        padding: 14px 35px; border-radius: 28px;
        font-size: 16px; font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 20px rgba(255,165,0,0.6);
        transition: transform 0.2s; letter-spacing: 3px;
    }
    .modal-share-btn:active { transform: scale(0.95); }

    /* 爆炸光效 */
    .explosion-effect {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 10px; height: 10px;
        z-index: 999; pointer-events: none;
    }
    .explosion-particle {
        position: absolute; top: 50%; left: 50%;
        width: 10px; height: 10px;
        border-radius: 50%; transform: translate(-50%, -50%);
    }
    @keyframes particleFly {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
        100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
    }
    .burst-glow {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 20px; height: 20px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,215,0,1) 0%, rgba(255,165,0,0.5) 30%, transparent 70%);
        animation: burstGlow 1s ease-out forwards;
    }
    @keyframes burstGlow {
        0% { width: 20px; height: 20px; opacity: 1; }
        50% { width: 600px; height: 600px; opacity: 0.8; }
        100% { width: 800px; height: 800px; opacity: 0; }
    }
    .light-beam {
        position: absolute; top: 50%; left: 50%;
        width: 4px; height: 0;
        background: linear-gradient(to top, transparent, #FFD700, #FF6347, transparent);
        transform-origin: bottom center;
        transform: translate(-50%, -100%) rotate(var(--angle));
        animation: beamOut 1.2s ease-out forwards;
    }
    @keyframes beamOut {
        0% { height: 0; opacity: 0; }
        30% { opacity: 1; }
        100% { height: 500px; opacity: 0; }
    }
    .confetti-piece {
        position: absolute; top: 50%; left: 50%;
        width: 12px; height: 12px; border-radius: 2px;
    }
    @keyframes confettiFly {
        0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; }
        100% { transform: translate(calc(-50% + var(--cx)), calc(-50% + var(--cy))) rotate(720deg); opacity: 0; }
    }

    .floating-text {
        position: fixed; top: 40%; left: 50%;
        transform: translate(-50%, -50%);
        color: #FFD700; font-size: 24px; font-weight: bold;
        text-shadow: 0 0 20px rgba(255,215,0,0.8);
        z-index: 2000; pointer-events: none;
        animation: floatUp 2s ease-out forwards;
        letter-spacing: 2px; text-align: center;
    }
    @keyframes floatUp {
        0% { transform: translate(-50%, -30%); opacity: 1; }
        100% { transform: translate(-50%, -150%); opacity: 0; }
    }

    .no-win-toast {
        position: fixed; top: 30%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(139,90,43,0.85);
        color: #FFD700;
        padding: 12px 30px; border-radius: 30px;
        font-size: 15px; letter-spacing: 2px;
        z-index: 500; pointer-events: none;
        animation: toastFade 1.5s ease-out forwards;
        border: 1px solid rgba(255,215,0,0.4);
    }
    @keyframes toastFade {
        0% { opacity: 0; transform: translate(-50%, -30%) scale(0.8); }
        20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -70%) scale(0.9); }
    }
    </style>
</head>
<body>
    <div class="light-rays"></div>
    <div class="sparkle-container" id="sparkles"></div>

    <div class="container">
        <div class="header">
            <div class="source-tag">🎰 福运老虎机</div>
            <h1 class="title">福运老虎机</h1>
        </div>

        <div class="slot-machine" id="slotMachine">
            <div class="lights-wrapper">
                <div class="light-string">
                    <div class="light"></div><div class="light"></div>
                    <div class="light"></div><div class="light"></div>
                </div>
            </div>

            <div class="reels-container">
                <div class="win-line" id="winLine"></div>
                <div class="reels">
                    <div class="reel" id="reel1"><div class="reel-track" id="track1"></div></div>
                    <div class="reel" id="reel2"><div class="reel-track" id="track2"></div></div>
                    <div class="reel" id="reel3"><div class="reel-track" id="track3"></div></div>
                </div>
            </div>

            <div class="lights-wrapper">
                <div class="light-string">
                    <div class="light"></div><div class="light"></div>
                    <div class="light"></div><div class="light"></div>
                </div>
            </div>

            <div class="control-area">
                <button class="spin-btn" id="spinBtn">🎰 开始</button>
            </div>
        </div>

        <div class="remaining">剩余次数：<strong id="remainingCount">3</strong> 次</div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="modalClose">×</button>
            <div class="modal-emoji">🎉</div>
            <div class="modal-title">恭喜发财</div>
            <div class="modal-desc">福运连连</div>
            <div class="modal-value">+<span class="val-num" id="winAmount">20</span> 欢喜</div>
            <button class="modal-share-btn" id="modalShareBtn">分享奖励</button>
        </div>
    </div>

    <script>
    const ICONS = ['🎉', '🎁', '🙏', '✨', '🌟', '💫', '🎊', '🏆', '🕉️', '🎋'];
    const SYMBOL_HEIGHT = 80;
    const RANDOM_COUNT = 20;
    const BUFFER_MIN = 3;
    const BUFFER_MAX = 5;
    const TARGET_INDEX = RANDOM_COUNT;

    let AMOUNT_CONFIG = { left: 20, middle: 30, right: 50 };

    let remaining = 3;
    let isSpinning = false;
    let hasWon = false;
    let hasShownModal = false;
    let currentRound = 0;
    let wonAtRound = Math.floor(Math.random() * 3);
    let currentPrize = null;
    let audioCtx = null;

    // 初始化音频上下文
    function getAudioCtx() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
    }

    // 咔嚓金属滚轮停止声音（增强版：多层次金属撞击效果）
    function playClunkSound() {
        try {
            const ctx = getAudioCtx();
            const now = ctx.currentTime;

            // ===== 第一层：低频重击（滚轮轴撞击感）=====
            const thud = ctx.createOscillator();
            thud.type = 'triangle';
            thud.frequency.setValueAtTime(150, now);
            thud.frequency.exponentialRampToValueAtTime(25, now + 0.25);
            const thudGain = ctx.createGain();
            thudGain.gain.setValueAtTime(0.85, now);
            thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            thud.connect(thudGain);
            thudGain.connect(ctx.destination);
            thud.start(now);
            thud.stop(now + 0.35);

            // ===== 第二层：金属共振（滚轮齿卡位声）=====
            const metalOsc = ctx.createOscillator();
            metalOsc.type = 'sawtooth';
            metalOsc.frequency.setValueAtTime(800, now);
            metalOsc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
            const metalGain = ctx.createGain();
            metalGain.gain.setValueAtTime(0.4, now);
            metalGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            const metalFilter = ctx.createBiquadFilter();
            metalFilter.type = 'bandpass';
            metalFilter.frequency.value = 1200;
            metalFilter.Q.value = 3;
            metalOsc.connect(metalFilter);
            metalFilter.connect(metalGain);
            metalGain.connect(ctx.destination);
            metalOsc.start(now);
            metalOsc.stop(now + 0.18);

            // ===== 第三层：高频咔嚓（机械开关声）=====
            const click = ctx.createOscillator();
            click.type = 'square';
            click.frequency.setValueAtTime(2000, now);
            click.frequency.exponentialRampToValueAtTime(800, now + 0.02);
            const clickGain = ctx.createGain();
            clickGain.gain.setValueAtTime(0.35, now);
            clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            click.connect(clickGain);
            clickGain.connect(ctx.destination);
            click.start(now);
            click.stop(now + 0.06);

            // ===== 第四层：金属颤音（滚轮停止后的余震）=====
            const ringOsc = ctx.createOscillator();
            ringOsc.type = 'sine';
            ringOsc.frequency.setValueAtTime(1500, now + 0.03);
            ringOsc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
            const ringGain = ctx.createGain();
            ringGain.gain.setValueAtTime(0.15, now + 0.03);
            ringGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            ringOsc.connect(ringGain);
            ringGain.connect(ctx.destination);
            ringOsc.start(now + 0.03);
            ringOsc.stop(now + 0.22);

            // ===== 第五层：白噪声冲击（增加真实感）=====
            const noiseBufferSize = Math.floor(ctx.sampleRate * 0.08);
            const noiseBuffer = ctx.createBuffer(1, noiseBufferSize, ctx.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);
            for (let i = 0; i < noiseBufferSize; i++) {
                noiseData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (noiseBufferSize * 0.15));
            }
            const noise = ctx.createBufferSource();
            noise.buffer = noiseBuffer;
            const noiseFilter = ctx.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.value = 1500;
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.3, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(ctx.destination);
            noise.start(now);
            noise.stop(now + 0.1);
        } catch(e) {}
    }

    const slotMachine = document.getElementById('slotMachine');
    const spinBtn = document.getElementById('spinBtn');
    const remainingCount = document.getElementById('remainingCount');
    const reels = [
        document.getElementById('reel1'),
        document.getElementById('reel2'),
        document.getElementById('reel3')
    ];
    const tracks = [
        document.getElementById('track1'),
        document.getElementById('track2'),
        document.getElementById('track3')
    ];
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalShareBtn = document.getElementById('modalShareBtn');
    const winLine = document.getElementById('winLine');

    function buildTrack(trackEl, iconList, target) {
        let html = '';
        for (let i = 0; i < RANDOM_COUNT; i++) {
            const icon = iconList[Math.floor(Math.random() * iconList.length)];
            html += `<div class="symbol">${icon}</div>`;
        }
        if (target) {
            if (target.isAmount) {
                html += `<div class="symbol amount"><span class="amount-num">${target.value}</span><span class="amount-unit">欢喜</span></div>`;
            } else {
                html += `<div class="symbol">${target.value}</div>`;
            }
        } else {
            html += `<div class="symbol">${iconList[Math.floor(Math.random() * iconList.length)]}</div>`;
        }
        const bufferCount = BUFFER_MIN + Math.floor(Math.random() * (BUFFER_MAX - BUFFER_MIN + 1));
        for (let i = 0; i < bufferCount; i++) {
            const icon = iconList[Math.floor(Math.random() * iconList.length)];
            html += `<div class="symbol">${icon}</div>`;
        }
        trackEl.innerHTML = html;
        trackEl.style.transform = 'translateY(0)';
        trackEl.style.transition = 'none';
    }

    function initReels() {
        for (let i = 0; i < 3; i++) {
            buildTrack(tracks[i], ICONS, null);
        }
    }

    initReels();

    function spin() {
        if (isSpinning || remaining <= 0) return;

        // 初始化音频上下文（用户交互后才能使用）
        getAudioCtx();

        isSpinning = true;
        spinBtn.disabled = true;
        spinBtn.textContent = '🎰 转动中...';

        slotMachine.classList.add('lights-on');
        winLine.classList.remove('show');
        reels.forEach(r => r.classList.remove('winning'));

        // 决定本轮是否中奖（仅第一次中奖轮中奖）
        const isThisWin = (!hasWon && currentRound === wonAtRound);
        let winPosition = null;
        if (isThisWin) {
            const positions = [
                { name: 'left', index: 0, amount: AMOUNT_CONFIG.left },
                { name: 'middle', index: 1, amount: AMOUNT_CONFIG.middle },
                { name: 'right', index: 2, amount: AMOUNT_CONFIG.right }
            ];
            const rand = Math.random();
            if (rand < 0.6) winPosition = positions[0];
            else if (rand < 0.9) winPosition = positions[1];
            else winPosition = positions[2];
            currentPrize = { position: winPosition.name, amount: winPosition.amount, reelIndex: winPosition.index };
        }

        // 构建滚动轨道：大幅增加随机符号数量，让减速阶段有足够内容滚动
        // 增加到80个随机符号，确保飞快阶段有足够内容滚动
        function buildBigTrack(trackEl, iconList, target) {
            let html = '';
            const fastCount = 80; // 飞快阶段：80个符号
            for (let i = 0; i < fastCount; i++) {
                const icon = iconList[Math.floor(Math.random() * iconList.length)];
                html += `<div class="symbol">${icon}</div>`;
            }
            if (target) {
                if (target.isAmount) {
                    html += `<div class="symbol amount"><span class="amount-num">${target.value}</span><span class="amount-unit">欢喜</span></div>`;
                } else {
                    html += `<div class="symbol">${target.value}</div>`;
                }
            }
            const bufferCount = 8;
            for (let i = 0; i < bufferCount; i++) {
                const icon = iconList[Math.floor(Math.random() * iconList.length)];
                html += `<div class="symbol">${icon}</div>`;
            }
            trackEl.innerHTML = html;
            trackEl.style.transition = 'none';
            trackEl.style.transform = 'translateY(0)';
        }

        for (let i = 0; i < 3; i++) {
            if (isThisWin && winPosition && winPosition.index === i) {
                buildBigTrack(tracks[i], ICONS, { isAmount: true, value: winPosition.amount });
            } else {
                buildBigTrack(tracks[i], ICONS, { isAmount: false, value: ICONS[Math.floor(Math.random() * 10)] });
            }
        }

        // 三阶段减速：飞快滚动 → 逐步减速 → 平滑停止（不重复，一次过）
        // 每个reel的总时长稍有不同，让停止有层次感
        const reelDurations = [4800, 5600, 6400]; // reel0最快，reel2最慢

        function animateReel(reelIndex, finalTarget, totalDuration) {
            const track = tracks[reelIndex];
            
            // 四个阶段：飞快滚动 → 减速 → 微动 → 最终停止
            const fastDuration = Math.floor(totalDuration * 0.45);   // 飞快阶段 ~45%
            const slowDuration = Math.floor(totalDuration * 0.35);   // 减速阶段 ~35%
            const wobbleDuration = Math.floor(totalDuration * 0.12); // 微动阶段 ~12%
            const stopDuration = totalDuration - fastDuration - slowDuration - wobbleDuration; // 最终停止 ~8%

            // 计算各个阶段的位移
            const totalDistance = Math.abs(finalTarget);
            const fastDistance = totalDistance * 0.65;
            const slowDistance = totalDistance * 0.28;
            const wobbleOffset = SYMBOL_HEIGHT * (reelIndex === 1 ? 1 : 0); // 中间reel多微动一格
            
            // 阶段1：飞快滚动（极速，几乎无减速）
            track.style.transition = 'none';
            track.style.transform = 'translateY(0)';
            requestAnimationFrame(function() {
                track.style.transition = 'transform ' + fastDuration + 'ms cubic-bezier(0.1, 0.05, 0.15, 0.1)';
                track.style.transform = 'translateY(-' + fastDistance + 'px)';
            });

            // 阶段2：明显减速（速度明显变慢）
            setTimeout(function() {
                const slowTarget = -(fastDistance + slowDistance);
                track.style.transition = 'transform ' + slowDuration + 'ms cubic-bezier(0.35, 0.5, 0.5, 0.75)';
                track.style.transform = 'translateY(' + slowTarget + 'px)';
            }, fastDuration);

            // 阶段3：微动阶段（最后跳动一格或两格，制造紧张感）
            setTimeout(function() {
                const wobbleTarget = -(totalDistance - SYMBOL_HEIGHT + wobbleOffset);
                track.style.transition = 'transform ' + wobbleDuration + 'ms cubic-bezier(0.6, 0.1, 0.4, 0.95)';
                track.style.transform = 'translateY(' + wobbleTarget + 'px)';
            }, fastDuration + slowDuration);

            // 阶段4：最终定格（急刹停止）
            setTimeout(function() {
                track.style.transition = 'transform ' + stopDuration + 'ms cubic-bezier(0.15, 0.9, 0.4, 1)';
                track.style.transform = 'translateY(' + finalTarget + 'px)';
            }, fastDuration + slowDuration + wobbleDuration);
        }

        // 每个reel的最终目标位移（第80个符号=目标符号）
        const finalTargets = [
            -80 * SYMBOL_HEIGHT,
            -82 * SYMBOL_HEIGHT,
            -84 * SYMBOL_HEIGHT
        ];

        // 启动所有reel（REEL停止时间各不相同，营造层次感）
        // reel0最快停下，reel2最慢停下，每个间隔约800ms
        animateReel(0, finalTargets[0], reelDurations[0]);
        animateReel(1, finalTargets[1], reelDurations[1]);
        animateReel(2, finalTargets[2], reelDurations[2]);

        // 每个reel停止时播放咔嚓金属声
        reelDurations.forEach(function(dur, idx) {
            setTimeout(function() {
                playClunkSound();
                if (isThisWin && currentPrize && currentPrize.reelIndex === idx) {
                    reels[idx].classList.add('winning');
                }
            }, dur);
        });

        // 总时长：最后一个reel停止时间+额外处理时间
        const totalTime = reelDurations[2] + 200;

        setTimeout(() => {
            slotMachine.classList.remove('lights-on');
            remaining--;
            remainingCount.textContent = remaining;

            setTimeout(() => {
                currentRound++;
                isSpinning = false;

                if (isThisWin && !hasWon) {
                    hasWon = true;
                    winLine.classList.add('show');
                    triggerExplosionEffect();

                    if (window.PrayApp) {
                        window.PrayApp.addHuaxi(currentPrize.amount);
                    }

                    // 停2秒再弹窗
                    setTimeout(() => {
                        if (!hasShownModal) {
                            hasShownModal = true;
                            showWinModal();
                        }
                    }, 2000);
                } else {
                    if (remaining <= 0) {
                        spinBtn.disabled = true;
                        spinBtn.textContent = '🎰 已用完';
                        if (!hasWon) {
                            setTimeout(() => showToast('🙏 福运未到，下次再来'), 300);
                        }
                    } else {
                        spinBtn.disabled = false;
                        spinBtn.textContent = hasWon ? '🎰 再抽' : '🎰 再抽';
                    }
                    if (!hasWon) showNoWinToast();
                }
            }, 400);
        }, totalTime);
    }

    function showNoWinToast() {
        const toast = document.createElement('div');
        toast.className = 'no-win-toast';
        toast.textContent = '🙏 福运未到，再试试吧';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1500);
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'no-win-toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function triggerExplosionEffect() {
        const effect = document.createElement('div');
        effect.className = 'explosion-effect';
        document.body.appendChild(effect);

        const burst = document.createElement('div');
        burst.className = 'burst-glow';
        effect.appendChild(burst);

        const beamColors = ['#FFD700', '#FF6347', '#FFA500', '#FFE4B5', '#FFEBCD', '#F0E68C',
                            '#FF4500', '#DAA520', '#FFD700', '#FF6347', '#FFA500', '#FFE4B5'];
        for (let i = 0; i < 12; i++) {
            const beam = document.createElement('div');
            beam.className = 'light-beam';
            beam.style.setProperty('--angle', (i * 30) + 'deg');
            beam.style.background = `linear-gradient(to top, transparent, ${beamColors[i]}, transparent)`;
            beam.style.animationDelay = (i * 0.02) + 's';
            effect.appendChild(beam);
        }

        const particleColors = ['#FFD700', '#FF6347', '#FFA500', '#FF4500', '#DAA520', '#F0E68C'];
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'explosion-particle';
            const angle = (i / 40) * Math.PI * 2;
            const dist = 100 + Math.random() * 200;
            p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
            p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
            p.style.background = `radial-gradient(circle, ${particleColors[i % particleColors.length]}, transparent)`;
            p.style.animation = `particleFly ${0.8 + Math.random() * 0.6}s ease-out forwards`;
            p.style.animationDelay = (Math.random() * 0.2) + 's';
            p.style.width = (6 + Math.random() * 10) + 'px';
            p.style.height = p.style.width;
            effect.appendChild(p);
        }

        const confettiColors = ['#FFD700', '#FF6347', '#FFA500', '#FFE4B5', '#8B4513', '#FF4500'];
        for (let i = 0; i < 25; i++) {
            const c = document.createElement('div');
            c.className = 'confetti-piece';
            const angle = Math.random() * Math.PI * 2;
            const dist = 80 + Math.random() * 250;
            c.style.setProperty('--cx', Math.cos(angle) * dist + 'px');
            c.style.setProperty('--cy', Math.sin(angle) * dist + 'px');
            c.style.background = confettiColors[i % confettiColors.length];
            c.style.animation = `confettiFly ${1 + Math.random()}s ease-out forwards`;
            c.style.animationDelay = (Math.random() * 0.3) + 's';
            c.style.width = (6 + Math.random() * 8) + 'px';
            c.style.height = c.style.width;
            c.style.borderRadius = (Math.random() > 0.5 ? '2px' : '50%');
            effect.appendChild(c);
        }

        setTimeout(() => {
            const floatText = document.createElement('div');
            floatText.className = 'floating-text';
            floatText.innerHTML = `恭喜获得<br>${currentPrize.amount} 欢喜！`;
            document.body.appendChild(floatText);
            setTimeout(() => floatText.remove(), 2500);
        }, 400);

        setTimeout(() => effect.remove(), 3000);
    }

    function showWinModal() {
        document.getElementById('winAmount').textContent = currentPrize.amount;
        modalOverlay.classList.add('show');
    }

    function closeModal() {
        modalOverlay.classList.remove('show');
    }

    function shareReward() {
        const shareText = `我在【祈个福】老虎机抽到了 ${currentPrize.amount} 欢喜，快来一起祈福吧~`;
        const shareUrl = window.location.origin + window.location.pathname;
        if (navigator.share) {
            navigator.share({ title: '祈个福', text: shareText, url: shareUrl }).catch(() => {});
        } else {
            const fullText = shareText + ' ' + shareUrl;
            navigator.clipboard.writeText(fullText).then(() => {
                const toast = document.createElement('div');
                toast.className = 'no-win-toast';
                toast.textContent = '✨ 分享内容已复制';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 1500);
            }).catch(() => alert('请复制：' + fullText));
        }
    }

    spinBtn.addEventListener('click', spin);
    modalClose.addEventListener('click', closeModal);
    modalShareBtn.addEventListener('click', shareReward);
    modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) closeModal();
    });

    const sparklesContainer = document.getElementById('sparkles');
    for (let i = 0; i < 30; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.opacity = (0.4 + Math.random() * 0.4);
        sparklesContainer.appendChild(s);
    }
    </script>
</body>
