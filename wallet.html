<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>祈个福 · 钱包</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-warm: #F5E6D3;
            --primary: #8B5A2B;
            --primary-light: #A67B4B;
            --accent: #C04040;
            --text-dark: #4A3728;
            --text-light: #8B7355;
            --card-bg: #FDF8F3;
            --border: rgba(184, 134, 11, 0.3);
        }
        body { font-family: 'Noto Serif SC', serif; background: var(--bg-warm); min-height: 100vh; }
        
        /* 顶部导航 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .back-btn {
            width: 36px;
            height: 36px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border: 1.5px solid var(--border);
            box-shadow: 0 2px 10px rgba(184,134,11,0.18);
            color: var(--primary);
        }
        .header-title {
            flex: 1;
            text-align: center;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
            color: var(--primary);
            letter-spacing: 4px;
            margin-right: 36px;
        }
        
        /* 内容区域 */
        .content {
            padding: 70px 16px 30px;
            max-width: 430px;
            margin: 0 auto;
        }
        
        /* 余额卡片 */
        .balance-card {
            background: linear-gradient(135deg, #A67B4B 0%, #B8860B 50%, #8B6914 100%);
            border-radius: 20px;
            padding: 30px 24px;
            color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(139,90,43,0.3);
        }
        .balance-card::before {
            content: "";
            position: absolute;
            top: -50%;
            right: -30%;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .balance-card::after {
            content: "";
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 150px;
            height: 150px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }
        .balance-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .balance-value {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .balance-value span {
            font-size: 20px;
        }
        .balance-btns {
            display: flex;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .balance-btn {
            flex: 1;
            height: 44px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 22px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        .balance-btn.primary {
            background: #fff;
            color: var(--primary);
        }
        
        /* 充值套餐 */
        .recharge-section {
            margin-top: 24px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 16px;
            padding-left: 4px;
        }
        .recharge-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .recharge-item {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
        }
        .recharge-item:active {
            transform: scale(0.98);
        }
        .recharge-item.selected {
            border-color: var(--primary);
            background: rgba(139, 90, 43, 0.05);
        }
        .recharge-amount {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .recharge-amount span {
            font-size: 14px;
        }
        .recharge-bonus {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 6px;
        }
        .recharge-price {
            font-size: 14px;
            color: var(--text-light);
        }
        .recharge-price strong {
            font-size: 18px;
            color: var(--text-dark);
        }
        
        /* 支付方式 */
        .pay-section {
            margin-top: 24px;
        }
        .pay-methods {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
        }
        .pay-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        .pay-item:last-child {
            border-bottom: none;
        }
        .pay-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 12px;
        }
        .pay-icon.wechat { background: #E8F5E9; }
        .pay-icon.alipay { background: #E3F2FD; }
        .pay-icon.bank { background: #FFF3E0; }
        .pay-text {
            flex: 1;
            font-size: 14px;
            color: var(--text-dark);
        }
        .pay-radio {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pay-radio.selected {
            border-color: var(--primary);
            background: var(--primary);
        }
        .pay-radio.selected::after {
            content: "";
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
        }
        
        /* 充值按钮 */
        .recharge-submit {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #A67B4B 0%, #B8860B 50%, #6B4423 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            letter-spacing: 2px;
            box-shadow: 0 4px 16px rgba(139,90,43,0.3);
        }
        
        /* 记录入口 */
        .record-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            padding: 12px;
            color: var(--text-light);
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header">
        <a href="profile.html" class="back-btn">←</a>
        <div class="header-title">我的钱包</div>
    </div>
    
    <!-- 内容区域 -->
    <div class="content">
        <!-- 余额卡片 -->
        <div class="balance-card">
            <div class="balance-label">账户余额</div>
            <div class="balance-value"><span>¥</span>288.88</div>
            <div class="balance-btns">
                <button class="balance-btn">提现</button>
                <button class="balance-btn primary">充值</button>
            </div>
        </div>
        
        <!-- 充值套餐 -->
        <div class="recharge-section">
            <div class="section-title">选择充值金额</div>
            <div class="recharge-grid">
                <div class="recharge-item selected" onclick="selectRecharge(this, 6)">
                    <div class="recharge-amount">60<span>+6</span></div>
                    <div class="recharge-bonus">赠送60欢喜</div>
                    <div class="recharge-price"><strong>¥6</strong></div>
                </div>
                <div class="recharge-item" onclick="selectRecharge(this, 30)">
                    <div class="recharge-amount">300<span>+30</span></div>
                    <div class="recharge-bonus">赠送300欢喜</div>
                    <div class="recharge-price"><strong>¥30</strong></div>
                </div>
                <div class="recharge-item" onclick="selectRecharge(this, 68)">
                    <div class="recharge-amount">680<span>+68</span></div>
                    <div class="recharge-bonus">赠送680欢喜</div>
                    <div class="recharge-price"><strong>¥68</strong></div>
                </div>
                <div class="recharge-item" onclick="selectRecharge(this, 128)">
                    <div class="recharge-amount">1280<span>+128</span></div>
                    <div class="recharge-bonus">赠送1280欢喜</div>
                    <div class="recharge-price"><strong>¥128</strong></div>
                </div>
            </div>
        </div>
        
        <!-- 支付方式 -->
        <div class="pay-section">
            <div class="section-title">选择支付方式</div>
            <div class="pay-methods">
                <div class="pay-item" onclick="selectPay(this)">
                    <div class="pay-icon wechat">💚</div>
                    <div class="pay-text">微信支付</div>
                    <div class="pay-radio selected"></div>
                </div>
                <div class="pay-item" onclick="selectPay(this)">
                    <div class="pay-icon alipay">💙</div>
                    <div class="pay-text">支付宝</div>
                    <div class="pay-radio"></div>
                </div>
                <div class="pay-item" onclick="selectPay(this)">
                    <div class="pay-icon bank">💳</div>
                    <div class="pay-text">银行卡</div>
                    <div class="pay-radio"></div>
                </div>
            </div>
        </div>
        
        <!-- 充值按钮 -->
        <button class="recharge-submit" onclick="doRecharge()">立即充值</button>
        
        <!-- 充值记录 -->
        <div class="record-link">
            <span>📜</span>
            <span>查看充值记录</span>
            <span>›</span>
        </div>
    </div>
    
    <script>
        var selectedAmount = 6;
        
        function selectRecharge(el, amount) {
            document.querySelectorAll('.recharge-item').forEach(function(item) {
                item.classList.remove('selected');
            });
            el.classList.add('selected');
            selectedAmount = amount;
        }
        
        function selectPay(el) {
            var radios = el.parentElement.querySelectorAll('.pay-radio');
            radios.forEach(function(r) {
                r.classList.remove('selected');
            });
            el.querySelector('.pay-radio').classList.add('selected');
        }
        
        function doRecharge() {
            alert('即将跳转到支付页面，充值 ¥' + selectedAmount);
        }
    </script>
</body>
</html>
