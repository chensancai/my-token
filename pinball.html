<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>星 际 弹 珠</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    background: radial-gradient(ellipse at center, #3a2614 0%, #1a1008 100%);
    color: #fff6d8;
  }

  /* ===== 顶部聚光灯环境光晕 ===== */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 50% 12%, rgba(255, 210, 120, 0.35) 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(255, 180, 80, 0.25) 0%, transparent 55%);
    pointer-events: none; z-index: 0;
  }

  /* ===== 最外层容器 ===== */
  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 10px 16px;
  }

  /* ===== 顶部标题 ===== */
  .header {
    width: 100%;
    text-align: center;
    padding: 6px 0 10px;
    position: relative;
  }
  .title {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 10px;
    color: #ffe08a;
    text-shadow:
      0 0 6px #ffbe55,
      0 0 18px #ff9a3c,
      0 0 32px rgba(255, 160, 60, 0.7),
      2px 3px 0 #5a2e0a;
    padding-left: 10px;
  }
  .subtitle {
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 4px;
    color: #ffecc1;
    opacity: 0.85;
  }
  .cost-tag {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    background: rgba(90, 45, 10, 0.55);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 200, 120, 0.5);
    color: #ffd98a;
    letter-spacing: 1px;
  }

  /* ===== 小木偶吉祥物 ===== */
  .puppet {
    position: absolute;
    top: 4px; left: 6px;
    width: 56px; height: 56px;
    z-index: 20;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .puppet .body {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3c2, #d9a05b 65%, #7a4820 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 -4px 6px rgba(0,0,0,0.25);
    position: relative;
    border: 2px solid #5a2e0a;
  }
  .puppet .eye, .puppet .cover {
    position: absolute;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #3a1c05;
    top: 20px;
  }
  .puppet .eye.l { left: 14px; }
  .puppet .eye.r { right: 14px; }
  .puppet .mouth {
    position: absolute;
    bottom: 12px; left: 50%; transform: translateX(-50%);
    width: 14px; height: 7px;
    border-radius: 0 0 14px 14px / 0 0 7px 7px;
    background: #5a1a0a;
    border: 1px solid #3a0d05;
  }
  .puppet.peek .body { animation: peekShake 0.6s ease-in-out infinite alternate; }
  .puppet.peek .eye { background: transparent; }
  .puppet.peek .cover {
    width: 22px; height: 14px;
    background: linear-gradient(to bottom, #e8b878, #8a4a1a);
    border: 1px solid #3a1c05;
    top: 18px; border-radius: 4px;
  }
  .puppet.peek .cover.l { left: 6px;  transform: rotate(-10deg); }
  .puppet.peek .cover.r { right: 6px; transform: rotate(10deg); }
  @keyframes peekShake {
    from { transform: translateY(0) rotate(-2deg); }
    to   { transform: translateY(-2px) rotate(2deg); }
  }

  /* ===== 顶部中奖横幅 ===== */
  .result-banner {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translate(-50%, -120%) scale(0.8);
    background: linear-gradient(135deg, #ffecb0 0%, #ffb23c 50%, #ff6a1c 100%);
    color: #4a1a00;
    padding: 10px 22px;
    border-radius: 28px;
    border: 3px solid #5a2e0a;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    box-shadow:
      0 0 0 3px rgba(255,220,120,0.5),
      0 0 22px rgba(255, 170, 60, 0.85),
      0 6px 12px rgba(0,0,0,0.45),
      inset 0 2px 6px rgba(255,255,255,0.5);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    z-index: 35;
    transition: transform 0.45s cubic-bezier(0.17,0.88,0.32,1.35), opacity 0.35s;
  }
  .result-banner.show {
    transform: translate(-50%, 0) scale(1);
    opacity: 1;
    animation: bannerBounce 1.1s ease-in-out infinite;
  }
  @keyframes bannerBounce {
    0%, 100% { transform: translate(-50%, 0) scale(1); }
    50%      { transform: translate(-50%, -4px) scale(1.05); }
  }

/* ===== 中部钉板主体 ===== */
  .stage {
    position: relative;
    width: 100%;
    flex: 1;
    max-width: 440px;
    min-height: 0;
    margin-top: 4px;
    border-radius: 22px;
    background:
      repeating-linear-gradient(92deg, rgba(90,50,20,0.04) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(8deg,  rgba(120,70,30,0.04) 0 2px, transparent 2px 11px),
      linear-gradient(135deg, #e9c892 0%, #d6a96a 45%, #b9884e 100%);
    box-shadow:
      inset 0 0 0 5px #6b3a14,
      inset 0 0 0 8px #3a1c05,
      inset 0 12px 28px rgba(255, 220, 150, 0.35),
      inset 0 -10px 24px rgba(40, 20, 5, 0.45),
      0 14px 28px rgba(0,0,0,0.55);
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* 顶部弧形喇叭口 */
  .hopper {
    position: relative;
    height: 70px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .hopper::before {
    content: "";
    position: absolute;
    top: -30px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 160px;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(255, 220, 120, 0.55), rgba(255, 210, 120, 0) 65%),
      radial-gradient(ellipse at 50% 100%, #fff3c2, #b9884e 70%, #7a4820 100%);
    border-bottom-left-radius: 120px 80px;
    border-bottom-right-radius: 120px 80px;
    box-shadow:
      inset 0 -8px 16px rgba(255, 210, 120, 0.7),
      inset 0 10px 20px rgba(0,0,0,0.35),
      0 0 24px rgba(255, 200, 100, 0.55);
  }
  .hopper-mouth {
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 90px; height: 22px;
    background: radial-gradient(ellipse at 50% 0%, #fff6c8, #7a4820 80%);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4) inset, 0 0 14px rgba(255,210,120,0.7);
  }
  .hopper-mouth::after {
    content: "▼";
    position: absolute;
    left: 50%; top: 4px;
    transform: translateX(-50%);
    color: #ffcf6a;
    font-size: 12px;
    text-shadow: 0 0 6px #ff9a3c;
    animation: downArrow 1.2s ease-in-out infinite;
  }
  @keyframes downArrow {
    0%, 100% { transform: translate(-50%, 0); opacity: 0.7; }
    50%      { transform: translate(-50%, 4px); opacity: 1; }
  }

  /* 钉板区域 */
  .peg-board {
    position: relative;
    flex: 1;
    margin: 6px 16px 0;
    border-top: 2px dashed rgba(90, 50, 20, 0.35);
  }

  .peg {
    position: absolute;
    width: 20px; height: 20px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow:
      inset -3px -3px 5px rgba(0,0,0,0.45),
      inset 3px 3px 5px rgba(255,255,255,0.6),
      0 2px 4px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.35);
    pointer-events: none;
  }
  .peg::after {
    content: "";
    position: absolute;
    top: 4px; left: 5px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    filter: blur(0.5px);
  }

  /* 彩虹渐变颜色 — 6 种 */
  .peg.c1 { background: radial-gradient(circle at 30% 30%, #ffd5d5, #ff4d4d 55%, #9a1515 100%); }
  .peg.c2 { background: radial-gradient(circle at 30% 30%, #ffe9bf, #ff9a3c 55%, #a55310 100%); }
  .peg.c3 { background: radial-gradient(circle at 30% 30%, #fff8c8, #ffd93c 55%, #9a7e10 100%); }
  .peg.c4 { background: radial-gradient(circle at 30% 30%, #d8ffcc, #49c14e 55%, #176a1f 100%); }
  .peg.c5 { background: radial-gradient(circle at 30% 30%, #c8e3ff, #3c8dff 55%, #103a8a 100%); }
  .peg.c6 { background: radial-gradient(circle at 30% 30%, #e3caff, #a75aff 55%, #4a1a8a 100%); }

  /* 左右墙壁 */
  .wall {
    position: absolute; top: 0; bottom: 0;
    width: 10px;
    background: linear-gradient(to bottom, #6b3a14, #3a1c05);
    box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
    border-radius: 6px;
  }
  .wall.l { left: -16px; }
  .wall.r { right: -16px; }

  /* ===== 奖品槽 ===== */
  .prize-row {
    position: relative;
    height: 110px;
    padding: 0 8px 10px;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    gap: 2px;
  }
  .prize {
    flex: 1;
    height: 80px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .prize .label {
    position: absolute;
    top: -4px; left: 50%; transform: translateX(-50%);
    font-size: 11px;
    color: #4a2a0a;
    font-weight: 700;
    background: rgba(255, 235, 180, 0.9);
    padding: 2px 6px;
    border-radius: 8px;
    border: 1px solid rgba(90, 50, 20, 0.35);
    white-space: nowrap;
    letter-spacing: 1px;
  }
  .prize .slot {
    width: 100%;
    height: 60px;
    border-radius: 40px 40px 8px 8px / 55px 55px 8px 8px;
    box-shadow:
      inset 0 6px 14px rgba(0,0,0,0.45),
      inset 0 -4px 10px rgba(255,255,255,0.2),
      0 3px 6px rgba(0,0,0,0.35);
    border: 2px solid #5a2e0a;
    position: relative;
    overflow: hidden;
  }
  /* 槽颜色渐变：浅蓝 -> 耀眼玫瑰金 */
  .prize.p0 .slot { background: linear-gradient(to bottom, #a9d8ff, #4b98d4); }
  .prize.p1 .slot { background: linear-gradient(to bottom, #bfe2ff, #5aa0d8); }
  .prize.p2 .slot { background: linear-gradient(to bottom, #cfe9ff, #7ab4e0); }
  .prize.p3 .slot { background: linear-gradient(to bottom, #e7d7ff, #b894e0); }
  .prize.p4 .slot { background: linear-gradient(to bottom, #ffd4e8, #e278a6); }
  .prize.p5 .slot { background: linear-gradient(to bottom, #ffc9b5, #e0804a); }
  .prize.p6 .slot { background: linear-gradient(to bottom, #ffb890, #d86428); }
  .prize.p7 .slot { background: linear-gradient(to bottom, #ffd08a, #ffc47a); }
  .prize.p8 .slot {
    background:
      radial-gradient(circle at 50% 30%, #fff4cf 0%, #ffd99a 35%, #ff9a5a 70%, #c06a2a 100%);
    box-shadow:
      inset 0 6px 14px rgba(120,60,0,0.45),
      inset 0 -4px 10px rgba(255,240,180,0.5),
      0 0 18px rgba(255, 190, 100, 0.8),
      0 3px 6px rgba(0,0,0,0.35);
  }

  /* 中奖点亮效果 */
  .prize.win .slot {
    animation: winPulse 0.8s ease-in-out 3;
    box-shadow:
      inset 0 6px 14px rgba(120,60,0,0.4),
      inset 0 -4px 10px rgba(255,240,180,0.6),
      0 0 28px rgba(255, 220, 120, 1),
      0 0 56px rgba(255, 180, 80, 0.7);
  }
  .prize.win .slot::after {
    content: "";
    position: absolute; inset: -6px;
    border-radius: inherit;
    background: radial-gradient(circle, rgba(255,230,150,0.5), transparent 70%);
    animation: spotLight 0.8s ease-in-out 3;
    pointer-events: none;
  }
  @keyframes winPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }
  @keyframes spotLight {
    0%, 100% { opacity: 0; }
    50%      { opacity: 1; }
  }

  /* ===== 弹珠 ===== */
  .ball {
    position: absolute;
    width: 26px; height: 26px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 28%, #fff5f5 0%, #ff6b6b 40%, #c91818 75%, #7a0808 100%);
    box-shadow:
      inset -4px -4px 6px rgba(80,0,0,0.4),
      inset 3px 3px 6px rgba(255,255,255,0.65),
      0 0 14px rgba(255, 120, 80, 0.75),
      0 4px 10px rgba(0,0,0,0.55);
    pointer-events: none;
    z-index: 30;
    display: none;
    will-change: transform, left, top;
    animation: ballGlow 1.2s ease-in-out infinite alternate;
  }
  @keyframes ballGlow {
    from { box-shadow: inset -4px -4px 6px rgba(80,0,0,0.4), inset 3px 3px 6px rgba(255,255,255,0.65), 0 0 10px rgba(255, 120, 80, 0.6),  0 4px 8px rgba(0,0,0,0.4); }
    to   { box-shadow: inset -4px -4px 6px rgba(80,0,0,0.4), inset 3px 3px 6px rgba(255,255,255,0.65), 0 0 22px rgba(255, 180, 60, 0.95), 0 4px 12px rgba(0,0,0,0.5); }
  }
  .ball::after {
    content: "";
    position: absolute;
    top: 5px; left: 6px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    filter: blur(0.5px);
  }

  /* 星尘粒子 */
  .stardust {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 25;
  }

  /* ===== 发射按钮区（放在钉板下方） ===== */
  .launcher {
    width: 100%;
    max-width: 440px;
    margin: 14px auto 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 15;
  }

  /* 蓄力条 */
  .power-wrap {
    width: 44px;
    height: 110px;
    background: linear-gradient(to bottom, #3a1c05, #6b3a14);
    border-radius: 24px;
    padding: 6px;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.6),
      0 4px 10px rgba(0,0,0,0.45);
    position: relative;
    border: 3px solid #3a1c05;
  }
  .power-bar {
    position: absolute;
    left: 5px; right: 5px; bottom: 5px;
    height: 0%;
    border-radius: 0 0 10px 10px;
    background: linear-gradient(to top, #49c14e 0%, #ffd93c 50%, #ff4d4d 100%);
    box-shadow: inset 0 0 8px rgba(255,255,255,0.35);
    transition: height 0.08s linear, background 0.2s linear;
  }
  .power-wrap::before, .power-wrap::after {
    content: "";
    position: absolute;
    right: -12px;
    width: 6px; height: 2px;
    background: #ffe2a2;
    opacity: 0.6;
  }
  .power-wrap::before { top: 20%; }
  .power-wrap::after  { top: 60%; }

  /* 蓄力箭头提示 */
  .hint-text {
    position: absolute;
    left: 120%;
    transform: translateY(-50%);
    top: 50%;
    font-size: 11px;
    color: #fff3c2;
    background: rgba(90, 40, 10, 0.85);
    padding: 4px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,200,120,0.6);
    white-space: nowrap;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .hint-text.show { opacity: 1; animation: hintBlink 0.8s ease-in-out infinite; }
  @keyframes hintBlink {
    0%, 100% { transform: translateY(-50%); }
    50%      { transform: translateY(calc(-50% - 3px)); }
  }

  /* 圆形发射按钮 */
  .btn-launch {
    position: relative;
    width: 130px; height: 130px;
    border-radius: 50%;
    border: 5px solid #3a1c05;
    background: radial-gradient(circle at 35% 30%, #ffb770, #c46a1e 55%, #6b3414 100%);
    color: #fff6d8;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow:
      inset 0 4px 8px rgba(255, 220, 150, 0.5),
      inset 0 -6px 14px rgba(0,0,0,0.45),
      0 10px 18px rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    touch-action: manipulation;
  }
  .btn-launch:active,
  .btn-launch.pressing {
    transform: translateY(4px) scale(0.96);
    box-shadow:
      inset 0 6px 12px rgba(0,0,0,0.55),
      0 2px 4px rgba(0,0,0,0.4);
  }
  .btn-launch.charging { animation: btnPulse 0.6s ease-in-out infinite; }
  .btn-launch.high     { animation: btnPulseFast 0.3s ease-in-out infinite; }
  @keyframes btnPulse     { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes btnPulseFast { 0%, 100% { transform: scale(1.04); box-shadow: 0 0 26px rgba(255,80,80,0.9), inset 0 6px 12px rgba(0,0,0,0.55);}
                           50%      { transform: scale(1.14); box-shadow: 0 0 44px rgba(255,180,60,1),  inset 0 6px 12px rgba(0,0,0,0.55);} }

  /* 旋转光环 */
  .halo {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    pointer-events: none;
    overflow: hidden;
  }
  .halo .particle {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff4c2, rgba(255, 200, 100, 0));
    opacity: 0.8;
    top: 50%; left: 50%;
    transform-origin: 0 0;
    animation: haloSpin 4s linear infinite;
  }
  @keyframes haloSpin {
    from { transform: rotate(0deg) translate(60px) rotate(0deg); }
    to   { transform: rotate(360deg) translate(60px) rotate(-360deg); }
  }
  .btn-launch.charging .halo .particle { background: radial-gradient(circle, #c8ffcc, rgba(73,193,78,0)); }
  .btn-launch.mid      .halo .particle { background: radial-gradient(circle, #fff4c2, rgba(255, 200, 100, 0)); }
  .btn-launch.high     .halo .particle { background: radial-gradient(circle, #ffd5d5, rgba(255, 80, 80, 0)); animation-duration: 1.5s; }

  .btn-launch.cooling {
    background: radial-gradient(circle at 35% 30%, #a07a5a, #5a4030 55%, #2a1a0a 100%);
    color: #c9a988;
    cursor: not-allowed;
    filter: grayscale(0.6);
  }
  .cooldown-ring {
    position: absolute; inset: 8px;
    border-radius: 50%;
    border: 3px solid rgba(255, 220, 150, 0.8);
    border-top-color: transparent;
    border-right-color: transparent;
    animation: cooldownSpin 3s linear forwards;
    display: none;
  }
  .cooldown-ring.on { display: block; }
  @keyframes cooldownSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(1080deg); }
  }
  .cooldown-text {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900;
    color: #ffd98a;
    text-shadow: 0 2px 4px #3a1c05;
  }
  .cooldown-text.on { display: flex; }

  /* ===== 分数飘字 ===== */
  .float-score {
    position: absolute;
    font-size: 26px;
    font-weight: 900;
    color: #ffe29a;
    text-shadow: 0 0 10px #ff8a2a, 0 2px 4px #3a1c05;
    pointer-events: none;
    z-index: 50;
    animation: floatUp 1.4s ease-out forwards;
    letter-spacing: 2px;
  }
  @keyframes floatUp {
    0%   { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
    20%  { transform: translate(-50%, -10px) scale(1.4); opacity: 1; }
    100% { transform: translate(-50%, -140px) scale(1); opacity: 0; }
  }

  /* ===== 首次引导 ===== */
  .guide {
    position: fixed;
    inset: 0;
    background: rgba(20, 10, 0, 0.65);
    z-index: 99;
    display: flex;
    align-items: center; justify-content: center;
    color: #fff6d8;
    font-size: 14px;
    text-align: center;
    padding: 24px;
  }
  .guide .card {
    background: linear-gradient(135deg, #e9c892, #b9884e);
    padding: 18px 22px;
    border-radius: 16px;
    border: 3px solid #5a2e0a;
    max-width: 320px;
    line-height: 1.8;
    color: #3a1c05;
    font-weight: 600;
    box-shadow: 0 12px 24px rgba(0,0,0,0.5);
  }
  .guide .card .emoji { font-size: 34px; display: block; margin-bottom: 6px; }
  .guide .card .ok {
    margin-top: 12px;
    padding: 8px 22px;
    background: #ff9a3c;
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.35);
  }

  /* ===== modal 弹窗 ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 10, 0, 0.7);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    animation: fadeIn 0.25s ease;
  }
  .modal-overlay.on { display: flex; }
  @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

  .modal {
    width: 82%;
    max-width: 340px;
    background: linear-gradient(135deg, #fff3d2, #ffc978);
    border-radius: 22px;
    border: 5px solid #5a2e0a;
    padding: 22px 18px 18px;
    text-align: center;
    color: #3a1c05;
    box-shadow: 0 14px 32px rgba(0,0,0,0.6);
    animation: popIn 0.35s cubic-bezier(0.17, 0.88, 0.32, 1.28);
    position: relative;
  }
  @keyframes popIn {
    0%   { transform: scale(0.3) rotate(-10deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .modal .big {
    font-size: 30px;
    font-weight: 900;
    color: #b8441a;
    text-shadow: 2px 2px 0 #fff3d2;
    letter-spacing: 4px;
    margin: 6px 0;
  }
  .modal .desc {
    font-size: 14px;
    color: #5a2e0a;
    line-height: 1.6;
    margin: 12px 0 16px;
  }
  .modal .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .modal button {
    padding: 10px 22px;
    border: 2px solid #5a2e0a;
    background: linear-gradient(to bottom, #ffcf6a, #ff9a3c);
    color: #3a1c05;
    font-weight: 900;
    border-radius: 20px;
    font-size: 14px;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 4px 0 #5a2e0a, 0 6px 12px rgba(0,0,0,0.3);
  }
  .modal button.ghost {
    background: linear-gradient(to bottom, #fff3d2, #e0c79a);
  }
  .modal .trophy {
    font-size: 50px;
    display: block;
    margin-bottom: 4px;
    animation: trophyBob 1s ease-in-out infinite alternate;
  }
  @keyframes trophyBob {
    from { transform: translateY(0) rotate(-5deg); }
    to   { transform: translateY(-6px) rotate(5deg); }
  }

  /* ===== 晃动特效 ===== */
  .board-shake { animation: boardShake 0.22s ease; }
  @keyframes boardShake {
    0%, 100% { transform: translate(0,0); }
    25%      { transform: translate(-3px, 1px); }
    50%      { transform: translate(2px, -2px); }
    75%      { transform: translate(-2px, 2px); }
  }
</style>
</head>
<body>

<div class="app">

    <div>力度越大飞得越远哦～</div>
    <button class="ok" id="guideOk">开 始 游 戏</button>

</div>

<!-- 结果弹窗 -->

      <button class="ghost" id="modalClose">关闭</button>
      <button id="modalAgain">再来一次</button>
    </div>
  </div>

<script>
/* ========= 配置 ========= */
const PEG_ROWS   = 6;         // 钉子层数 (减少一半)
const PEG_COLS   = 5;         // 每层钉子数 (奇偶交错)
const PEG_RADIUS = 12;        // 钉子半径 (px，略大更醒目)

const PRIZES = [
  { text: "1 欢喜",   reward: 1,    weight: 20, icon: "🎁" },
  { text: "2 欢喜",   reward: 2,    weight: 15, icon: "🎁" },
  { text: "❤️ 加油",  reward: 0,    weight: 10, icon: "❤️" },
  { text: "5 欢喜",   reward: 5,    weight: 10, icon: "🎁" },
  { text: "🎁 再来",  reward: 0,    weight: 10, icon: "🎁" },
  { text: "3 欢喜",   reward: 3,    weight: 10, icon: "🎁" },
  { text: "谢谢参与", reward: 0,    weight: 20, icon: "🙏" },
  { text: "10 欢喜",  reward: 10,   weight: 5,  icon: "🏆" }
];

/* ========= DOM 引用 ========= */
const stage       = document.getElementById('stage');
const pegBoard    = document.getElementById('pegBoard');
const prizeRow    = document.getElementById('prizeRow');
const ball        = document.createElement('div');
ball.className = 'ball';
pegBoard.appendChild(ball);

const btnLaunch   = document.getElementById('btnLaunch');
const btnLabel    = document.getElementById('btnLabel');
const powerBar    = document.getElementById('powerBar');
const powerWrap   = document.getElementById('powerWrap');
const hintText    = document.getElementById('hintText');
const halo        = document.getElementById('halo');
const cooldownRing = document.getElementById('cooldownRing');
const cooldownText = document.getElementById('cooldownText');
const puppet      = document.getElementById('puppet');
const resultBanner = document.getElementById('resultBanner');

const modal        = document.getElementById('modal');
const modalIcon    = document.getElementById('modalIcon');
const modalTitle   = document.getElementById('modalTitle');
const modalDesc    = document.getElementById('modalDesc');
const modalClose   = document.getElementById('modalClose');
const modalAgain   = document.getElementById('modalAgain');

const guide        = document.getElementById('guide');
const guideOk      = document.getElementById('guideOk');

/* ========= 构建钉子 + 奖品槽 ========= */
let pegs = [];   // {x, y, r, color, el}
let prizes = []; // {x, y, w, el, text, reward, weight, index}

function buildBoard() {
  // 清空旧钉
  pegs.forEach(p => p.el && p.el.remove());
  pegs = [];
  prizes.forEach(p => p.el && p.el.remove());
  prizes = [];
  prizeRow.innerHTML = '';

  const rect = pegBoard.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;

  // 钉子排布
  const rows = PEG_ROWS;
  const cols = PEG_COLS;
  const xStep = W / (cols + 1);
  const yStep = (H - 20) / (rows + 1);
  const colorCycle = ['c1','c2','c3','c4','c5','c6'];

  for (let r = 0; r < rows; r++) {
    const n = (r % 2 === 0) ? cols : cols - 1;
    const offsetX = (r % 2 === 0) ? 0 : xStep / 2;
    for (let c = 0; c < n; c++) {
      const x = offsetX + xStep * (c + 1);
      const y = 16 + yStep * (r + 1);
      const el = document.createElement('div');
      el.className = 'peg ' + colorCycle[(r + c) % colorCycle.length];
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      pegBoard.appendChild(el);
      pegs.push({ x, y, r: PEG_RADIUS, color: colorCycle[(r + c) % colorCycle.length], el });
    }
  }

  // 奖品槽
  PRIZES.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'prize p' + i;
    el.innerHTML = `
      <div class="label">${p.text}</div>
      <div class="slot"></div>
    `;
    prizeRow.appendChild(el);
    prizes.push({ el, text: p.text, reward: p.reward, weight: p.weight, icon: p.icon, index: i });
  });
}

/* ========= 发射按钮光环粒子 ========= */
function buildHalo() {
  for (let i = 0; i < 10; i++) {
    const dot = document.createElement('div');
    dot.className = 'particle';
    dot.style.animationDelay = (i * 0.4) + 's';
    dot.style.transform = `rotate(${i * 36}deg) translate(60px)`;
    halo.appendChild(dot);
  }
}

/* ========= 状态 ========= */
let charging = false;
let chargeStartTime = 0;
let chargeValue = 0;      // 0 ~ 1 循环式
let rafId = null;

let flying = false;
let cooling = false;

/* ========= 蓄力逻辑 ========= */
function startCharge() {
  if (flying || cooling) return;
  charging = true;
  chargeStartTime = performance.now();
  btnLaunch.classList.add('pressing','charging');
  hintText.textContent = '继续按住蓄力…';
  hintText.classList.add('show');
  tickCharge();
}

function tickCharge() {
  if (!charging) return;
  const elapsed = (performance.now() - chargeStartTime) / 2000; // 2 秒循环
  chargeValue = elapsed - Math.floor(elapsed); // 0~1 循环
  powerBar.style.height = (chargeValue * 100).toFixed(1) + '%';

  // 充能等级
  btnLaunch.classList.remove('mid','high');
  if (chargeValue > 0.66)      btnLaunch.classList.add('high');
  else if (chargeValue > 0.33) btnLaunch.classList.add('mid');

  // 文字提示切换
  if (chargeValue > 0.2 && chargeValue < 0.4) {
    hintText.textContent = '力度适中！';
  } else if (chargeValue > 0.7) {
    hintText.textContent = '松手发射！';
  } else {
    hintText.textContent = '继续按住蓄力…';
  }

  rafId = requestAnimationFrame(tickCharge);
}

function releaseCharge() {
  if (!charging) return;
  charging = false;
  if (rafId) cancelAnimationFrame(rafId);
  btnLaunch.classList.remove('pressing','charging','mid','high');
  hintText.classList.remove('show');

  // 立即归零
  powerBar.style.height = '0%';

  // 发射
  const power = chargeValue; // 0~1
  launchBall(power);
}

/* ========= 弹珠物理 ========= */
let ballState = null;

function launchBall(power) {
  // 木偶做捂眼偷看
  puppet.classList.add('peek');

  const stageRect = stage.getBoundingClientRect();
  const boardRect = pegBoard.getBoundingClientRect();
  const W = boardRect.width;
  const H = boardRect.height;

  // 发射口位置 — 钉板下方中心区域 (弹珠从底部中间被弹起)
  const startX = W / 2;
  const startY = H - 20;

  // 角度与初速度：力度越大 → 向上初速度越大 & 左右偏移
  // 给一个略带随机的水平方向扰动
  const horizontalBias = (Math.random() - 0.5) * (0.4 + power * 0.6);
  const baseSpeed = 10 + power * 16;    // 10 ~ 26
  const vx = horizontalBias * baseSpeed * 0.4;
  const vy = -baseSpeed;                // 负值 = 向上 (大力弹射)

  ballState = {
    x: startX,
    y: startY,
    vx, vy,
    r: 13,
    alive: true,
    stuckPrize: null
  };

  flying = true;
  ball.style.display = 'block';

  // 发射瞬间特效：按钮爆裂粒子 + 舞台震动
  burstLaunch(startX, startY);
  stage.classList.remove('board-shake');
  void stage.offsetWidth;
  stage.classList.add('board-shake');

  tickBall();
}

function tickBall() {
  if (!ballState || !ballState.alive) return;
  const boardRect = pegBoard.getBoundingClientRect();
  const W = boardRect.width;
  const H = boardRect.height;

  // 物理参数 —— 中等引力，弹珠可以弹得更久，更有节奏感
  const gravity = 0.38;
  const damping = 0.997;

  ballState.vy += gravity;
  ballState.vx *= damping;
  ballState.vy *= damping;
  ballState.x  += ballState.vx;
  ballState.y  += ballState.vy;

  // 左右墙壁反弹
  if (ballState.x < ballState.r) {
    ballState.x = ballState.r;
    ballState.vx = -ballState.vx * 0.7;
  }
  if (ballState.x > W - ballState.r) {
    ballState.x = W - ballState.r;
    ballState.vx = -ballState.vx * 0.7;
  }

  // 与钉子碰撞
  for (const peg of pegs) {
    const dx = ballState.x - peg.x;
    const dy = ballState.y - peg.y;
    const dist = Math.hypot(dx, dy);
    const minDist = ballState.r + peg.r;
    if (dist < minDist && dist > 0.01) {
      // 法向量
      const nx = dx / dist;
      const ny = dy / dist;
      // 推出
      const overlap = minDist - dist;
      ballState.x += nx * overlap;
      ballState.y += ny * overlap;
      // 速度反射 (v' = v - 2*(v·n)*n)
      const vn = ballState.vx * nx + ballState.vy * ny;
      if (vn < 0) {
        ballState.vx = (ballState.vx - 2 * vn * nx) * 0.82;
        ballState.vy = (ballState.vy - 2 * vn * ny) * 0.82;
      }
      // 随机扰动
      ballState.vx += (Math.random() - 0.5) * 2.0;
      ballState.vy += (Math.random() - 0.5) * 1.4;

      // 碰撞视觉：钉子发光抖动 + 大量粒子
      flashPeg(peg);
      spawnStardust(peg.x, peg.y, peg.color, true);
      stage.classList.remove('board-shake');
      void stage.offsetWidth;
      stage.classList.add('board-shake');
    }
  }

  // 进入奖品槽判断：进入下部且速度较慢
  const prizeAreaY = H - 90;
  if (ballState.y > prizeAreaY && ballState.vy > -1) {
    // 根据 x 位置决定落在哪一个槽
    const n = prizes.length;
    const slotW = W / n;
    let idx = Math.floor(ballState.x / slotW);
    if (idx < 0) idx = 0;
    if (idx >= n) idx = n - 1;

    // 加入"概率加权"扰动 — 让中心/两侧偏向概率
    // 简单策略：如果权重极低，则 50% 概率迁移到相邻槽
    // (此处保持真实物理落点，权重用于 modal 文案展示)

    ballState.stuckPrize = idx;
    ballState.alive = false;
    settleBall(idx);
    return;
  }

  // 飞出顶部保护：弹回来（让它有强烈弹射感）
  if (ballState.y < 10) {
    ballState.y = 10;
    ballState.vy = Math.abs(ballState.vy) * 0.5;
  }

  // 更新位置
  ball.style.left = (ballState.x - 13) + 'px';
  ball.style.top  = (ballState.y - 13) + 'px';

  requestAnimationFrame(tickBall);
}

/* 弹珠落入槽 */
function settleBall(idx) {
  const prize = prizes[idx];
  const rect = pegBoard.getBoundingClientRect();
  const slotW = rect.width / prizes.length;
  const targetX = slotW * idx + slotW / 2;
  const targetY = rect.height - 40;

  // 简单补间动画，把球吸到目标
  let t = 0;
  const startX = ballState.x;
  const startY = ballState.y;
  function animate() {
    t += 0.08;
    const k = Math.min(1, t);
    const ease = 1 - Math.pow(1 - k, 3);
    ball.style.left = (startX + (targetX - startX) * ease - 13) + 'px';
    ball.style.top  = (startY + (targetY - startY) * ease - 13) + 'px';
    if (k < 1) requestAnimationFrame(animate);
    else {
      // 点亮槽
      triggerWin(idx);
    }
  }
  animate();
}

/* ========= 中奖 ========= */
function triggerWin(idx) {
  const prize = prizes[idx];
  prize.el.classList.add('win');

  // 木偶停止偷看
  setTimeout(() => puppet.classList.remove('peek'), 800);

  // 分数飘字
  showFloatScore(prize);

  // 顶部中奖横幅显示
  showResultBanner(prize);

  // 粒子爆裂
  const rect = prize.el.getBoundingClientRect();
  const boardRect = pegBoard.getBoundingClientRect();
  const cx = rect.left + rect.width / 2 - boardRect.left;
  const cy = rect.top - boardRect.top + 10;
  for (let i = 0; i < 22; i++) spawnStardust(cx, cy, 'c' + ((idx % 6) + 1), true);

  flying = false;

  // 展示结果
  setTimeout(() => {
    showResult(prize);
  }, 900);

  // 进入冷却
  startCooldown();
}

// 顶部中奖横幅
function showResultBanner(prize) {
  if (!resultBanner) return;
  let text = '🎯 ';
  if (prize.reward >= 5)      text += '🏆 大奖！' + prize.text;
  else if (prize.reward > 0)  text += '🎉 中奖：' + prize.text;
  else if (prize.text.includes('再来')) text += '🎁 再来一次！';
  else if (prize.text.includes('加油')) text += '💪 加油！';
  else                          text += '🙏 谢谢参与';
  resultBanner.textContent = text;
  resultBanner.classList.add('show');
  // 3.5 秒后隐藏
  clearTimeout(showResultBanner._t);
  showResultBanner._t = setTimeout(() => resultBanner.classList.remove('show'), 3500);
}

// 钉子碰撞发光抖动
function flashPeg(peg) {
  if (!peg.el) return;
  peg.el.animate([
    { transform: 'translate(-50%,-50%) scale(1)', filter: 'brightness(1)' },
    { transform: 'translate(-50%,-50%) scale(1.35)', filter: 'brightness(1.8) drop-shadow(0 0 8px #fff)' },
    { transform: 'translate(-50%,-50%) scale(1)', filter: 'brightness(1)' }
  ], { duration: 220, easing: 'ease-out' });
}

// 发射瞬间爆裂
function burstLaunch(x, y) {
  const colors = ['c1','c2','c3','c4','c5','c6'];
  for (let i = 0; i < 20; i++) {
    spawnStardust(x, y, colors[i % 6], true);
  }
  // 发射瞬间弹珠放大脉冲
  if (ball) {
    ball.animate([
      { transform: 'scale(1)' , opacity: 1 },
      { transform: 'scale(1.8)', opacity: 0.8 },
      { transform: 'scale(1)' , opacity: 1 }
    ], { duration: 280, easing: 'cubic-bezier(0.2,0.8,0.3,1)' });
  }
}

function showFloatScore(prize) {
  const pRect = prize.el.getBoundingClientRect();
  const bRect = pegBoard.getBoundingClientRect();
  const x = pRect.left + pRect.width / 2 - bRect.left;
  const y = pRect.top - bRect.top;

  const el = document.createElement('div');
  el.className = 'float-score';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  if (prize.reward > 0)      el.textContent = '+' + prize.reward + ' 欢喜';
  else if (prize.text.includes('再来')) el.textContent = '再来一次！';
  else if (prize.text.includes('加油')) el.textContent = '加油！';
  else                       el.textContent = '谢谢参与';
  pegBoard.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function startCooldown() {
  cooling = true;
  btnLaunch.classList.add('cooling');
  cooldownRing.classList.add('on');
  cooldownText.classList.add('on');
  let left = 3;
  cooldownText.textContent = left;
  const timer = setInterval(() => {
    left -= 1;
    if (left <= 0) {
      clearInterval(timer);
      cooldownRing.classList.remove('on');
      cooldownText.classList.remove('on');
      btnLaunch.classList.remove('cooling');
      cooling = false;
    } else {
      cooldownText.textContent = left;
    }
  }, 1000);
}

/* ========= 星尘粒子 ========= */
function spawnStardust(x, y, color, strong) {
  const dot = document.createElement('div');
  dot.className = 'stardust';
  dot.style.left = x + 'px';
  dot.style.top  = y + 'px';
  const colors = {
    c1: '#ff7070', c2: '#ffb050', c3: '#ffdd55',
    c4: '#7bdc70', c5: '#6babff', c6: '#b479ff'
  };
  const bg = colors[color] || '#ffcf6a';
  const size = strong ? (8 + Math.random() * 6) : (6 + Math.random() * 3);
  dot.style.width  = size + 'px';
  dot.style.height = size + 'px';
  dot.style.background = `radial-gradient(circle, ${bg}, transparent 70%)`;
  dot.style.boxShadow = `0 0 ${strong ? 14 : 8}px ${bg}`;
  pegBoard.appendChild(dot);

  const angle = Math.random() * Math.PI * 2;
  const dist  = (strong ? 22 : 18) + Math.random() * (strong ? 42 : 30);
  const dx = Math.cos(angle) * dist;
  const dy = Math.sin(angle) * dist - (strong ? 10 : 6);
  const dur = (strong ? 520 : 450) + Math.random() * 300;

  dot.animate([
    { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.15)`, opacity: 0 }
  ], { duration: dur, easing: 'cubic-bezier(0.2,0.8,0.3,1)' });

  setTimeout(() => dot.remove(), dur);
}

/* ========= 结果弹窗 ========= */
function showResult(prize) {
  modalIcon.textContent = prize.icon || '🎁';
  if (prize.reward >= 5) {
    modalTitle.textContent = '大 奖';
    modalDesc.innerHTML = `恭喜获得 <b style="color:#b8441a">${prize.text}</b><br/>真是太幸运啦！`;
  } else if (prize.reward > 0) {
    modalTitle.textContent = '中 奖';
    modalDesc.innerHTML = `获得 <b style="color:#b8441a">${prize.text}</b>`;
  } else if (prize.text.includes('再来')) {
    modalTitle.textContent = '再 来';
    modalDesc.textContent = '再来一次吧！';
  } else if (prize.text.includes('加油')) {
    modalTitle.textContent = '加 油';
    modalDesc.textContent = '下次一定！';
  } else {
    modalTitle.textContent = '很遗憾';
    modalDesc.textContent = '谢谢参与，再接再厉～';
  }
  modal.classList.add('on');
}

function closeModal() {
  modal.classList.remove('on');
  // 清理中奖高亮 + 弹珠 + 顶部横幅
  prizes.forEach(p => p.el.classList.remove('win'));
  if (ball) ball.style.display = 'none';
  if (resultBanner) resultBanner.classList.remove('show');
}

/* ========= 事件绑定 ========= */
function bindEvents() {
  // pointer 事件：兼容鼠标 + 触屏
  btnLaunch.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    startCharge();
  });
  const endEvents = ['pointerup','pointercancel','pointerleave'];
  endEvents.forEach(ev => {
    btnLaunch.addEventListener(ev, (e) => {
      if (charging) { e.preventDefault(); releaseCharge(); }
    });
  });

  modalClose.addEventListener('click', closeModal);
  modalAgain.addEventListener('click', () => {
    closeModal();
  });

  guideOk.addEventListener('click', () => {
    guide.style.display = 'none';
  });

  // 窗口大小变化时重建 (让布局自适应)
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      buildBoard();
    }, 200);
  });
}

/* ========= 初始化 ========= */
function init() {
  buildBoard();
  buildHalo();
  bindEvents();
}

// 等待布局完成后再测量尺寸
window.addEventListener('load', () => {
  setTimeout(init, 80);
});
</script>
</body>
